  const i = groups.findIndex(g => g.group === group);
  if (i < 0) return;
  const j = i + delta;
  if (j < 0 || j >= groups.length) return;
  const tmp = groups[i];
  groups[i] = groups[j];
  groups[j] = tmp;
  scheme.length = 0;
  for (const g of groups) for (const q of g.questions) scheme.push(q);
}

// Reorder a whole group one step. The "for all" switch decides whether the move is
// mirrored in every student's scheme or only the current one.
function moveGroup(group, dir) {
  const delta = dir === "up" ? -1 : 1;
  saveCurrentStudent();
  if (forAll) {
    if (students.length === 0) moveGroupInScheme(schemeFor(""), group, delta); // draft
    else for (const name of students) moveGroupInScheme(schemeFor(name), group, delta);
  } else {
    moveGroupInScheme(schemeFor(currentStudent), group, delta);
  }
  renderQuestions();
}

// Remove a question (by key). The "for all" switch decides whether it is dropped for
// every student or only the current one.
function removeQuestion(key) {
  const title = (schemeQuestions.find(q => qKey(q) === key) || {}).title || key;
  const msg = forAll
    ? 'Remove question "' + title + '"? Its scores and comments for all students will be lost.'
    : 'Remove question "' + title + '" for ' + (currentStudent || "this student") + '? Its score and comment will be lost.';
  if (!confirm(msg)) return;
  saveCurrentStudent();
  if (forAll) {
    if (students.length === 0) removeQuestionFromStudent("", key); // draft
    else for (const name of students) removeQuestionFromStudent(name, key);
  } else {
    removeQuestionFromStudent(currentStudent, key);
  }
  recomputeGroups();
  renderQuestions();
}

// Remove every question in a group (and its grades/comments) from one student's scheme.
function removeGroupFromStudent(name, group) {
  const scheme = schemeFor(name);
  for (let i = scheme.length - 1; i >= 0; i--) {
    const q = scheme[i];
    if ((q.group || "") !== group) continue;
    const key = qKey(q);
    scheme.splice(i, 1);
    if (name) {
      if (gradesByStudent[name]) delete gradesByStudent[name][key];
      if (commentsByStudent[name]) delete commentsByStudent[name][key];
      if (imagesByStudent[name]) delete imagesByStudent[name][key];
    }
    openShots.delete(key);
  }
}

// Remove a whole group and all its questions. The "for all" switch decides whether it
// is dropped for every student or only the current one.
function removeGroup(group) {
  const label = group ? 'group "' + group + '"' : "the default group";
  const msg = forAll
    ? 'Remove ' + label + ' and all its questions? Their scores and comments for all students will be lost.'
    : 'Remove ' + label + ' and all its questions for ' + (currentStudent || "this student") + '? Their scores and comments will be lost.';
  if (!confirm(msg)) return;
  saveCurrentStudent();
  if (forAll) {
    if (students.length === 0) removeGroupFromStudent("", group); // draft
    else for (const name of students) removeGroupFromStudent(name, group);
  } else {
    removeGroupFromStudent(currentStudent, group);
  }
  recomputeGroups();
  renderQuestions();
}

// =====================================================================
// Question rendering
// =====================================================================

// A thin vertical rule, separating one part of a question row from the next.
function buildVSep() {
  const sep = document.createElement("span");
  sep.className = "vsep";
  return sep;
}

// Partition a scheme into groups: a list of { group, questions } in first-appearance
// order, each gathering every question of that group (so a group renders once,
// contiguously, even if its members are scattered in the array).
function groupedScheme(scheme) {
  const groups = [];
  const byName = {};
  for (const q of scheme) {
    const g = q.group || "";
    let bucket = byName[g];
    if (!bucket) { bucket = byName[g] = { group: g, questions: [] }; groups.push(bucket); }
    bucket.questions.push(q);
  }
  return groups;
}

// A fresh pencil icon node, for the edit toggle.
function editIcon() {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML =
    '<path d="M12 20h9"/>' +
    '<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>';
  return svg;
}

// A fresh tick icon node: what the edit toggle shows while editing, since pressing it then
// applies the changes (the same tick as the dialogs' own ✓).
function checkIcon() {
  return svgIcon('<polyline points="20 6 9 17 4 12"/>');
}

// The ▲▼ pair of a question row (only rendered while it is being edited).
function buildQuestionMoves(key, disableUp, disableDown) {
  const wrap = document.createElement("div");
  wrap.className = "qmove-group";
  ["up", "down"].forEach(dir => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "qmove";
    btn.title = "Move question " + dir;
    if (key !== null) btn.dataset.key = key;
    btn.dataset.dir = dir;
    btn.disabled = dir === "up" ? disableUp : disableDown;
    wrap.appendChild(btn);
  });
  return wrap;
}

// The first entry of a score box's list: picking it clears the grade.
const CLEAR_SCORE = "—";   // em dash

// A question's score box: the grade as a number, empty when ungraded. Its list offers the
// uncommon scores — the ones after the "|", which have no key — plus "—" to clear, and any
// other number can be typed in: the grade does not have to be one the scheme listed.
function buildScoreBox(q, key) {
  const combo = document.createElement("div");
  combo.className = "combo qscore-combo";
  combo.title = "Score";

  const box = document.createElement("input");
  box.type = "text";
  box.className = "qscorebox";        // not "qcomment": that class is what comments are read from
  box.dataset.key = key;
  box.autocomplete = "off";
  const texts = q.scores.map(fmt);
  box._comboItems = () => [CLEAR_SCORE].concat(texts.slice(q.split));
  // A score picked from the list is final: it is stored and the box hands the keyboard back to
  // the grid at once, as Enter on a typed score does. A comment keeps the box after a pick,
  // since more is often typed after a suggestion; a score never has anything to add.
  box._comboSelect = (v) => { box.value = v === CLEAR_SCORE ? "" : v; kbLeaveCell(true, box); };
  // The list opens on a row Enter can take at once: the grade already given when it is one of
  // the list's, else on an ungraded row the first score ("—" would clear a grade there is not).
  // A grade the list has not got (a key's) highlights nothing, so Enter leaves it as it is.
  box._comboStartIndex = items => {
    if (box.value) return items.indexOf(box.value);
    return items.length > 1 ? 1 : -1;
  };
  box.addEventListener("change", () => onScoreBoxChange(box));
  box.addEventListener("focus", () => openCombo(box));
  // A number typed in is the grade wanted: the highlight goes, so Enter takes what was typed.
  // (Tab or the down arrow walk the list again from its first row.)
  box.addEventListener("input", () => {
    if (activeComboInput === box) { comboIndex = -1; paintComboCursor(); }
  });
  // Just wide enough for the widest score it may have to show — which is any of them, since
  // a key fills it too — plus its own side padding (the box is border-box like everything).
  box.style.width = "calc(" + Math.max(2, ...texts.map(t => t.length)) + "ch + 18px)";

  combo.appendChild(box);
  return combo;
}

// Build one question row. disableUp/disableDown reflect the question's position
// within its own group (moves stay inside the group). `q` is a scheme question, or
// `editingDraft` when this is the not-yet-created row (isDraft), which is always edited.
function buildQuestionBlock(q, disableUp, disableDown, isDraft) {
    const key = isDraft ? null : qKey(q); // identifier for the DOM/state; the row displays q.title
    const editing = isDraft || (editingKey !== null && key === editingKey);
    const block = document.createElement("div");
    block.className = "question" + (editing ? " editing" : "");
    if (isDraft) block.dataset.draft = "1";

    // ---- Edit mode: the question's own definition, not its grade ----
    // Same three fields the add bar used to carry, then the controls that only make
    // sense here: reorder, remove, and the edit toggle that applies everything.
    if (editing) {
      const tinput = document.createElement("input");
      tinput.type = "text";
      tinput.className = "qedit-title";
      tinput.placeholder = FIRST_QUESTION.title;
      tinput.title = "Question title";
      tinput.value = q.title || "";
      block.appendChild(tinput);

      const sinput = document.createElement("input");
      sinput.type = "text";
      sinput.className = "qedit-scores";
      sinput.placeholder = FIRST_QUESTION.scores;
      sinput.title = "Possible scores, in the order they should appear. "
                   + "Scores after a | have no button: they live only in the score box.";
      sinput.value = scoreSpecText(q);
      block.appendChild(sinput);

      const gcombo = document.createElement("div");
      gcombo.className = "combo qedit-combo";
      gcombo.title = "Question group (leave blank for none)";
      const ginput = document.createElement("input");
      ginput.type = "text";
      ginput.className = "qedit-group";
      ginput.placeholder = "Ex. 1";
      ginput.autocomplete = "off";
      ginput.value = q.group || "";
      ginput._comboItems = () => questionGroups;
      ginput._comboSelect = (name) => { ginput.value = name; };
      ginput.addEventListener("focus", () => openCombo(ginput));
      const garrow = document.createElement("button");
      garrow.type = "button";
      garrow.className = "combo-arrow";
      garrow.tabIndex = -1;
      garrow.textContent = "▾";
      garrow.addEventListener("mousedown", e => {
        e.preventDefault(); // keep focus where it is
        (activeComboInput === ginput && comboPopup.classList.contains("open"))
          ? closeCombo() : openCombo(ginput);
      });
      gcombo.appendChild(ginput);
      gcombo.appendChild(garrow);
      block.appendChild(gcombo);

      // A draft sits at the end of the list and has nothing to swap with yet.
      block.appendChild(buildQuestionMoves(key, isDraft || disableUp, isDraft || disableDown));

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "qremove";
      remove.title = isDraft ? "Discard this question" : "Remove question";
      remove.textContent = "✕";
      if (key !== null) remove.dataset.key = key;
      block.appendChild(remove);

      block.appendChild(buildForAllToggle()); // scope of everything this row applies
      block.appendChild(buildEditToggle(key, true));
      return block;
    }

    const title = document.createElement("div");
    title.className = "qtitle";
    title.textContent = q.title;
    block.appendChild(title);
    block.appendChild(buildVSep());
    block.appendChild(buildScoreBox(q, key));   // the grade first, its keys after
    block.appendChild(buildVSep());

    block.dataset.key = key;   // the renderer paints this row from the stored grade

    // A key per frequent score (those before the "|"); it sets the grade, and pressing the
    // one already holding it clears the grade. The rest are only in the score box.
    const options = document.createElement("div");
    options.className = "options";
    for (const score of q.scores.slice(0, q.split == null ? q.scores.length : q.split)) {
      const opt = document.createElement("button");
      opt.type = "button";
      opt.className = "opt";
      opt.dataset.key = key;
      opt.dataset.score = String(score);
      opt.textContent = fmt(score);
      options.appendChild(opt);
    }
    block.appendChild(options);
    if (options.childElementCount) block.appendChild(buildVSep());  // none when there are no keys

    const combo = document.createElement("div");
    combo.className = "combo";
    const comment = document.createElement("input");
    comment.type = "text";
    comment.className = "qcomment";
    comment.placeholder = "";
    comment.dataset.key = key;
    comment.autocomplete = "off";
    comment._comboSelect = (val) => { pickPhrase(comment, val); onCommentChange(comment); };
    // Its list is every comment already written (see phraseBox): there is nothing to manage.
    // No arrow: a click unfolds it, and so does typing.
    phraseBox(comment, () => onCommentChange(comment));
    comment.addEventListener("change", () => onCommentChange(comment));
    redrawComboOnInput(comment);
    combo.appendChild(comment);
    block.appendChild(combo);

    block.appendChild(buildCaptureButton(key));
    const shotsBtn = buildShotsButton(key);
    if (shotsBtn) block.appendChild(shotsBtn);

    // Reordering and removing live in edit mode; grading rows stay uncluttered.
    block.appendChild(buildEditToggle(key, false));

    // Last, and full width: the thumbnails wrap onto their own line under the row.
    block.appendChild(buildShotsPanel(key));

    return block;
}

// The "apply to all students" switch, rebuilt with the row it belongs to — it only has a
// meaning while a question is being edited. `forAll` is the state; the icon mirrors it,
// pressed in like the pencil next to it. Toggling only touches the button, so whatever is
// half-typed in the row's fields stays put.
function buildForAllToggle() {
  const btn = document.createElement("button");
  btn.type = "button";
  const paint = () => {
    btn.className = "forall-toggle" + (forAll ? " on" : "");
    btn.title = forAll ? "Applies to all students" : "Applies to this student only";
  };
  paint();
  btn.addEventListener("click", () => { forAll = !forAll; paint(); });

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML =
    '<circle cx="9" cy="7" r="4"/>' +
    '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>' +
    '<path d="M23 21v-2a4 4 0 0 0-3-3.87"/>' +
    '<path d="M16 3.13a4 4 0 0 1 0 7.75"/>';
  btn.appendChild(svg);

  return btn;
}

// ---- Captured rectangles on a question row ----
// Two buttons sit between the comment box and the pencil: one arms a capture, one folds the
// thumbnails open. The thumbnails live in a panel that is the row's last child and spans the
// whole row (.question wraps), so it reads as a second line under the question.

// A fresh icon node, built like editIcon(): `body` is the SVG's inner markup.
function svgIcon(body) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = body;
  return svg;
}

// Crop marks: what the capture button offers.
function cropIcon() {
  return svgIcon('<path d="M6 2v16a2 2 0 0 0 2 2h14"/><path d="M2 6h16a2 2 0 0 1 2 2v14"/>');
}

// A picture: what the fold button reveals.
function imageIcon() {
  return svgIcon('<rect x="3" y="4" width="18" height="16" rx="2"/>' +
                 '<circle cx="8.5" cy="9.5" r="1.4"/><path d="M21 15l-5-4L5 20"/>');
}

// This student's captures for one question (never null, never shared).
function shotsFor(key) {
  const byQ = currentStudent ? imagesByStudent[currentStudent] : null;
  return (byQ && byQ[key]) || [];
}

// The capture button. Always present, pressed in while it is the armed one.
function buildCaptureButton(key) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "qcapture" + (capState && capState.key === key ? " on" : "");
  btn.title = "Capture a rectangle from the PDF and mark it in red";
  btn.dataset.key = key;
  btn.appendChild(cropIcon());
  return btn;
}

// The fold button — only on a question that has captures, so untouched rows look as before.
function buildShotsButton(key) {
  const n = shotsFor(key).length;
  if (!n) return null;
  const open = openShots.has(key);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "qshots" + (open ? " on" : "");
  btn.title = (open ? "Hide " : "Show ") + (n === 1 ? "the captured image" : n + " captured images");
  btn.dataset.key = key;
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  btn.appendChild(imageIcon());
  if (n > 1) {
    const badge = document.createElement("span");
    badge.className = "qshots-n";
    badge.textContent = n;
    btn.appendChild(badge);
  }
  return btn;
}

// The row's last child: the thumbnails, shown only while unfolded.
function buildShotsPanel(key) {
  const panel = document.createElement("div");
  panel.className = "qshots-panel" + (openShots.has(key) ? " open" : "");
  panel.dataset.key = key;
  fillShotsPanel(panel, key);
  return panel;
}

function fillShotsPanel(panel, key) {
  panel.innerHTML = "";
  shotsFor(key).forEach((shot, i) => {
    const fig = document.createElement("div");
    fig.className = "qshot" + (shot.w ? " sized" : "");
    // The width goes on the figure, not on the picture: a percentage wants a containing
    // block that has a width of its own, and the panel has one (it spans the row) while the
    // figure shrinks to fit whatever is in it.
    if (shot.w) fig.style.width = (shot.w * 100) + "%";
    const img = document.createElement("img");
    img.className = "qshot-img";
    img.src = shot.src;
    img.alt = "";
    img.title = "Draw on this capture";
    img.dataset.key = key;
    img.dataset.i = i;
    fig.appendChild(img);
    const act = (cls, title, label) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = cls;
      btn.title = title;
      btn.dataset.key = key;
      btn.dataset.i = i;
      if (label) btn.textContent = label;
      else btn.appendChild(editIcon());
      fig.appendChild(btn);
    };
    act("qshot-edit", "Draw on this capture", null);
    act("qshot-del", "Remove this capture", "✕");
    const grip = document.createElement("div");
    grip.className = "qshot-grip";
    grip.title = "Drag to set how wide this capture prints — double-click to undo";
    grip.dataset.key = key;
    grip.dataset.i = i;
    fig.appendChild(grip);
    panel.appendChild(fig);
  });
}

// Repaint one row's capture controls in place. The whole list is not re-rendered because
// that would close an open combo and lose the caret in a half-typed comment.
function paintShots(key) {
  const row = questionsEl.querySelector('.question[data-key="' + cssEscape(key) + '"]');
  if (!row || row.classList.contains("editing")) return;
  const old = row.querySelector(".qshots");
  const next = buildShotsButton(key);
  if (old && next) old.replaceWith(next);
  else if (old) old.remove();
  else if (next) row.insertBefore(next, row.querySelector(".qedit"));  // the pencil stays last
  const panel = row.querySelector(".qshots-panel");
  if (!panel) return;
  fillShotsPanel(panel, key);
  panel.classList.toggle("open", openShots.has(key) && shotsFor(key).length > 0);
}

function toggleShots(key) {
  if (openShots.has(key)) openShots.delete(key);
  else openShots.add(key);
  paintShots(key);
}

// How wide this capture is drawn, as a fraction of the slip it prints on; undefined puts it
// back to its natural size. Stored on the capture itself, so it rides along with it.
function setShotWidth(key, i, w) {
  const shot = shotsFor(key)[i];
  if (!shot) return;
  shot.w = w;
  paintShots(key);
}

function removeShot(key, i) {
  const arr = shotsFor(key);
  if (!arr.length || !(i >= 0) || i >= arr.length) return;
  arr.splice(i, 1);
  if (!arr.length) {
    delete imagesByStudent[currentStudent][key];
    openShots.delete(key);
  }
  paintShots(key);
}

// The pencil toggle that opens a question for editing; while it is open, a tick that applies it.
function buildEditToggle(key, on) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "qedit" + (on ? " on" : "");
  btn.title = on ? "Apply changes" : "Edit question";
  if (key !== null) btn.dataset.key = key;
  btn.appendChild(on ? checkIcon() : editIcon());   // while editing, a press validates
  return btn;
}

function renderQuestions() {
  // A popup anchored to a row we are about to destroy would be left pointing at nothing.
  if (activeComboInput && questionsEl.contains(activeComboInput)) closeCombo();
  questionsEl.innerHTML = "";
  // A question that was removed (or that belongs to another student) can't stay open.
  if (editingKey !== null && !schemeQuestions.some(q => qKey(q) === editingKey)) editingKey = null;
  if (schemeQuestions.length === 0) {
    // The placeholder stands in for an empty list — not above the first question being
    // created, where its margin would leave a gap that closes once that question is applied.
    if (!editingDraft) {
      const empty = document.createElement("div");
      empty.id = "questionsEmpty";
      // empty.innerHTML = 'No questions yet.<br>Click "Load" to open a file, or add a question below.';
      empty.innerHTML = '';
      questionsEl.appendChild(empty);
    }
  } else {
    // Render group by group. Each group gets a separator row carrying its name, a live
    // subtotal and up/down controls. The default group ("") shows a blank-named bar too,
    // but only when it sits alongside named groups; a plain ungrouped list stays flat.
    const groups = groupedScheme(schemeQuestions);
    groups.forEach((grp, gi) => {
      if (grp.group || groups.length > 1) {
        const sep = document.createElement("div");
        sep.className = "qgroup";
        const nameSpan = document.createElement("span");
        nameSpan.className = "qgroup-name";
        nameSpan.textContent = grp.group;

        const right = document.createElement("div");
        right.className = "qgroup-right";
        const subSpan = document.createElement("span");
        subSpan.className = "qgroup-sub";
        subSpan.dataset.group = grp.group;
        right.appendChild(subSpan);

        const gmoveGroup = document.createElement("div");
        gmoveGroup.className = "qmove-group";
        ["up", "down"].forEach(dir => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "qmove qgmove";
          btn.title = "Move group " + dir;
          btn.dataset.group = grp.group;
          btn.dataset.dir = dir;
          btn.disabled = dir === "up" ? (gi === 0) : (gi === groups.length - 1);
          gmoveGroup.appendChild(btn);
        });
        right.appendChild(gmoveGroup);

        const gremove = document.createElement("button");
        gremove.type = "button";
        gremove.className = "qremove qgremove";
        gremove.title = "Remove group";
        gremove.textContent = "✕";
        gremove.dataset.group = grp.group;
        right.appendChild(gremove);

        sep.appendChild(nameSpan);
        sep.appendChild(right);
        questionsEl.appendChild(sep);
      }
      grp.questions.forEach((q, idx) => {
        questionsEl.appendChild(buildQuestionBlock(q, idx === 0, idx === grp.questions.length - 1, false));
      });
    });
  }

  // The question being created: a row in edit mode that no scheme holds yet.
  if (editingDraft) questionsEl.appendChild(buildQuestionBlock(editingDraft, true, true, true));

  questionsEl.appendChild(totalBar);       // total + feedback: the list's last row...
  totalBar.hidden = students.length === 0; // ...once there is a student to total
  questionsEl.appendChild(addQuestionBar); // the "+" sits at the bottom of the list
  // Always applies the current student — name, PDF position, feedback, grades and totals
  // (with an empty scheme, just the first three) — so selecting a student works before
  // any question exists.
  loadStudent(currentStudent);
  // The grading list is the keyboard's home: as soon as there is anything to grade at all,
  // the cursor starts on the first question, so Space and the digits work without an arrow
  // key first. Once only — Escape drops the cursor, and it must then stay dropped.
  if (!kbCursor && !kbEntered && kbRows().some(row => row !== totalBar)) {
    kbCursor = { key: kbRowKey(kbRows()[0]), at: 0 };
    kbEntered = true;
  }
  paintKbCursor(false);   // the rows are new elements; the keyboard cursor is not one
}

// Save a typed/selected comment for the current student (and so count its phrases).
function onCommentChange(input) {
  const key = input.dataset.key;
  const value = typedValue(input).trim();   // never a suggested ending not taken
  if (currentStudent) {
    if (!commentsByStudent[currentStudent]) commentsByStudent[currentStudent] = {};
    commentsByStudent[currentStudent][key] = value;
  }
}

// ---- The suggestion popup, shared by every combobox ----

function openCombo(input) {
  const items = (input._comboItems && input._comboItems()) || [];
  // Nothing to suggest and no toolbar: don't unfold at all (and fold any popup already open).
  // A list with a toolbar (the student list's) still unfolds when empty, for its buttons.
  if (items.length === 0 && !input._comboToolbar) { closeCombo(); return; }
  activeComboInput = input;
  comboPopup.innerHTML = "";
  // Optional toolbar above the items, like the other _combo* hooks: only the student
  // list sets it (to reorder students); every other combobox leaves it unset.
  if (input._comboToolbar) comboPopup.appendChild(input._comboToolbar());
  for (const s of items) {
    const item = document.createElement("div");
    // Optional per-item class, like the other _combo* hooks: only the student list uses
    // it (to colour each name by grading status); every other combobox leaves it unset.
    const cls = input._comboItemClass ? input._comboItemClass(s) : "";
    item.className = "combo-item" + (cls ? " " + cls : "");
    item.title = s;
    // Optional progress fill behind the text (the student list shows each student's
    // grading progress); every other combobox leaves the hook unset.
    const fraction = input._comboItemFill ? input._comboItemFill(s) : null;
    if (fraction != null) {
      const bar = document.createElement("div");
      bar.className = "combo-fill";
      bar.style.width = (100 * fraction) + "%";
      item.appendChild(bar);
    }
    const label = document.createElement("span");
    label.className = "combo-label";
    label.textContent = s;
    item.appendChild(label);
    // Optional greyed note after the text (the student list shows each student's group).
    const note = input._comboItemNote ? input._comboItemNote(s) : "";
    if (note) {
      const span = document.createElement("span");
      span.className = "combo-note";
      // Optional icon before it, as markup (the student list's group icon).
      if (input._comboItemNoteIcon) span.innerHTML = input._comboItemNoteIcon;
      span.appendChild(document.createTextNode(note));
      item.appendChild(span);
      item.title = s + " · " + note;
    }
    // Optional small tag after the note, as markup plus a tooltip text (the student list shows
    // each student's page: an icon and its number).
    const tag = input._comboItemTag ? input._comboItemTag(s) : null;
    if (tag) {
      const span = document.createElement("span");
      span.className = "combo-tag" + (tag.cls ? " " + tag.cls : "");
      span.innerHTML = tag.html;
      item.appendChild(span);
      if (tag.title) item.title += " · " + tag.title;
    }
    // Optional score last (the student list shows each student's running total over the
    // questions graded so far; a suggestion list, how often each phrase is used).
    const score = input._comboItemScore ? input._comboItemScore(s) : "";
    if (score) {
      const span = document.createElement("span");
      span.className = "combo-score";
      // Optional icon before it, as markup (the student list's grade icon; a suggestion list's
      // counts have none).
      if (input._comboItemScoreIcon) span.innerHTML = input._comboItemScoreIcon;
      span.appendChild(document.createTextNode(score));
      item.appendChild(span);
      item.title += " · " + score;
    }
    // What this row commits, for the keyboard: a click has it in hand already.
    item._comboValue = s;
    item.addEventListener("mousedown", e => { e.preventDefault(); selectComboItem(s); });
    comboPopup.appendChild(item);
  }
  // Optional footer under the items, mirroring the toolbar above them (the student list puts
  // its "+" there).
  if (input._comboFooter) comboPopup.appendChild(input._comboFooter());
  positionCombo();
  comboPopup.classList.add("open");
  // Keep the row that matters in view (a student just moved past the visible edge).
  const current = comboPopup.querySelector(".combo-item.current");
  if (current) current.scrollIntoView({ block: "nearest" });
  // The keyboard starts on the row that matters — the student already selected, say, or the
  // row the box offers first (_comboStartIndex: the score box's first score, a phrase box's top
  // suggestion), so Enter takes it without a Tab first. Every redraw comes back through here,
  // so a list narrowed by typing never keeps a stale row.
  comboIndex = comboNavRows().indexOf(comboPopup.querySelector(".combo-item.current"));
  if (comboIndex < 0 && input._comboStartIndex) comboIndex = input._comboStartIndex(items);
  paintComboCursor();
}

function positionCombo() {
  if (!activeComboInput) return;
  const combo = activeComboInput.closest(".combo");
  const r = combo.getBoundingClientRect();
  // The popup is fixed at the end of the body, outside #questions, so the grading zoom never
  // reaches it: its text would stay full size inside a box measured at the zoomed width, and
  // be clipped. Zoom it by the same factor, so it shrinks with the row that opened it.
  const z = questionsEl.contains(activeComboInput) ? gradeZoom : 1;
  comboPopup.style.zoom = z === 1 ? "" : z;
  // The rectangle below is in screen pixels; `zoom: z` multiplies back whatever we set here.
  const px = (v) => (v / z) + "px";
  comboPopup.style.left = px(r.left);
  comboPopup.style.width = px(r.width);
  const spaceBelow = window.innerHeight - r.bottom;
  const spaceAbove = r.top;
  // Flip the popup above the input when there's little room below (e.g. the
  // feedback combo sits in the bottom bar) and more room above.
  if (spaceBelow < 160 && spaceAbove > spaceBelow) {
    comboPopup.style.top = "";
    comboPopup.style.bottom = px(window.innerHeight - r.top);
    comboPopup.style.maxHeight = px(Math.max(120, spaceAbove - 8));
  } else {
    comboPopup.style.bottom = "";
    comboPopup.style.top = px(r.bottom);
    // Cap to the space available below the input so the scrollbar is always reachable.
    comboPopup.style.maxHeight = px(Math.max(120, spaceBelow - 8));
  }
}

function selectComboItem(value) {
  const input = activeComboInput;
  if (input && input._comboSelect) input._comboSelect(value);
  closeCombo();
}

function closeCombo() {
  comboIndex = -1;
  comboPopup.classList.remove("open");
  activeComboInput = null;
}

// A suggestion list follows its box as it is typed in. The phrase being typed (after the last
// ";") narrows it, and unfolds it when something matches; once nothing does, it folds. Only a
// suggestion that starts with the phrase is highlighted (see phraseBox), so Enter on a new
// phrase still means "this comment is done". Between two phrases (just after a ";") an open
// list shows everything and a folded one stays folded. The box itself is never
// touched, so the caret and any selection stay where they are. An event marked _quiet (see
// kbOpenComment) is the app's own and unfolds nothing. Text only counts as being typed from the
// moment it is typed (see currentSegment): taking the keys starts afresh.
function redrawComboOnInput(input) {
  input.addEventListener("focus", () => { input._typed = false; input._base = input.value; });
  input.addEventListener("input", e => {
    if (e._quiet) return;
    input._typed = true;
    input._completion = null;                 // whatever was on offer has been typed over
    // A deletion offers nothing back: Backspace takes the ending away, then the letters.
    input._deleting = String(e.inputType || "").startsWith("delete");
    const open = activeComboInput === input && comboPopup.classList.contains("open");
    if (open || currentSegment(input)) openCombo(input);   // openCombo folds an empty list
    if (!input._deleting) showCompletion(input);
  });
}

// The stored grade is the only grading state; the score keys, the score box and the row's
// colour are all painted from it. `value` of null (or NaN) means "not graded".
function setGrade(key, value) {
  if (currentStudent && gradesByStudent[currentStudent]) {
    if (value == null || isNaN(value)) delete gradesByStudent[currentStudent][key];
    else gradesByStudent[currentStudent][key] = value;
  }
  renderGrades();
  refreshStudentStatus();
  refreshProgress();
  recomputeTotal();
  recomputeSubtotals();
}

// Press a score key: it writes its score into the question's score box. That is all it does
// — it shows no state, and pressing it again just sets the same grade again. Clearing is
// done in the box ("—" in its list, or emptying it).
function pressOption(opt) {
  if (!opt) return;
  setGrade(opt.dataset.key, parseFloat(opt.dataset.score));
}

// A grade typed into (or picked from) a question's score box. Anything that is not a number
// is refused, and the box falls back to the stored grade.
function onScoreBoxChange(box) {
  const text = box.value.trim();
  if (text === "" || text === CLEAR_SCORE) { setGrade(box.dataset.key, null); return; }
  const n = toNum(text);
  if (isNaN(n)) { renderGrades(); return; }   // not a number: keep the grade, restore the box
  setGrade(box.dataset.key, n);
}

// Paint every row from the stored grades: the score box shows the grade (empty when there is
// none) and the row is marked ".ungraded" until it has one. The keys show nothing — they are
// buttons that set a score, not a picture of the current one.
function renderGrades() {
  const grades = (currentStudent && gradesByStudent[currentStudent]) || {};
  questionsEl.querySelectorAll(".qscorebox").forEach(box => {
    const v = grades[box.dataset.key];
    box.value = isGraded(v) ? fmt(v) : "";
  });
  questionsEl.querySelectorAll(".question").forEach(block => {
    if (block.classList.contains("editing")) return; // shows its definition, not its grade
    block.classList.toggle("ungraded", !isGraded(grades[block.dataset.key]));
  });
}

// =====================================================================
// The grading list as a keyboard grid
// =====================================================================

// Where the keyboard is in the list: one row, the question being graded. This is data and
// never DOM focus, because renderQuestions() rebuilds every row from scratch — a remembered
// element would be stale after each student switch — and because focus in a box means "the
// keys are yours now", which is the opposite of what the arrows do there. Space and
// Shift+Space are what hand them over.
//   key:  the question's key, or null for the total bar (whose one box is the feedback)
//   at:   the row's last known index, the fallback for when `key` is gone (see kbResolve)
// The key outlives a student switch, so stepping through the pile stays on the same
// question: grading one question across every copy is a matter of digits and Right.
let kbCursor = null;             // null = not in the list yet: nothing is outlined
let kbEntered = false;           // the list is entered by itself once, and not again

// The same digit pressed again straight away moves on to the next key that contains it (see
// kbDigit). This is what was pressed last — the row, the digit and which of its matches —
// and any other key, or a click, ends it (see the keydown handler).
let kbDigitRun = null;
// Keys that are only ever half of a keystroke. They neither end a digit run nor start one:
// on an AZERTY keyboard a digit is Shift plus its key, every time.
const KB_MODIFIERS = new Set(["Shift", "Control", "Alt", "AltGraph", "Meta", "CapsLock"]);

// One Shift+Up/Down scrolls the PDF about as far as one wheel notch, so holding it (on the
// keyboard's own autorepeat) reads as scrolling and not as jumping.
const KB_PDF_SCROLL = 100;

// Vim's four, so the right hand never leaves the middle of the keyboard: they stand in for
// the arrows exactly — up and down walk the questions, left and right the students.
const HOME_KEY = { h: "ArrowLeft", j: "ArrowDown", k: "ArrowUp", l: "ArrowRight" };

// The rows the cursor can be on, top to bottom: the grading rows, then the total bar while it
// shows (it waits for a student). A row open for editing is not one of them — it shows the
// question's definition and owns Enter and Escape itself — and neither are the group
// separators or the "+" bar.
function kbRows() {
  return Array.from(questionsEl.children).filter(el => (el === totalBar && !el.hidden)
    || (el.classList.contains("question") && !el.classList.contains("editing")));
}

function kbRowKey(row) { return row === totalBar ? null : row.dataset.key; }

// A row's two boxes, the ones the keyboard can type into: the score box (Shift+Space) and the
// comment (Space). The total bar has the feedback box alone.
function kbCells(row) {
  if (row === totalBar) return [{ role: "comment", el: globalFeedback }];
  const cells = [];
  const box = row.querySelector(".qscorebox");
  if (box) cells.push({ role: "score", el: box });
  const comment = row.querySelector(".qcomment");
  if (comment) cells.push({ role: "comment", el: comment });
  return cells;
}

// The cursor against the list as it is now. Everything that can happen to a row between two
// keystrokes is absorbed here, which is why nothing else has to know about any of it: a
// question that moved is still found by its key; one that was removed, or that this student's
// scheme has not got, or that just opened for editing, falls back to the row that took its
// place. Returns null only when there is no row at all.
function kbResolve() {
  if (!kbCursor) return null;
  const rows = kbRows();
  if (rows.length === 0) return null;
  let ri = rows.findIndex(row => kbRowKey(row) === kbCursor.key);
  if (ri < 0) ri = Math.min(Math.max(kbCursor.at, 0), rows.length - 1);
  const row = rows[ri];
  return { rows: rows, ri: ri, row: row, cells: kbCells(row) };
}

// Paint the cursor, and write back where it actually landed, so the next keystroke starts
// from what is on screen. `scroll` only on a real move: this also runs on every rebuild, and
// a rebuild must not scroll the list out from under the teacher's eyes.
function paintKbCursor(scroll) {
  for (const el of questionsEl.querySelectorAll(".kbcur")) el.classList.remove("kbcur");
  const r = kbResolve();
  if (!r) return;
  kbCursor.key = kbRowKey(r.row);
  kbCursor.at = r.ri;
  r.row.classList.add("kbcur");
  // A row already in view is left alone by scrollIntoView, which matters: any scroll of
  // #questions folds an open suggestion list. (jsdom has no implementation of it at all.)
  if (scroll && r.row.scrollIntoView)
    r.row.scrollIntoView({ block: "nearest", inline: "nearest" });
}

// The cursored row's box that holds the keyboard for typing, if one does. Derived and never
// stored: a click elsewhere, or beginEdit(), can take the focus away at any moment, and a
// stored flag would then be a lie.
function kbTypingBox() {
  const r = kbResolve();
  const cell = r && r.cells.find(c => c.el === document.activeElement);
  return cell ? cell.el : null;
}

function kbTyping() { return !!kbTypingBox(); }

// Up and down walk the questions. The first press with no cursor yet only enters the list,
// on its first row. It does not wrap: holding Down settles on the appréciation.
function kbMove(d) {
  const r = kbResolve();
  if (!r) {
    const rows = kbRows();
    if (rows.length === 0) return;
    kbCursor = { key: kbRowKey(rows[0]), at: 0 };
    paintKbCursor(true);
    return;
  }
  const row = r.rows[Math.min(Math.max(r.ri + d, 0), r.rows.length - 1)];
  kbCursor = { key: kbRowKey(row), at: r.rows.indexOf(row) };
  paintKbCursor(true);
}

// Put the cursor on the row that was just pressed, so the keyboard carries on from where the
// mouse left off. A press on no row leaves it where it is — and so does every press at all
// until the keyboard has been used once: a teacher working with the mouse alone should never
// be shown an outline they did not ask for.
function kbCursorTo(el) {
  if (!kbCursor) return;
  const row = el.closest(".question") || (totalBar.contains(el) ? totalBar : null);
  if (!row) return;
  const at = kbRows().indexOf(row);
  if (at < 0) return;                    // a row open for editing is not one to be on
  kbCursor = { key: kbRowKey(row), at: at };
  paintKbCursor(false);
}

// The score keys hold no state of their own (see .opt), so a key pressed from the keyboard
// has to say so for a moment — the same mark the mouse leaves while it holds one down.
function kbFlash(opt) {
  opt.classList.add("pressing");
  setTimeout(() => opt.classList.remove("pressing"), 120);
}

// The same word, said about a phrase: green for a moment, in the green that means "done"
// everywhere else in the list.
function kbFlashSaved(el) {
  const combo = el.closest(".combo") || el;
  combo.classList.add("kbsaved");
  setTimeout(() => combo.classList.remove("kbsaved"), 500);
}

// Hand the keys back to the list. Enter stores what the box holds, through the very call its
// own "change" makes — said rather than left to the blur below, which fires that change only
// in a real browser and only for a value the user themselves touched. Escape puts the stored
// value back instead, which is the whole difference between the two. The feedback box needs
// neither: it stores on every keystroke, so by the time Escape arrives there is nothing left
// to abandon. `box` says which box to leave when it is not the cursored row's — the score
// box's list can be picked from in a box the mouse opened, and that one is still left properly.
function kbLeaveCell(commit, box) {
  const el = box || kbTypingBox();
  if (!el) return;
  closeCombo();
  if (el.classList.contains("qscorebox")) {
    if (commit) onScoreBoxChange(el);
    else renderGrades();
  } else if (el !== globalFeedback) {
    if (commit) onCommentChange(el);
    else el.value = ((commentsByStudent[currentStudent] || {})[el.dataset.key]) || "";
  }
  el.blur();
  paintKbCursor(false);
}

// A digit grades the cursored question with a key whose label contains it: with the keys
// "0 0.5 1 1.5 2", 0 is 0, 5 is 0.5 and 1 is 1. The same digit pressed again straight away
// moves on to the next key that contains it, and round again: 1 then 1 is 1.5, and a third 1
// is back to 1. Only an immediate repeat moves on (see kbDigitRun): coming back to a question
// already at 1 and pressing 1 confirms the 1. It matches the label rather than the value,
// because the label is what the teacher reads. `run` is the digit run as it stood before this
// keystroke.
function kbDigit(ch, run) {
  const r = kbResolve();
  if (!r) return false;
  const key = kbRowKey(r.row);
  const matches = Array.from(r.row.querySelectorAll(".opt"))
                       .filter(o => o.textContent.indexOf(ch) >= 0);
  if (matches.length === 0) return false;   // nothing to grade with: the key keeps its meaning
  const i = (run && run.key === key && run.ch === ch) ? (run.i + 1) % matches.length : 0;
  pressOption(matches[i]);
  kbFlash(matches[i]);
  kbDigitRun = { key: key, ch: ch, i: i };
  return true;
}

// Open one of the cursored row's boxes for typing: "comment" (Space) or "score" (Shift+Space).
function kbOpenBox(role) {
  const r = kbResolve();
  if (!r) return false;
  const cell = r.cells.find(c => c.role === role);
  if (!cell) return false;
  cell.el.focus();
  paintKbCursor(true);
  return true;
}

// Space opens the comment of the row the cursor is on, ready to be typed into. On the last
// row that box is the appréciation.
function kbOpenComment() {
  if (!kbOpenBox("comment")) return false;
  const el = document.activeElement;
  // An empty box takes nothing: a comment should not open with a space. After text already
  // written, it is an ordinary space, ready for the next word.
  if (el.value) {
    el.value += " ";
    if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length);
    // Said rather than typed: the appréciation box stores on every "input". Quiet, though:
    // the phrase before the space is finished, not typed, and is no reason to unfold a list.
    const ev = new Event("input", { bubbles: true });
    ev._quiet = true;
    el.dispatchEvent(ev);
  }
  return true;
}

// Shift+Space opens the score box, for a score no key offers: one of the uncommon ones in its
// list (it unfolds as the box takes the focus, and a pick there is final) or any number,
// typed in and taken with Enter.
function kbOpenScore() {
  return kbOpenBox("score");
}

// Clearing a grade is otherwise only reachable through the "—" in the score box's list.
function kbClearGrade() {
  const r = kbResolve();
  if (!r || r.row === totalBar) return false;
  setGrade(kbRowKey(r.row), null);
  return true;
}

// ---- The suggestion list, from the keyboard ----

// The rows the keyboard may land on. The student list's toolbar is not ".combo-item" at all,
// so this one selector leaves it out.
function comboNavRows() {
  return Array.from(comboPopup.querySelectorAll(".combo-item"));
}

function paintComboCursor() {
  const rows = comboNavRows();
  rows.forEach((row, i) => row.classList.toggle("active", i === comboIndex));
  const row = rows[comboIndex];
  if (row && row.scrollIntoView) row.scrollIntoView({ block: "nearest" });
}

function moveComboCursor(d) {
  const rows = comboNavRows();
  if (rows.length === 0) return false;
  comboIndex = comboIndex < 0 ? (d > 0 ? 0 : rows.length - 1)
                              : Math.min(Math.max(comboIndex + d, 0), rows.length - 1);
  paintComboCursor();
  return true;
}

// Enter picks the highlighted row, through the same call a click makes.
function pickComboCursor() {
  const row = comboNavRows()[comboIndex];
  if (row && row._comboValue != null) selectComboItem(row._comboValue);
  else closeCombo();
}

// A field whose keys must never be taken: anything that is typed into. Buttons and checkboxes
// do nothing with an arrow, so the grid may have those. (Nothing in this file is a <textarea>
// or contenteditable; this is where one would have to be allowed for.)
function isTextEntry(el) {
  if (!el || el.tagName !== "INPUT") return false;
  const type = (el.type || "text").toLowerCase();
  return type !== "checkbox" && type !== "radio" && type !== "button" && type !== "file";
}

// A file dialog hands the keyboard back as it closes, to the button it was opened from — and
// then Enter presses that button again, opening the same dialog instead of grading. (It is
// the *first* dialog's button that keeps it: pressing another button never takes the focus
// away — see the mousedown handler further down — so the stale one is never displaced.) The
// moment a file comes back is the moment the grading list should have the keyboard.
function releaseToGrid() {
  const el = document.activeElement;
  if (el && el !== document.body && !isTextEntry(el)) el.blur();
}

// The grid may only take Enter and Space where nothing else would act on them: a focused
// button would otherwise be pressed twice over, once by the browser and once by us — so
// tabbing to a score key and pressing Space still presses that key, as it always has.
function kbOwnsKey() {
  const el = document.activeElement;
  return !el || el === document.body || el === questionsEl;
}

// Tint the student box with the current student's status, so it is visible without opening
// the list (the list itself is coloured as it is built, see openCombo).
// How far one student is: graded questions over their question count.
function studentProgress(name) {
  const grades = gradesByStudent[name] || {};
  const scheme = schemeFor(name);
  let done = 0;
  for (const q of scheme) if (isGraded(grades[qKey(q)])) done++;
  return { done, total: scheme.length };
}

// The same as a 0–1 fraction (0 when there is nothing to grade), for the progress fills.
function studentFraction(name) {
  const { done, total } = studentProgress(name);
  return total ? done / total : 0;
}

// How much of the whole pile is done: graded questions over total questions, across every
// student (not just the current one).
function gradingProgress() {
  let done = 0, total = 0;
  for (const name of students) {
    const p = studentProgress(name);
    done += p.done;
    total += p.total;
  }
  return { done, total };
}

// Paint the vertical progress strip (empty while there is nothing to grade).
function refreshProgress() {
  const { done, total } = gradingProgress();
  progressFill.style.height = total ? (100 * done / total) + "%" : "0";
  progressEl.title = "Grading progress: " + done + " / " + total + " graded — drag to resize";
}

function refreshStudentStatus() {
  const status = studentStatus(currentStudent);
  studentCombo.classList.toggle("graded", status === "graded");
  studentCombo.classList.toggle("ungraded", status === "ungraded");
  studentFill.style.width = (100 * studentFraction(currentStudent)) + "%";
}

// A student's { sum, max } over the questions they have actually been graded on. Ungraded
// questions count toward neither half, so the fraction is a truthful running score that
// reaches the full max once everything is graded. Pure — also used by the printable export.
function computeTotals(name) {
  const grades = gradesByStudent[name] || {};
  const t = { sum: 0, max: 0 };
  for (const q of schemeFor(name)) {
    const v = grades[qKey(q)];
    if (!isGraded(v)) continue;
    t.sum += v;
    if (!isNaN(q.max)) t.max += q.max;
  }
  return t;
}

// The full max of a student's scheme: every question counts, graded or not. This is the
// "max possible" written to the Total sheet, unlike computeTotals' running max.
function schemeMax(name) {
  let max = 0;
  for (const q of schemeFor(name)) if (!isNaN(q.max)) max += q.max;
  return max;
}

// The same { sum, max }, split per group ("" = default group). Every group in the scheme
// gets an entry (so it still shows a subtotal) even when none of its questions are graded.
function computeGroupTotals(name) {
  const grades = gradesByStudent[name] || {};
  const totals = {};
  for (const q of schemeFor(name)) {
    const g = q.group || "";
    const t = totals[g] || (totals[g] = { sum: 0, max: 0 });
    const v = grades[qKey(q)];
    if (!isGraded(v)) continue;
    t.sum += v;
    if (!isNaN(q.max)) t.max += q.max;
  }
  return totals;
}

// Refresh the on-screen subtotal of every named group from the current student's grades.
function recomputeSubtotals() {
  const totals = computeGroupTotals(currentStudent);
  questionsEl.querySelectorAll(".qgroup-sub").forEach(span => {
    const t = totals[span.dataset.group] || { sum: 0, max: 0 };
    span.textContent = fmt(t.sum) + " / " + fmt(t.max);
  });
}

// Repaint the bottom bar. Both halves move as grading proceeds (the max only counts
// graded questions), so this runs on every grade change, not just on re-render.
function recomputeTotal() {
  const t = computeTotals(currentStudent);
  totalValueEl.textContent = fmt(t.sum);
  totalMaxEl.textContent = " / " + fmt(t.max);
  showStudentScore();
}

// =====================================================================
// Students & per-student state
// =====================================================================

// Switch the displayed student: persist the current one, repoint the scheme alias
// at the target's questions, and re-render (each student can have a different set
// of questions, so the question DOM must be rebuilt, not just re-applied).
function switchToStudent(name) {
  if (studentEdit) closeStudentEdit();   // the bar's edit belongs to the student it was opened on
  saveCurrentStudent();
  cancelCapture();            // an armed capture belongs to the student it was armed on
  editingKey = null;          // an open edit row belongs to the student it was opened on
  editingDraft = null;
  currentStudent = name || "";
  schemeQuestions = schemeFor(currentStudent);
  renderQuestions();          // its tail calls loadStudent() to apply stored values
  updateNavButtons();
}

// A deep copy of a scheme array, so a new student's questions are independent.
function cloneScheme(scheme) {
  return scheme.map(q => ({ title: q.title, max: q.max, scores: q.scores.slice(),
                            split: q.split, group: q.group || "" }));
}

// A new student, with nothing graded yet. They inherit a copy of the current student's
// questions (the draft scheme when there is none): one class usually sits one test.
function createStudent(name) {
  students.push(name);
  schemeByStudent[name] = cloneScheme(schemeFor(currentStudent));
  gradesByStudent[name] = {};   // every question starts ungraded
  commentsByStudent[name] = {};
  imagesByStudent[name] = {};
  feedbackByStudent[name] = "";
}

// Give a student another name: everything kept under the old one moves to the new one, and
// they keep their place in the list.
function renameStudent(old, name) {
  for (const map of [schemeByStudent, gradesByStudent, commentsByStudent, imagesByStudent,
                     feedbackByStudent, scrollPosByStudent, groupByStudent]) {
    if (old in map) { map[name] = map[old]; delete map[old]; }
  }
  students[students.indexOf(old)] = name;
  if (currentStudent === old) currentStudent = name;
}

// Add several students at once (a column pasted into a new student's name). Like a student
// added with "+", each inherits a copy of the current student's questions, and `group` when
// one is given, but none gets a position. Names already in the list are skipped. The
// selection stays on the current student (the first new one when the list was empty).
function addStudents(names, group) {
  saveCurrentStudent();
  const added = [];
  for (const name of names) {
    if (students.indexOf(name) >= 0) continue;   // also dedupes within the paste
    createStudent(name);
    if (group) groupByStudent[name] = group;
    added.push(name);
  }
  switchToStudent(currentStudent || added[0] || "");
  studentSelect.value = currentStudent;        // drop the pasted text from the box
  if (activeComboInput === studentSelect && comboPopup.classList.contains("open")) openCombo(studentSelect);
}

// Remove the currently selected student (from the ✕ of the bar's edit mode). Says whether it
// was removed: the teacher may think again at the confirmation.
function removeStudent() {
  if (!currentStudent || students.length === 0) {
    alert("No student selected to remove.");
    return false;
  }
  if (!confirm('Remove student "' + currentStudent + '" and their grades?')) return false;
  const idx = students.indexOf(currentStudent);
  delete schemeByStudent[currentStudent];
  delete gradesByStudent[currentStudent];
  delete commentsByStudent[currentStudent];
  delete imagesByStudent[currentStudent];
  delete feedbackByStudent[currentStudent];
  delete scrollPosByStudent[currentStudent];
  delete groupByStudent[currentStudent];
  students.splice(idx, 1);
  recomputeGroups();          // a group only this student used is now gone
  if (students.length === 0) {
    schemeQuestions = [];     // fresh empty draft
    studentSelect.value = "";
    switchToStudent("");
    return true;
  }
  studentSelect.value = students[Math.min(idx, students.length - 1)];
  switchToStudent(studentSelect.value);
  return true;
}

// Zoom the grading panel in/out (CSS zoom on the questions container).
let gradeZoom = 1.0;
function zoomGrade(factor) {
  gradeZoom = Math.min(2, Math.max(0.5, gradeZoom * factor));
  questionsEl.style.zoom = gradeZoom;
}

// Read an .ods save file, collect its sheets by name (as arrays of rows),
// then hand them to loadWorkbook.
function loadGradesWorkbook(buf) {
  if (!window.XLSX) {
    alert("Spreadsheet library failed to load. Check your internet connection (SheetJS is loaded from a CDN).");
    return;
  }
  let wb;
  try {
    wb = XLSX.read(buf, { type: "array" });
  } catch (err) {
    alert("Could not read this file as an .ods spreadsheet: " + (err && err.message ? err.message : err));
    return;
  }
  // Look sheets up by a normalized name (ignore spaces/underscores and case).
  // Excel rewrites multi-word ODS table names with underscores on save
  // (e.g. "Student groups" -> "Student_groups"), so an exact match would miss them.
  const norm = n => String(n).toLowerCase().replace(/[\s_]+/g, "");
  const sheet = (name) => {
    const key = norm(name);
    const found = wb.SheetNames.find(n => norm(n) === key);
    const ws = found ? wb.Sheets[found] : null;
    return ws ? XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" }) : [];
  };
  loadWorkbook({
    positions:     sheet("Positions"),        // the student list and their PDF positions
    feedback:     sheet("Feedback"),
    studentGroups: sheet("Student_groups"),   // absent in older files -> no groups
    gradingScheme: sheet("Grading_Scheme"),
    grades:        sheet("Grades"),
    comments:      sheet("Comments"),
    commentImages: sheet("Comment_images"),  // absent in older files -> no captures
    pictures:      readOdsPictures(buf),      // the PNGs that sheet points at
  });
}

// Rebuild all state from the save sheets (see buildWorkbook for the layout).
// `s` holds each sheet as an array of cell-arrays. Replaces all current state.
function loadWorkbook(s) {
  const gs = parseAlternating(s.gradingScheme);
  const gr = parseAlternating(s.grades);
  const cm = parseAlternating(s.comments);

  // Replace all state.
  students = [];
  schemeByStudent = {};
  schemeQuestions = [];
  gradesByStudent = {};
  commentsByStudent = {};
  imagesByStudent = {};
  openShots.clear();
  feedbackByStudent = {};
  scrollPosByStudent = {};
  groupByStudent = {};

  const posMap = twoColMap(s.positions);
  const fbMap = twoColMap(s.feedback);
  const grpMap = twoColMap(s.studentGroups);

  // Build one student's scheme from the Grading_Scheme headers (falling back to Grades):
  // each header is a question key that splits into group/title (a header without the
  // separator is a default-group question); a question's score options come from its
  // score-list cell, falling back to the distinct grades observed for it, then [0].
  // `_h` carries the raw header so grades/comments can be read by it below.
  const buildScheme = (name) => {
    const headers = (gs.titlesByName[name] && gs.titlesByName[name].length)
      ? gs.titlesByName[name]
      : (gr.titlesByName[name] || []);
    const scoreVals = gs.valuesByName[name] || {};
    const gradeVals = gr.valuesByName[name] || {};
    return headers.map(h => {
      const { group: g0, title } = splitHeader(h);
      const group = g0 == null ? "" : g0;
      // The stored list may carry a "|" (see parseScoreSpec); the fallbacks can't, so
      // those questions come back with a button per score, as they were written.
      let { scores, split } = parseScoreSpec(scoreVals[h]);
      if (scores.length === 0) { scores = parseScoreList(gradeVals[h]); split = scores.length; }
      if (scores.length === 0) { scores = [0]; split = 1; }
      return { title, max: Math.max(...scores), scores, split, group, _h: h };
    });
  };

  // Student order/list comes from the Positions sheet; include any extra students
  // that only appear in the data sheets (so nothing silently drops).
  const names = [];
  for (const row of s.positions) {
    const name = cell(row, 0);
    if (name && names.indexOf(name) < 0) names.push(name);
  }
  for (const name of [...gs.order, ...gr.order, ...cm.order])
    if (names.indexOf(name) < 0) names.push(name);

  for (const name of names) {
    students.push(name);
    const scheme = schemeByStudent[name] = buildScheme(name);
    const grades = gradesByStudent[name] = {};
    const comments = commentsByStudent[name] = {};
    imagesByStudent[name] = {};
    feedbackByStudent[name] = fbMap[name] || "";
    const pos = parseFloat(posMap[name]);
    if (pos >= 1) scrollPosByStudent[name] = pos;
    if (grpMap[name]) groupByStudent[name] = grpMap[name];
    const gradeVals = gr.valuesByName[name] || {};
    const commentVals = cm.valuesByName[name] || {};
    for (const q of scheme) {
      // Read by the raw stored header, but store under the canonical key (migrates
      // legacy title-keyed values onto group+title keys).
      const raw = gradeVals[q._h];
      if (raw != null && raw !== "") { const v = toNum(raw); if (!isNaN(v)) grades[qKey(q)] = v; }
      const c = commentVals[q._h];
      if (c) comments[qKey(q)] = c;
      delete q._h;
    }
  }

  // Captures last: the keys they hang off exist by now. Kept per student even when a key
  // is not in that student's scheme (see parseImageRows).
  const imgs = parseImageRows(s.commentImages, s.pictures || {});
  for (const name of names) imagesByStudent[name] = imgs[name] || {};

  recomputeGroups();
  editingKey = null;          // nothing from the previous file stays open
  editingDraft = null;
  if (studentEdit) closeStudentEdit();
  currentStudent = students.length ? students[0] : "";
  schemeQuestions = schemeFor(currentStudent);
  studentSelect.value = currentStudent;
  renderQuestions();          // its tail calls loadStudent() to apply values
  updateNavButtons();
}

// Save the comments (and any half-typed score) currently shown into the current student's
// state. Grades are stored the moment they are set, so only a score box the user typed in
// and has not left yet can still be missing; a box holding no number is left alone rather
// than clearing the grade, since clearing is always explicit (see setGrade).
function saveCurrentStudent() {
  if (!currentStudent || !gradesByStudent[currentStudent]) return;
  const grades = gradesByStudent[currentStudent];
  questionsEl.querySelectorAll(".qscorebox").forEach(box => {
    const text = box.value.trim();
    if (text === "") return;
    const n = toNum(text);
    if (!isNaN(n)) grades[box.dataset.key] = n;
  });
  const comments = commentsByStudent[currentStudent] || (commentsByStudent[currentStudent] = {});
  // ".question .qcomment", not ".qcomment": the feedback box sits in the list too (in
  // #totalBar) and carries the same class, but it is saved on its own line below.
  questionsEl.querySelectorAll(".question .qcomment").forEach(input => {
    comments[input.dataset.key] = typedValue(input).trim();   // a suggested ending is not theirs
  });
  feedbackByStudent[currentStudent] = typedValue(globalFeedback);
  recordPositionIfOn();  // while recording: remember where the PDF was left for this student
}

// Apply a student's stored selections to the radios and update the total.
function loadStudent(name) {
  currentStudent = name || "";
  studentSelect.value = currentStudent;
  btnStudentEdit.disabled = !currentStudent && !studentEdit;   // the list's "+" adds the first

  globalFeedback.value = (currentStudent && feedbackByStudent[currentStudent]) || "";
  const comments = (currentStudent && commentsByStudent[currentStudent]) || {};
  for (const q of schemeQuestions) {
    const cinput = questionsEl.querySelector('.qcomment[data-key="' + cssEscape(qKey(q)) + '"]');
    if (cinput) cinput.value = comments[qKey(q)] || "";
  }
  renderGrades();          // the keys, the score boxes and the row colours, from the grades
  refreshStudentStatus();
  refreshProgress();     // also covers add/remove of a student or question, and .ods loads
  recomputeTotal();
  recomputeSubtotals();

  // Bring the PDF back to this student's position. Mid-render the page offsets aren't
  // final, so the render scrolls there once it is done. A student with no position yet
  // leaves the PDF in place (the page button gives them one).
  const target = currentStudent ? scrollPosByStudent[currentStudent] : null;
  if (target >= 1) {
    if (pdfRendering) pendingPdfPos = target;
    else scrollPdfTo(target);
  }
  showStudentPage();
  refreshPositionButton();
}

// Step to another student, wrapping around at both ends (past the last is the first). A
// move that would land on the student already shown (a single student) does nothing at
// all — the ▲/▼ buttons are disabled then, but the middle-click shortcut is not, and
// re-selecting would re-render and re-jump the PDF.
function moveStudent(delta) {
  if (students.length === 0) return;
  const idx = students.indexOf(currentStudent);
  if (idx < 0) { switchToStudent(students[0]); return; }  // nothing selected -> the first
  const next = ((idx + delta) % students.length + students.length) % students.length;
  if (students[next] === currentStudent) return;
  switchToStudent(students[next]);
}

// ---- Reordering the student list (from the student popup's toolbar) ----
// Every per-student map is keyed by name, so reordering only touches `students`; the
// current student stays selected, and saves/exports follow the new order.

// Move the current student one position up (-1) or down (+1) in the list.
function moveCurrentStudent(delta) {
  const i = students.indexOf(currentStudent);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= students.length) return;
  students[i] = students[j];
  students[j] = currentStudent;
  updateNavButtons();
}

// Compare two names ignoring case/accents; `numeric` puts "e2" before "e10".
function compareNames(a, b) {
  return a.localeCompare(b, undefined, { sensitivity: "base", numeric: true });
}

// Sort by name.
function sortStudents() {
  if (students.length < 2) return;
  students.sort(compareNames);
  updateNavButtons();
}

// Distinct student groups, in order of first appearance in the list ("" = no group, never listed).
function studentGroups() {
  const seen = [];
  for (const n of students) {
    const g = groupByStudent[n];
    if (g && seen.indexOf(g) < 0) seen.push(g);
  }
  return seen;
}

// Gather students by group: groups in alphabetical order, students without a group last.
// Array sort is stable, so the order inside each group is kept (students aren't sorted).
function sortStudentsByGroup() {
  if (students.length < 2) return;
  students.sort((a, b) => {
    const ga = groupByStudent[a] || "", gb = groupByStudent[b] || "";
    if (!ga || !gb) return (ga ? 0 : 1) - (gb ? 0 : 1);   // no group sorts last
    return compareNames(ga, gb);
  });
  updateNavButtons();
}

// Order students as they appear in the PDF: by position, students without one last.
// Array sort is stable, so ties and position-less students keep their current order.
function sortStudentsByPosition() {
  if (students.length < 2) return;
  const page = n => scrollPosByStudent[n] >= 1 ? scrollPosByStudent[n] : Infinity;
  students.sort((a, b) => {
    const pa = page(a), pb = page(b);
    return pa === pb ? 0 : pa - pb;   // not a plain difference: Infinity - Infinity is NaN
  });
  updateNavButtons();
}

// Shuffle into a random order (Fisher–Yates).
function shuffleStudents() {
  if (students.length < 2) return;
  for (let i = students.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = students[i];
    students[i] = students[j];
    students[j] = tmp;
  }
  updateNavButtons();
}

// Build the student popup's toolbar: move current up/down, sort A–Z, shuffle, sort by group,
// sort by position in the PDF. (Removing a student is in the bar's edit mode, adding is the
// list's "+".)
function buildStudentToolbar() {
  const bar = document.createElement("div");
  bar.className = "combo-toolbar";
  const idx = students.indexOf(currentStudent);
  const add = (btn, title, disabled, action, reopen = true) => {
    btn.type = "button";
    btn.title = title;
    btn.disabled = disabled;
    btn.addEventListener("mousedown", e => {
      e.preventDefault();              // keep focus in the input so the popup stays open
      if (btn.disabled) return;
      action();
      if (reopen) openCombo(studentSelect);  // redraw the list (and this toolbar) in the new order
    });
    bar.appendChild(btn);
  };
  const move = (dir) => {
    const btn = document.createElement("button");
    btn.className = "qmove";
    btn.dataset.dir = dir;
    return btn;
  };
  const tool = (html) => {
    const btn = document.createElement("button");
    btn.className = "combo-tool";
    btn.innerHTML = html;
    return btn;
  };
  add(move("up"),   "Move current student up",   idx <= 0,                    () => moveCurrentStudent(-1));
  add(move("down"), "Move current student down", idx < 0 || idx >= students.length - 1, () => moveCurrentStudent(1));
  add(tool("A–Z"),  "Sort students alphabetically", students.length < 2, sortStudents);
  add(tool('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
           '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>' +
           '<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>'),
      "Shuffle students into a random order", students.length < 2, shuffleStudents);
  add(tool('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
           '<circle cx="9" cy="7" r="4"/><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>' +
           '<path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'),
      "Sort students by group", students.length < 2, sortStudentsByGroup);
  add(tool(pageIcon()), "Sort students by position in the PDF", students.length < 2, sortStudentsByPosition);
  return bar;
}

// The list's footer: one wide "+", which adds a student in the bar's edit mode.
function buildStudentFooter() {
  const foot = document.createElement("div");
  foot.className = "combo-footer";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "combo-add-row";
  btn.textContent = "+";
  btn.title = "Add a student";
  btn.addEventListener("mousedown", e => { e.preventDefault(); closeCombo(); startNewStudent(); });
  foot.appendChild(btn);
  return foot;
}

// ---- The student bar's edit mode ----
// Like a question row: the pencil turns the bar into the student's name, page and group, and
// pressed again (or Enter) applies them. Nothing changes until then. The box itself is never
// typed in, so a student is only ever renamed on purpose.
let studentEdit = null;   // null, or { isNew, page0 } while the bar is being edited

// Show or hide the edit fields, and set the pencil to match.
function paintStudentEdit() {
  const on = !!studentEdit;
  studentBarEl.classList.toggle("editing", on);
  btnStudentEdit.classList.toggle("on", on);
  btnStudentEdit.setAttribute("aria-pressed", on ? "true" : "false");
  btnStudentEdit.title = on ? "Apply changes" : "Edit this student";
  btnStudentEdit.replaceChildren(on ? checkIcon() : editIcon());   // while editing, a press validates
  btnStudentEdit.disabled = !on && !currentStudent;
  for (const el of [seName, sePage, seGroup]) el.classList.remove("qedit-invalid");
  refreshPositionButton();
}

function openStudentEdit(isNew, name, page, group) {
  closeCombo();
  recordingPosition = false;   // the page is the field's business now (see onSetPositionClick)
  studentEdit = { isNew, page0: page };
  seName.value = name;
  sePage.value = page;
  seGroup.value = group;
  seRemove.title = isNew ? "Discard this new student" : "Remove this student";
  paintStudentEdit();
  seName.focus();
  seName.select();
}

// The pencil: edit the current student.
function beginStudentEdit() {
  if (studentEdit || !currentStudent) return;
  saveCurrentStudent();
  const page = hasPage(currentStudent) ? String(roundPos(scrollPosByStudent[currentStudent])) : "";
  openStudentEdit(false, currentStudent, page, groupByStudent[currentStudent] || "");
}

// The list's "+": a new student, on the page in view and in the current student's group —
// with the copy on screen, typing the name and Enter is the whole job.
function startNewStudent() {
  if (studentEdit && commitStudentEdit() === false) return;
  const page = pageCanvases.length && !pdfRendering ? String(currentVisiblePage()) : "";
  openStudentEdit(true, "", page, (currentStudent && groupByStudent[currentStudent]) || "");
}

// Leave edit mode, changing nothing.
function closeStudentEdit() {
  closeCombo();
  if (studentEditEl.contains(document.activeElement)) document.activeElement.blur();
  studentEdit = null;
  paintStudentEdit();
}

// A page typed in the page box: a number of at least 1 (a comma will do for the point), null
// for an empty box, NaN for anything else.
function readPageField(text) {
  if (!text) return null;
  const n = Number(text.indexOf(".") < 0 ? text.replace(",", ".") : text);
  return n >= 1 ? n : NaN;
}

// Apply the bar's fields. Returns the student's name, `false` when a field is refused (it
// is marked, and the bar stays open), and null when there was nothing to apply — a new
// student never named is simply dropped, like an untouched new question.
function commitStudentEdit() {
  if (!studentEdit) return null;
  const { isNew, page0 } = studentEdit;
  const name = seName.value.trim();
  const pageText = sePage.value.trim();
  const group = seGroup.value.trim();
  if (isNew && !name) { closeStudentEdit(); return null; }
  if (!name) { rejectField(seName); return false; }
  const old = isNew ? null : currentStudent;
  if (name !== old && students.indexOf(name) >= 0) { rejectField(seName); return false; }
  // An untouched page box keeps the exact position: the box only shows it to 2 decimals.
  const keepPage = !isNew && pageText === page0;
  const page = keepPage ? null : readPageField(pageText);
  if (Number.isNaN(page)) { rejectField(sePage); return false; }

  saveCurrentStudent();
  if (isNew) createStudent(name);
  else if (name !== old) renameStudent(old, name);
  if (!keepPage) {
    if (page === null) delete scrollPosByStudent[name];
    else scrollPosByStudent[name] = page;
  }
  if (group) groupByStudent[name] = group;
  else delete groupByStudent[name];
  closeStudentEdit();
  switchToStudent(name);   // and to their page, which the new position may have moved
  return name;
}

// The edit row's ✕: a new student is dropped, an existing one removed (once confirmed).
function removeFromStudentEdit() {
  if (!studentEdit) return;
  if (studentEdit.isNew) { closeStudentEdit(); return; }
  if (removeStudent()) closeStudentEdit();
}

// Stepping wraps around (see moveStudent), so ▲/▼ are only disabled with nowhere else to go.
function updateNavButtons() {
  const none = students.length < 2;
  document.getElementById("btnPrev").disabled = none;
  document.getElementById("btnNext").disabled = none;
}

// Minimal CSS.escape fallback for use in attribute selectors.
function cssEscape(s) {
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/["\\\]\[#.:>+~*^$|()'`= ]/g, "\\$&");
}

// =====================================================================
// PDF rendering
// =====================================================================

let pageCanvases = [];      // one canvas element per rendered page
let currentPdfDoc = null;   // the loaded PDF.js document
let pdfZoom = 1.0;          // user zoom multiplier
const PDF_BASE_SCALE = 1.5; // scale at 100%
let renderToken = 0;        // guards against overlapping re-renders
let pdfRendering = false;   // a drawPages is in flight: page offsets aren't final yet
let pendingPdfPos = 1;      // where that render scrolls once done (see scrollPdfTo)
let pdfBytes = null;        // the original file (Uint8Array), rewritten by savePdf
let pdfFileName = "";       // the opened file's name, reused when saving
let pageRotation = {};      // { original 1-based page: extra clockwise degrees (0/90/180/270) }

async function renderPdf(arrayBuffer, name) {
  if (!window.pdfjsLib) {
    alert("PDF library failed to load. Check your internet connection (PDF.js is loaded from a CDN, " +
          "or from the files saved with the page).");
    return;
  }
  // Keep a copy for saving: pdf.js transfers (detaches) the buffer it is given.
  pdfBytes = new Uint8Array(arrayBuffer.slice(0));
  pdfFileName = name || "document.pdf";
  pageRotation = {};
  try {
    currentPdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    pdfZoom = 1.0;
    pageCanvases = [];          // a new file starts in its natural page order (see drawPages)
    // e.g. after an .ods load: the current student's saved spot
    await drawPages((currentStudent && scrollPosByStudent[currentStudent]) || 1);
  } catch (err) {
    pdfRendering = false;
    currentPdfDoc = null;
    pdfBytes = null;
    pageCanvases = [];
    pdfPane.innerHTML = "";
    pageInput.disabled = true;
    btnPagePrev.disabled = true;
    btnPageNext.disabled = true;
    btnSavePdf.disabled = true;
    btnRotatePage.disabled = true;
    btnDeletePage.disabled = true;
    refreshPositionButton();      // no PDF: nothing to set or record
    btnPageUp.disabled = true;
    btnPageDown.disabled = true;
    pageInput.value = 1;
    pageCountEl.textContent = "/ 0";
    document.getElementById("pdfZoomLabel").textContent = "100%";
    const msg = document.createElement("div");
    msg.id = "pdfEmpty";
    msg.textContent = "Could not render this PDF: " + (err && err.message ? err.message : err);
    pdfPane.appendChild(msg);
  }
}

// Render all pages of the current document at the current zoom, then scroll to
// targetPos (a pdfScrollPos position; selecting a student meanwhile retargets it).
// Re-entrant: a newer call cancels an in-flight one via renderToken.
// Each canvas carries its original page number (dataset.page), so `pageCanvases` is also
// the page order (see movePage); a re-render (zoom) keeps that order.
async function drawPages(targetPos) {
  if (!currentPdfDoc) return;
  cancelCapture();          // every canvas is about to be replaced
  const token = ++renderToken;
  pdfRendering = true;
  pendingPdfPos = targetPos || 1;
  const order = pageCanvases.length
    ? pageCanvases.map(c => +c.dataset.page)
    : Array.from({ length: currentPdfDoc.numPages }, (_, i) => i + 1);
  // Create every canvas up front, so `pageCanvases` is complete (and the order readable)
  // even while the pages below are still rendering.
  pdfPane.innerHTML = "";
  pageCanvases = order.map(n => {
    const canvas = document.createElement("canvas");
    canvas.dataset.page = n;
    pdfPane.appendChild(canvas);
    return canvas;
  });
  const scale = PDF_BASE_SCALE * pdfZoom;
  for (const canvas of pageCanvases.slice()) {   // a copy: a move mid-render can't skip a page
