    const page = await currentPdfDoc.getPage(+canvas.dataset.page);
    if (token !== renderToken) return; // a newer render superseded this one
    await renderPageInto(canvas, page, scale);
    if (token !== renderToken) return;
  }
  pageInput.disabled = false;
  btnPagePrev.disabled = false;
  btnPageNext.disabled = false;
  btnSavePdf.disabled = false;
  btnRotatePage.disabled = false;
  btnDeletePage.disabled = pageCanvases.length < 2;   // the last page can't go
  btnPageUp.disabled = false;
  btnPageDown.disabled = false;
  pageCountEl.textContent = "/ " + pageCanvases.length;   // the pages shown (some may be deleted)
  document.getElementById("pdfZoomLabel").textContent = Math.round(pdfZoom * 100) + "%";
  pdfRendering = false;
  scrollPdfTo(pendingPdfPos);
  showStudentPage();
  refreshPositionButton();
}

// Size `canvas` for one PDF.js page and render it, applying the page's own rotation plus
// any extra rotation the user added (pageRotation).
async function renderPageInto(canvas, page, scale) {
  const rotation = (page.rotate + (pageRotation[page.pageNumber] || 0)) % 360;
  const viewport = page.getViewport({ scale, rotation });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
}

// Rotate the page in view 90° clockwise, re-rendering only that page. It is then
// scrolled to the top, since its height (and so the layout below it) may have changed.
async function rotateCurrentPage() {
  if (!currentPdfDoc || pageCanvases.length === 0) return;
  const n = currentVisiblePage();
  const canvas = pageCanvases[n - 1];
  if (!canvas) return;
  const orig = +canvas.dataset.page;   // rotations are keyed by original page number
  pageRotation[orig] = ((pageRotation[orig] || 0) + 90) % 360;
  const page = await currentPdfDoc.getPage(orig);
  await renderPageInto(canvas, page, PDF_BASE_SCALE * pdfZoom);
  goToPage(n);
}

// Swap the page in view with the previous (-1) or next (+1) one. Only the canvases move
// (no re-render); student positions are places in the displayed PDF and are deliberately
// left as-is.
function movePage(delta) {
  const n = currentVisiblePage();
  const m = n + delta;
  if (pageCanvases.length === 0 || m < 1 || m > pageCanvases.length) return;
  const tmp = pageCanvases[n - 1];
  pageCanvases[n - 1] = pageCanvases[m - 1];
  pageCanvases[m - 1] = tmp;
  const i = Math.min(n, m) - 1;        // put the (new) earlier canvas back before the later one
  pdfPane.insertBefore(pageCanvases[i], pageCanvases[i + 1]);
  goToPage(m);
}

// Delete the page in view (after confirming; only reopening the PDF brings it back). Only
// its canvas goes (no re-render), so savePdf and later re-renders simply leave it out.
// Unlike a move, student positions shift so each still points at the same work: later
// pages move up one, and a position on the deleted page goes to the top of the page that
// takes its place.
function deleteCurrentPage() {
  if (!currentPdfDoc || pdfRendering || pageCanvases.length < 2) return;
  cancelCapture();          // this removes a canvas without a re-render
  const n = currentVisiblePage();
  if (!confirm("Delete page " + n + " from the PDF?")) return;
  const [canvas] = pageCanvases.splice(n - 1, 1);
  canvas.remove();
  const count = pageCanvases.length;
  for (const name of Object.keys(scrollPosByStudent)) {
    let pos = scrollPosByStudent[name];
    if (!(pos >= 1)) continue;
    if (pos >= n + 1) pos -= 1;
    else if (pos >= n) pos = n;
    if (pos >= count + 1) pos = count;   // the deleted page was the last: top of the new last
    scrollPosByStudent[name] = pos;
  }
  pageCountEl.textContent = "/ " + count;
  btnDeletePage.disabled = count < 2;
  goToPage(Math.min(n, count));
  showStudentPage();
  refreshPositionButton();
}

// Download the PDF with the user's rotations, page order and deletions applied. pdf-lib only rewrites
// each page's /Rotate entry and the page list, so the page contents are kept as-is (no
// re-rendering, no quality loss).
async function savePdf() {
  if (!pdfBytes) {
    alert("No PDF loaded.");
    return;
  }
  if (!window.PDFLib) {
    alert("PDF writing library failed to load. Check your internet connection (pdf-lib is loaded from a CDN).");
    return;
  }
  try {
    const doc = await PDFLib.PDFDocument.load(pdfBytes, { ignoreEncryption: true });
    const pages = doc.getPages();
    for (const [n, extra] of Object.entries(pageRotation)) {
      const p = pages[n - 1];
      if (!p || !extra) continue;
      p.setRotation(PDFLib.degrees(((p.getRotation().angle + extra) % 360 + 360) % 360));
    }
    // Then the pages shown, in their order on screen (each canvas holds its original page
    // number; deleted pages have no canvas, so they're left out).
    const order = pageCanvases.map(c => +c.dataset.page);
    if (order.length !== pages.length || order.some((n, i) => n !== i + 1)) {
      for (let i = pages.length - 1; i >= 0; i--) doc.removePage(i);
      for (const n of order) doc.addPage(pages[n - 1]);
    }
    downloadFile(pdfFileName, await doc.save(), "application/pdf");
  } catch (err) {
    alert("Could not save the PDF: " + (err && err.message ? err.message : err));
  }
}

function zoomPdf(factor) {
  if (!currentPdfDoc) return;
  // Keep the exact spot (or, mid-render, the spot that render was heading for).
  const keepPos = pdfRendering ? pendingPdfPos : pdfScrollPos();
  pdfZoom = Math.min(3, Math.max(0.4, pdfZoom * factor));
  drawPages(keepPos);
}

// Scroll so the given 1-based page sits at the top of the PDF pane.
function goToPage(n) {
  if (pageCanvases.length === 0) return;
  n = Math.min(pageCanvases.length, Math.max(1, n));
  const canvas = pageCanvases[n - 1];
  pdfPane.scrollTop = canvas.offsetTop - pdfPane.offsetTop;
  showPdfPosition();
}

// Top of the i-th (0-based) page canvas, in the PDF pane's scroll coordinates.
function pageTop(i) {
  return pageCanvases[i].offsetTop - pdfPane.offsetTop;
}

// Distance from the i-th page's top to the next one's (so the gap between pages counts);
// the last page uses its own height.
function pagePitch(i) {
  return (i + 1 < pageCanvases.length ? pageTop(i + 1) : pageTop(i) + pageCanvases[i].offsetHeight) - pageTop(i);
}

// The exact scroll position as a fractional page number: 3.25 means the top of the pane
// sits a quarter of the way from page 3's top to page 4's. Unlike pixels, it survives zoom
// and window resizes. null when no PDF is shown.
function pdfScrollPos() {
  if (pageCanvases.length === 0) return null;
  const y = pdfPane.scrollTop;
  let i = 0;
  while (i + 1 < pageCanvases.length && pageTop(i + 1) <= y) i++;
  const pitch = pagePitch(i);
  const frac = pitch > 0 ? Math.min(0.9999, Math.max(0, (y - pageTop(i)) / pitch)) : 0;
  return Math.round((i + 1 + frac) * 10000) / 10000;
}

// Scroll to a position from pdfScrollPos (a whole number is the top of that page).
function scrollPdfTo(pos) {
  if (pageCanvases.length === 0) return;
  pos = Math.min(pageCanvases.length + 0.9999, Math.max(1, pos));
  const i = Math.floor(pos) - 1;
  pdfPane.scrollTop = pageTop(i) + (pos - i - 1) * pagePitch(i);
  showPdfPosition();
}

// A position as shown in the page selector: 2 decimals at most.
function roundPos(pos) {
  return Math.round(pos * 100) / 100;
}

// Show the exact scroll position in the PDF bar's page selector (e.g. 3.47).
function showPdfPosition() {
  if (pageCanvases.length) pageInput.value = roundPos(pdfScrollPos());
}

// The page selector's ▲ (dir -1, up the PDF) / ▼ (+1) step a whole page. A fractional
// position first snaps to its page's top going back (3.47 -> 3), and to the next page's
// going forward (3.47 -> 4).
function stepPdfPage(dir) {
  if (!pageCanvases.length) return;
  const v = parseFloat(pageInput.value) || pdfScrollPos();
  const next = dir < 0 ? (Number.isInteger(v) ? v - 1 : Math.floor(v)) : Math.floor(v) + 1;
  scrollPdfTo(Math.max(1, Math.min(pageCanvases.length, next)));
}

// Positions are set and recorded with the page button (onSetPositionClick): a student with
// no page yet gets the whole page in view, once; for a student with one, it toggles
// recording, while which the position follows the PDF as it scrolls. Off, the PDF
// scrolls freely and no position changes.
function hasPage(name) {
  return scrollPosByStudent[name] >= 1;
}

// While recording: store where the PDF is as the current student's position. Skipped with
// no PDF, or mid-render, when the page offsets aren't final.
function recordPositionIfOn() {
  if (!recordingPosition || !pageCanvases.length || pdfRendering || !currentStudent) return;
  scrollPosByStudent[currentStudent] = pdfScrollPos();
  showStudentPage();     // the page number in the box follows
}

// What a click on the page button would do:
//   "fill"   — the bar is being edited: put the page in view into its page box;
//   "set"    — the current student has no page yet: give them the page in view (once);
//   "toggle" — the current student has one: start/stop recording;
//   ""       — nothing (no PDF, mid-render, or no student).
function setPositionAction() {
  if (!pageCanvases.length || pdfRendering) return "";
  if (studentEdit) return "fill";
  if (!currentStudent) return "";
  return hasPage(currentStudent) ? "toggle" : "set";
}

// The page button. Setting a page takes the whole page in view (no jump: it's already in
// view) and never turns recording on; turning recording on stores the exact spot at once.
function onSetPositionClick() {
  const action = setPositionAction();
  if (action === "fill") {
    sePage.value = String(currentVisiblePage());
    sePage.classList.remove("qedit-invalid");
    return;
  } else if (action === "set") {
    scrollPosByStudent[currentStudent] = currentVisiblePage();
  } else if (action === "toggle") {
    recordingPosition = !recordingPosition;
    recordPositionIfOn();
  } else {
    return;
  }
  showStudentPage();
  refreshPositionButton();
}

// A student's page tag: a page and its number, rounded to the page the copy is mostly on
// (the exact position is in the tooltip), or a crossed-out page while they have none. Used
// in the student list and in the student box.
function studentPageTag(name) {
  if (!hasPage(name)) return { html: pageIcon(true), title: "no page yet", cls: "unset" };
  const pos = scrollPosByStudent[name];
  return { html: pageIcon() + "<span>" + Math.round(pos) + "</span>", title: "page " + roundPos(pos) };
}

// The current student's group and page tag, in the student box. Nothing with no student.
function showStudentPage() {
  const tag = currentStudent ? studentPageTag(currentStudent) : null;
  studentPageTagEl.innerHTML = tag ? tag.html : "";
  studentPageTagEl.title = tag ? tag.title : "";
  studentPageTagEl.classList.toggle("unset", !!(tag && tag.cls));
  const group = (currentStudent && groupByStudent[currentStudent]) || "";
  studentGroupTagEl.innerHTML = group ? groupIcon() : "";
  if (group) studentGroupTagEl.appendChild(document.createTextNode(group));   // a name, never markup
}

// The score in the student box: the same total / max over the graded questions that the total
// row and the student list show.
function showStudentScore() {
  const t = currentStudent && schemeFor(currentStudent).length ? computeTotals(currentStudent) : null;
  studentScoreTagEl.innerHTML = t ? gradeIcon() + fmt(t.sum) + " / " + fmt(t.max) : "";
}

// The page button's look: pressed while recording, amber when the next click sets a page,
// disabled when it can't do anything; its tooltip says what the next click does.
function refreshPositionButton() {
  const action = setPositionAction();
  if (!currentStudent || !hasPage(currentStudent)) recordingPosition = false;
  btnSetPosition.disabled = !action;
  btnSetPosition.classList.toggle("unset", action === "set");
  const on = recordingPosition && action === "toggle";
  btnSetPosition.classList.toggle("recording", on);
  btnSetPosition.setAttribute("aria-pressed", on ? "true" : "false");
  btnSetPosition.title =
    action === "fill"   ? "Put the page in view into the page box" :
    action === "set"    ? "Set this student's page to the page in view" :
    on                  ? "Stop recording this student's position" :
    action === "toggle" ? "Record this student's position while scrolling" :
                          "Set a student's page (open a PDF first)";
}

// A group icon (SVG markup): two people, as on the toolbar's "sort by group".
function groupIcon() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
         'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
         '<circle cx="9" cy="7" r="4"/><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>' +
         '<path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
}

// A grade icon (SVG markup): the award rosette, which stands for a student's total wherever
// one is shown (the student box and list, the total bar, the range feedback).
function gradeIcon() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
         'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
         '<circle cx="12" cy="8" r="6"/><path d="M15.48 12.89 17 22l-5-3-5 3 1.52-9.11"/></svg>';
}

// A page icon (SVG markup), optionally crossed out.
function pageIcon(crossed) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
         'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
         '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
         '<polyline points="14 2 14 8 20 8"/>' +
         (crossed ? '<line x1="3" y1="3" x2="21" y2="21"/>' : "") + '</svg>';
}

// Work out which page is currently most in view (from scroll position).
function currentVisiblePage() {
  if (pageCanvases.length === 0) return 1;
  const mid = pdfPane.scrollTop + pdfPane.clientHeight / 2;
  for (let i = 0; i < pageCanvases.length; i++) {
    const top = pageCanvases[i].offsetTop - pdfPane.offsetTop;
    const bottom = top + pageCanvases[i].offsetHeight;
    if (mid >= top && mid < bottom) return i + 1;
  }
  return pdfPane.scrollTop <= 0 ? 1 : pageCanvases.length;
}

// =====================================================================
// Capture a rectangle of the PDF and mark it in red
// =====================================================================
// Pressing a question's capture button arms a drag over the PDF; the rectangle it selects is
// re-rendered from the PDF, opened in the red-pen editor, and attached to that question.
//
// Everything here works in a canvas's own pixels ("bitmap space"), never in client pixels:
// #pdfPane canvas has max-width: 100%, so a page wider than the pane is drawn at one size and
// displayed at another, and the pane can scroll under the pointer mid-drag. Keeping the
// anchor in bitmap space makes both of those non-issues.

const capBand = document.getElementById("capBand");
const annBack = document.getElementById("annBack");
const annBox = document.getElementById("annBox");
const annStage = document.getElementById("annStage");
const annBase = document.getElementById("annBase");
const annInk = document.getElementById("annInk");
const annUndo = document.getElementById("annUndo");

const MIN_CAP_CSS = 8;          // a drag smaller than this (on either side) was a stray click
const CAPTURE_SCALE = 3.0;      // twice the app's 100% (PDF_BASE_SCALE), whatever the zoom is
const CAPTURE_MAX_PX = 1.5e6;   // ~1500x1000: the ceiling for a whole-page drag
const PEN_COLOR = "#e11d48";

// A point in a canvas's own pixels, clamped to it. Null when the element has no box yet
// (never laid out, detached, or a test environment without layout).
function bmPoint(canvas, clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  if (!(r.width > 0 && r.height > 0)) return null;
  return {
    x: Math.min(canvas.width, Math.max(0, (clientX - r.left) * canvas.width / r.width)),
    y: Math.min(canvas.height, Math.max(0, (clientY - r.top) * canvas.height / r.height)),
  };
}

// Two bitmap points -> a whole-pixel rectangle inside the bitmap. Pure arithmetic.
function bmRect(cw, ch, ax, ay, bx, by) {
  const x0 = Math.max(0, Math.floor(Math.min(ax, bx)));
  const y0 = Math.max(0, Math.floor(Math.min(ay, by)));
  const x1 = Math.min(cw, Math.ceil(Math.max(ax, bx)));
  const y1 = Math.min(ch, Math.ceil(Math.max(ay, by)));
  return { x: x0, y: y0, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0) };
}

// ---- Arming ----

function paintCaptureArmed() {
  const key = capState ? capState.key : null;
  questionsEl.querySelectorAll(".qcapture").forEach(b => {
    b.classList.toggle("on", b.dataset.key === key);
  });
}

function toggleCaptureArm(key) {
  if (capState && capState.key === key) { cancelCapture(); return; }   // pressed again: disarm
  cancelCapture();
  if (!currentStudent) { alert("Select a student before capturing from their PDF."); return; }
  if (!currentPdfDoc || pageCanvases.length === 0) { alert("Open a PDF first."); return; }
  if (pdfRendering) return;                 // the pages are still being drawn
  if (totalImageChars() > IMG_HARD_CAP) {
    alert("There are already too many captured images to save safely. Remove some first.");
    return;
  }
  capState = { key: key, canvas: null, ax: 0, ay: 0, dragging: false, pid: -1, pane: null };
  closeCombo();                             // nothing should hang over the PDF
  pdfPane.style.cursor = "crosshair";
  pdfPane.style.touchAction = "none";       // a finger drag selects instead of scrolling
  paintCaptureArmed();
}

function cancelCapture() {
  if (!capState) return;
  if (capState.dragging) {
    try { pdfPane.releasePointerCapture(capState.pid); } catch (err) { /* already gone */ }
  }
  capState = null;
  capBand.style.display = "none";
  pdfPane.style.cursor = "";
  pdfPane.style.touchAction = "";
  document.body.style.cursor = "";
  document.body.style.userSelect = "";
  paintCaptureArmed();
}

// ---- The drag ----

// Place the rubber band, in client coordinates (it is position: fixed), clipped to the part
// of the pane that is actually visible. The anchor's client position is recomputed from the
// canvas every time, which is what lets the page scroll mid-drag.
function drawBand(clientX, clientY) {
  const c = capState.canvas;
  if (!c || !c.isConnected) { cancelCapture(); return; }
  const r = c.getBoundingClientRect();
  if (!(r.width > 0 && r.height > 0)) return;
  const ax = r.left + capState.ax * r.width / c.width;
  const ay = r.top + capState.ay * r.height / c.height;
  const bx = Math.min(r.right, Math.max(r.left, clientX));
  const by = Math.min(r.bottom, Math.max(r.top, clientY));
  const p = capState.pane;
  const l = Math.max(Math.min(ax, bx), p.left), t = Math.max(Math.min(ay, by), p.top);
  const rr = Math.min(Math.max(ax, bx), p.right), b = Math.min(Math.max(ay, by), p.bottom);
  if (rr <= l || b <= t) { capBand.style.display = "none"; return; }
  capBand.style.display = "block";
  capBand.style.left = l + "px";
  capBand.style.top = t + "px";
  capBand.style.width = (rr - l) + "px";
  capBand.style.height = (b - t) + "px";
}

pdfPane.addEventListener("pointerdown", e => {
  if (!capState || capState.dragging) return;      // not armed: the pane behaves as before
  if (e.button !== 0) return;
  const canvas = e.target.closest && e.target.closest("canvas");
  if (!canvas || pageCanvases.indexOf(canvas) < 0) return;   // the gaps are not a page
  const p = bmPoint(canvas, e.clientX, e.clientY);
  if (!p) return;
  capState.canvas = canvas;
  capState.ax = p.x;
  capState.ay = p.y;
  capState.dragging = true;
  capState.pid = e.pointerId;
  capState.pane = pdfPane.getBoundingClientRect();
  // Pointer capture keeps the drag alive when the cursor leaves the pane, like the divider.
  try { pdfPane.setPointerCapture(e.pointerId); } catch (err) { /* not supported */ }
  document.body.style.cursor = "crosshair";
  document.body.style.userSelect = "none";
  e.preventDefault();                              // no native drag of the canvas
  drawBand(e.clientX, e.clientY);
});

pdfPane.addEventListener("pointermove", e => {
  if (capState && capState.dragging) drawBand(e.clientX, e.clientY);
});

pdfPane.addEventListener("pointercancel", () => { if (capState) cancelCapture(); });

pdfPane.addEventListener("pointerup", e => {
  if (!capState || !capState.dragging) return;
  const key = capState.key, c = capState.canvas, ax = capState.ax, ay = capState.ay;
  const r = c.isConnected ? c.getBoundingClientRect() : null;
  const p = r && r.width > 0 ? bmPoint(c, e.clientX, e.clientY) : null;
  const small = !p ||
    Math.abs(e.clientX - (r.left + ax * r.width / c.width)) < MIN_CAP_CSS ||
    Math.abs(e.clientY - (r.top + ay * r.height / c.height)) < MIN_CAP_CSS;
  const rect = p ? bmRect(c.width, c.height, ax, ay, p.x, p.y) : null;
  cancelCapture();                                 // disarm before the (async) render
  if (small) return;                               // a click, or a page that went away
  captureRegion(c, rect)
    .then(canvas => openAnnotator({ key: key, canvas: canvas, mode: "new" }))
    .catch(err => alert("Could not capture that region: " + (err && err.message ? err.message : err)));
});

// ---- Turning the selection into a bitmap ----

// Re-render just the selected rectangle from the PDF at a fixed scale, so a capture looks the
// same whatever zoom it was taken at (at 40% the on-screen pixels would be far too coarse to
// print). Falls back to cropping what is on screen if the re-render cannot be done.
async function captureRegion(canvas, rect) {
  const sDisp = PDF_BASE_SCALE * pdfZoom;          // the scale this bitmap was drawn at
  let r = CAPTURE_SCALE / sDisp;                   // bitmap pixels -> capture pixels
  const px = rect.w * rect.h * r * r;
  if (px > CAPTURE_MAX_PX) r *= Math.sqrt(CAPTURE_MAX_PX / px);
  r = Math.min(r, 4);
  const out = document.createElement("canvas");
  out.width = Math.max(1, Math.round(rect.w * r));
  out.height = Math.max(1, Math.round(rect.h * r));
  const ctx = out.getContext("2d");
  if (!ctx) throw new Error("this browser gave no 2D canvas");
  ctx.fillStyle = "#fff";                          // pdf.js draws no page background
  ctx.fillRect(0, 0, out.width, out.height);
  try {
    if (!currentPdfDoc) throw new Error("no PDF loaded");
    const page = await currentPdfDoc.getPage(+canvas.dataset.page);
    // The same rotation as renderPageInto, so the crop lands where the drag was.
    const rotation = (page.rotate + (pageRotation[page.pageNumber] || 0)) % 360;
    const viewport = page.getViewport({ scale: sDisp * r, rotation: rotation });
    // `transform` applies before the viewport's, in its pixels: shift the page so the
    // rectangle's top-left corner lands on (0, 0) of this small canvas.
    await page.render({
      canvasContext: ctx,
      viewport: viewport,
      transform: [1, 0, 0, 1, -rect.x * r, -rect.y * r],
    }).promise;
  } catch (err) {
    // Good enough beats nothing: crop the pixels already on screen.
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(canvas, rect.x, rect.y, rect.w, rect.h, 0, 0, out.width, out.height);
  }
  return out;
}

// ---- The red-pen editor ----

let penScale = 1;               // chosen thickness, remembered between captures
let annStrokes = [];            // [{ w, pts: [{x, y}, ...] }] in the base bitmap's pixels
let annCur = null;              // the stroke being drawn
let annInkRaf = null;

// Thickness in bitmap pixels: derived from the image's own size, so the pen looks the same
// on any capture, and stored per stroke so a replay is exact.
function penWidth() {
  return Math.max(1.5, annBase.width / 220 * penScale);
}

function redrawInk() {
  if (annUndo) annUndo.disabled = annStrokes.length === 0;
  const ctx = annInk.getContext && annInk.getContext("2d");
  if (!ctx) return;             // no canvas support (tests): the strokes are still recorded
  ctx.clearRect(0, 0, annInk.width, annInk.height);
  ctx.strokeStyle = PEN_COLOR;
  ctx.fillStyle = PEN_COLOR;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  for (const s of annStrokes) {
    const p = s.pts;
    ctx.lineWidth = s.w;
    if (p.length === 1) {       // a tap marks a spot
      ctx.beginPath();
      ctx.arc(p[0].x, p[0].y, s.w / 2, 0, Math.PI * 2);
      ctx.fill();
      continue;
    }
    ctx.beginPath();
    ctx.moveTo(p[0].x, p[0].y);
    // Through the midpoints, with each point as the control: a smooth line out of a
    // jittery pointer trail.
    for (let i = 1; i < p.length - 1; i++)
      ctx.quadraticCurveTo(p[i].x, p[i].y, (p[i].x + p[i + 1].x) / 2, (p[i].y + p[i + 1].y) / 2);
    ctx.lineTo(p[p.length - 1].x, p[p.length - 1].y);
    ctx.stroke();
  }
}

// Open the editor on a fresh capture (mode "new", with its canvas) or on one already
// attached (mode "edit", by its index). Errors are reported, never thrown at the caller.
function openAnnotator(req) {
  prepareAnnotator(req).catch(err =>
    alert("Could not open that capture: " + (err && err.message ? err.message : err)));
}

async function prepareAnnotator(req) {
  const shot = req.mode === "edit" ? shotsFor(req.key)[req.i] : null;
  const src = shot ? await loadImage(shot.src) : req.canvas;
  if (!src || !src.width || !src.height) throw new Error("there is nothing to draw on");
  closeCombo();
  annStrokes = [];
  annCur = null;
  annBase.width = src.width;
  annBase.height = src.height;
  annInk.width = src.width;
  annInk.height = src.height;
  const bctx = annBase.getContext && annBase.getContext("2d");
  if (bctx) {
    bctx.fillStyle = "#fff";
    bctx.fillRect(0, 0, src.width, src.height);
    bctx.drawImage(src, 0, 0);
  }
  redrawInk();
  annState = req;
  annBack.classList.add("open");
  annBox.classList.add("open");
}

function loadImage(dataUrl) {
  return new Promise((resolve, reject) => {
    if (!dataUrl) { reject(new Error("that capture is gone")); return; }
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("the stored image could not be decoded"));
    img.src = dataUrl;
  });
}

// Close the editor; with `attach`, flatten the strokes into the image and keep it.
function closeAnnotator(attach) {
  const st = annState;
  annState = null;
  annBack.classList.remove("open");
  annBox.classList.remove("open");
  if (annInkRaf) { cancelAnimationFrame(annInkRaf); annInkRaf = null; }
  annCur = null;
  if (!attach || !st || !currentStudent) return;
  const out = document.createElement("canvas");
  out.width = annBase.width;
  out.height = annBase.height;
  const ctx = out.getContext && out.getContext("2d");
  if (!ctx) return;
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(annBase, 0, 0);
  ctx.drawImage(annInk, 0, 0);        // the strokes are baked in from here on
  const url = out.toDataURL("image/png");
  if (totalImageChars() + url.length > IMG_HARD_CAP) {
    alert("Keeping this capture would make the save file too big. Remove some captures first.");
    return;
  }
  const byQ = imagesByStudent[currentStudent] || (imagesByStudent[currentStudent] = {});
  const arr = byQ[st.key] || (byQ[st.key] = []);
  // Re-drawing on a capture keeps the width it was dragged to; it is the same picture.
  if (st.mode === "edit" && st.i >= 0 && st.i < arr.length) arr[st.i] = { src: url, w: arr[st.i].w };
  else arr.push({ src: url });
  openShots.add(st.key);              // show what was just made
  paintShots(st.key);
}

annInk.addEventListener("pointerdown", e => {
  if (!annState) return;
  const p = bmPoint(annInk, e.clientX, e.clientY);
  if (!p) return;
  try { annInk.setPointerCapture(e.pointerId); } catch (err) { /* not supported */ }
  annCur = { w: penWidth(), pts: [p] };
  annStrokes.push(annCur);
  e.preventDefault();
  redrawInk();
});

annInk.addEventListener("pointermove", e => {
  if (!annCur) return;
  const p = bmPoint(annInk, e.clientX, e.clientY);
  if (!p) return;
  const last = annCur.pts[annCur.pts.length - 1];
  if (Math.abs(p.x - last.x) < 1 && Math.abs(p.y - last.y) < 1) return;
  annCur.pts.push(p);
  if (annInkRaf) return;              // one repaint per frame, like the PDF scroll handler
  annInkRaf = requestAnimationFrame(() => { annInkRaf = null; redrawInk(); });
});

function endStroke(e) {
  if (!annCur) return;
  try { annInk.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
  annCur = null;
  redrawInk();
}
annInk.addEventListener("pointerup", endStroke);
annInk.addEventListener("pointercancel", endStroke);

function undoStroke() {
  if (!annStrokes.length) return;
  annStrokes.pop();
  annCur = null;
  redrawInk();
}

// =====================================================================
// Save grades
// =====================================================================

// =====================================================================
// Captured images inside the .ods (which is a zip)
// =====================================================================
// An .ods file is a zip archive, and an ODF package has a standard place for images:
// a Pictures/ folder, listed in META-INF/manifest.xml. So the captured PNGs travel inside
// the save file as real files — no base64 in cells (a spreadsheet cell tops out at 32,767
// characters in Excel), no second download. The Comment_images sheet only maps a file name
// to the question it belongs to.
//
// We write the spreadsheet part with `compression: false`, which makes SheetJS store every
// entry uncompressed. That is what keeps this code small: the manifest can be patched as
// plain text, every other entry is copied byte for byte, and nothing here has to deflate or
// inflate anything (a PNG is already compressed, so storing it loses nothing).

const ODS_MIME = "application/vnd.oasis.opendocument.spreadsheet";

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

const utf8Bytes = (s) => new TextEncoder().encode(s);
const utf8Text = (b) => new TextDecoder().decode(b);
const asBytes = (x) => (x instanceof Uint8Array) ? x : new Uint8Array(x);

// base64 <-> bytes. The chunking keeps String.fromCharCode off the argument-count limit.
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000)
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

// Read a zip's central directory: one record per entry, in archive order. Returns null when
// this is not a zip we understand (no end-of-central-directory, or a corrupt record) —
// callers then leave the file alone rather than guessing.
function zipEntries(buf) {
  const b = asBytes(buf);
  if (b.length < 22) return null;
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const u16 = (p) => dv.getUint16(p, true), u32 = (p) => dv.getUint32(p, true);
  let eocd = -1;
  const floor = Math.max(0, b.length - 22 - 65535);     // 65535 = max zip comment length
  for (let p = b.length - 22; p >= floor; p--) if (u32(p) === 0x06054b50) { eocd = p; break; }
  if (eocd < 0) return null;
  const count = u16(eocd + 10);
  let p = u32(eocd + 16);
  const out = [];
  for (let i = 0; i < count; i++) {
    if (p + 46 > b.length || u32(p) !== 0x02014b50) return null;
    const nlen = u16(p + 28), elen = u16(p + 30), clen = u16(p + 32);
    out.push({
      name: utf8Text(b.subarray(p + 46, p + 46 + nlen)),
      method: u16(p + 10),
      crc: u32(p + 16),
      csize: u32(p + 20),
      usize: u32(p + 24),
      off: u32(p + 42),
    });
    p += 46 + nlen + elen + clen;
  }
  return out;
}

// Where an entry's (possibly compressed) bytes start, read from its local header — the
// local header's extra field may differ in length from the central one's.
function zipDataStart(b, e) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  if (e.off + 30 > b.length || dv.getUint32(e.off, true) !== 0x04034b50) return -1;
  const start = e.off + 30 + dv.getUint16(e.off + 26, true) + dv.getUint16(e.off + 28, true);
  return (start + e.csize <= b.length) ? start : -1;
}

// DOS date/time (time in the low half, date in the high half), as the zip format wants it.
function dosDateTime(d) {
  const t = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const day = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  return ((day << 16) | t) >>> 0;
}

// Write a zip from [{ name, method, crc, usize, data }], all entries stored as given. Entry
// order is preserved, which is what keeps ODF's "mimetype first" rule intact.
function writeZip(files) {
  const names = files.map(f => utf8Bytes(f.name));
  const stamp = dosDateTime(new Date());
  let size = 22;
  files.forEach((f, i) => { size += 30 + names[i].length + f.data.length + 46 + names[i].length; });
  const out = new Uint8Array(size);
  const dv = new DataView(out.buffer);
  const w16 = (p, v) => dv.setUint16(p, v, true), w32 = (p, v) => dv.setUint32(p, v >>> 0, true);
  const offs = [];
  let p = 0;
  files.forEach((f, i) => {
    offs.push(p);
    w32(p, 0x04034b50); w16(p + 4, 20); w16(p + 6, 0); w16(p + 8, f.method);
    w32(p + 10, stamp); w32(p + 14, f.crc); w32(p + 18, f.data.length); w32(p + 22, f.usize);
    w16(p + 26, names[i].length); w16(p + 28, 0);
    out.set(names[i], p + 30);
    p += 30 + names[i].length;
    out.set(f.data, p);
    p += f.data.length;
  });
  const cdStart = p;
  files.forEach((f, i) => {
    w32(p, 0x02014b50); w16(p + 4, 20); w16(p + 6, 20); w16(p + 8, 0); w16(p + 10, f.method);
    w32(p + 12, stamp); w32(p + 16, f.crc); w32(p + 20, f.data.length); w32(p + 24, f.usize);
    w16(p + 28, names[i].length); w16(p + 30, 0); w16(p + 32, 0);
    w16(p + 34, 0); w16(p + 36, 0); w32(p + 38, 0); w32(p + 42, offs[i]);
    out.set(names[i], p + 46);
    p += 46 + names[i].length;
  });
  w32(p, 0x06054b50); w16(p + 4, 0); w16(p + 6, 0);
  w16(p + 8, files.length); w16(p + 10, files.length);
  w32(p + 12, p - cdStart); w32(p + 16, cdStart); w16(p + 20, 0);
  return out;
}

// Register the pictures in the package manifest, so the file is a valid ODF package and
// other applications keep the images when they re-save it.
function addManifestEntries(xml, pics) {
  const rows = pics.map(p =>
    '<manifest:file-entry manifest:full-path="' + p.path + '" manifest:media-type="image/png"/>'
  ).join("");
  const end = xml.lastIndexOf("</manifest:manifest>");
  return end < 0 ? xml : xml.slice(0, end) + rows + xml.slice(end);
}

// Rebuild the .ods SheetJS produced with the captured PNGs added under Pictures/.
// Throws when the archive cannot be read, which the caller reports.
function addPicturesToOds(buf, pics) {
  const b = asBytes(buf);
  const entries = zipEntries(b);
  if (!entries) throw new Error("the spreadsheet library produced a file this app cannot extend");
  const files = [];
  for (const e of entries) {
    const start = zipDataStart(b, e);
    if (start < 0) throw new Error("unreadable entry in the spreadsheet: " + e.name);
    let data = b.subarray(start, start + e.csize);
    let method = e.method, crc = e.crc, usize = e.usize;
    if (e.name === "META-INF/manifest.xml") {
      if (method === 0) {
        data = utf8Bytes(addManifestEntries(utf8Text(data), pics));
        crc = crc32(data);
        usize = data.length;
      } else {
        // Only reachable if SheetJS ever compresses it: the images still travel, they are
        // just not declared, so another application may drop them when it re-saves.
        console.warn("manifest.xml is compressed; the captured images were not registered in it");
      }
    }
    files.push({ name: e.name, method, crc, usize, data });
  }
  for (const p of pics) {
    const data = b64ToBytes(p.b64);
    files.push({ name: p.path, method: 0, crc: crc32(data), usize: data.length, data });
  }
  // ODF wants "mimetype" first and uncompressed, so that the package type can be read from
  // the first bytes of the file. SheetJS writes it third; since the archive is being rebuilt
  // anyway, put it where the format asks for it.
  const mi = files.findIndex(f => f.name === "mimetype");
  if (mi > 0) files.unshift(files.splice(mi, 1)[0]);
  return writeZip(files);
}

// Pull every Pictures/* file out of a save file, as { path: dataURL }. A picture stored
// DEFLATEd (only possible if another application rewrote the package) is skipped rather than
// inflated here, since loading is synchronous; the comment text still loads.
function readOdsPictures(buf) {
  const byPath = {};
  const b = asBytes(buf);
  let entries = null;
  try { entries = zipEntries(b); } catch (err) { entries = null; }
  if (!entries) return byPath;
  for (const e of entries) {
    if (e.name.indexOf(PIC_DIR) !== 0 || !e.csize) continue;
    const start = zipDataStart(b, e);
    if (start < 0) continue;
    if (e.method !== 0) { console.warn("skipped a compressed image: " + e.name); continue; }
    byPath[e.name] = PNG_PREFIX + bytesToB64(b.subarray(start, start + e.csize));
  }
  return byPath;
}

// How much image data the save file would carry, in base64 characters (close enough to bytes
// × 4/3). Used by the guards below, since the app's only channel is alert/confirm.
const IMG_SOFT_CAP = 20e6;      // ask before writing a file this big
const IMG_HARD_CAP = 60e6;      // refuse another capture: SheetJS would hang the tab
function totalImageChars() {
  let n = 0;
  for (const name of Object.keys(imagesByStudent)) {
    const byQ = imagesByStudent[name];
    for (const key of Object.keys(byQ)) for (const shot of byQ[key]) n += shot.src.length;
  }
  return n;
}

// Build the save sheets, each as { name, aoa } (an array of cell-arrays).
// Returned in display order so the workbook tabs come out in that order.
//   Positions      — [name, position] (also the student list and its order): where the PDF
//                    was last left for that student, as a fractional page (3.25 = a
//                    quarter into page 3; see pdfScrollPos), blank when not known yet
//   Feedback       — [name, feedback]
//   Student_groups — [name, group] (group blank when none)
//   Grading_Scheme — one row per question: [title, "score1 score2 ..."] (the
//                    questions and their score options; column 2 is a list string)
//   Grades         — students × questions matrix, cell = obtained grade (number), left
//                    blank for a question that has not been graded yet
//   Comments       — students × questions matrix, cell = comment
//   Total          — [name, total, max_possible] (written for convenience, never read back)
function buildWorkbook() {
  // Each student now owns its own questions, so the Grades, Comments and
  // Grading_Scheme sheets use a per-student "alternating" layout: a header row
  // [name, ...question titles] immediately followed by a data row ["", ...values]
  // (blank first cell so the parser can tell headers from data). When there are no
  // students yet, emit one pair under a blank name so a draft scheme is at least
  // recorded in the file (a student is needed to reload it, since questions are
  // owned per student).
  const names = students.length ? students : [""];

  // Build an alternating sheet: cellFn(name, q) yields each data-row cell. The header
  // cell is the question key (qKey) so same-title questions in different groups stay
  // distinct across a save/reload; default-group questions keep a plain-title header.
  const alternating = (cellFn) => {
    const rows = [];
    for (const n of names) {
      const scheme = schemeFor(n);
      rows.push([n, ...scheme.map(q => qKey(q))]);
      rows.push(["", ...scheme.map(q => cellFn(n, q))]);
    }
    return rows;
  };

  // Emit grades as numeric cells (not formatted strings) so they survive Excel
  // round-trips and locale differences. A question that has not been graded yet writes
  // an empty cell — that blank is what makes "ungraded" distinct from "graded 0", and
  // loadWorkbook reads it back as no grade at all.
  const gradeCell = (n, q) => {
    const v = (n && gradesByStudent[n]) ? gradesByStudent[n][qKey(q)] : undefined;
    return isGraded(v) ? v : "";
  };

  return [
    { name: "Positions",      aoa: students.map(n => [n, scrollPosByStudent[n] >= 1 ? scrollPosByStudent[n] : ""]) },
    { name: "Feedback",      aoa: students.map(n => [n, feedbackByStudent[n] || ""]) },
    { name: "Student_groups", aoa: students.map(n => [n, groupByStudent[n] || ""]) },
    // Per student: [name, ...titles] then ["", ..."score1 score2 ..." per question].
    { name: "Grading_Scheme", aoa: alternating((n, q) => scoreSpecText(q)) },
    { name: "Grades",         aoa: alternating(gradeCell) },
    { name: "Comments",       aoa: alternating((n, q) => (n && commentsByStudent[n] && commentsByStudent[n][qKey(q)]) || "") },
    // Convenience only: the running total next to the full max of every question.
    { name: "Total",          aoa: students.map(n => [n, computeTotals(n).sum, schemeMax(n)]) },
    // Machine-only, like Total: which captured image file belongs to which question.
    { name: "Comment_images", aoa: collectImages().rows },
  ];
}

// Trigger a browser download of `data` (a string or bytes) as `filename` with the given MIME type.
function downloadFile(filename, data, mime) {
  const blob = new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function saveGrades() {
  if (students.length === 0 && schemeQuestions.length === 0) {
    alert("Nothing to save yet — add a question or a student first.");
    return;
  }
  if (!window.XLSX) {
    alert("Spreadsheet library failed to load. Check your internet connection (SheetJS is loaded from a CDN).");
    return;
  }
  saveCurrentStudent();
  const wb = XLSX.utils.book_new();
  for (const { name, aoa } of buildWorkbook())
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);
  const pics = collectImages().pics;
  if (pics.length === 0) {
    // Nothing captured: the plain path. The .ods extension → SheetJS writes ODS;
    // compression: true DEFLATEs the zip entries. Triggers the download.
    XLSX.writeFile(wb, "grades.ods", { compression: true });
    return;
  }
  // With captures, write the bytes ourselves so the PNGs can be added to the same zip
  // (addPicturesToOds needs the entries stored, which is what compression: false gives).
  const chars = totalImageChars();
  if (chars > IMG_SOFT_CAP && !confirm(
        pics.length + " captured images add roughly " + Math.round(chars / 1e6) +
        " MB to grades.ods. Save anyway?")) return;
  try {
    const sheetBytes = XLSX.write(wb, { type: "array", bookType: "ods", compression: false });
    downloadFile("grades.ods", addPicturesToOds(sheetBytes, pics), ODS_MIME);
  } catch (err) {
    alert("Could not write the captured images into grades.ods: " +
          (err && err.message ? err.message : err));
  }
}

// =====================================================================
// Export printable grade slips (one self-contained card per student)
// =====================================================================

// Escape a string for safe insertion into HTML text/attribute content.
function htmlEscape(s) {
  s = (s === null || s === undefined) ? "" : String(s);
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Build a standalone, print-ready HTML document: one bordered slip per student,
// language-agnostic (no labels), ready to print and cut apart. Reuses
// computeTotals() and fmt() so totals match the on-screen UI exactly.
// `opts` carries the two choices made in the export dialog: `columns` (1, 2 or 3 columns of
// slips on the printed page) and `compact` (print only the questions that have something to
// say). The defaults are what the export has always produced, so a call without options is
// unchanged.
function buildGradesHTML(opts) {
  const columns = (opts && opts.columns) || 3;
  const compact = !!(opts && opts.compact);
  const slips = students.map(name => {
    const scheme = schemeFor(name);
    const total = computeTotals(name);
    const grades = gradesByStudent[name] || {};
    const comments = commentsByStudent[name] || {};
    const images = imagesByStudent[name] || {};
    const feedback = (feedbackByStudent[name] || "").trim();
    const groupTotals = computeGroupTotals(name);

    // Compact mode prints a question only when it has something to say: points were lost, a
    // comment was written, or a rectangle was captured (a marked-up capture stands in for a
    // comment, by design). A question that was never graded says nothing and is dropped.
    // Group headers, subtotals and the slip total are printed either way, and no number
    // changes — this is a print filter, not a different calculation.
    const keepQ = (q) => {
      if (!compact) return true;
      const k = qKey(q);
      if ((comments[k] || "").trim()) return true;
      if ((images[k] || []).length) return true;
      const v = grades[k];
      return isGraded(v) && Number(v) < Number(q.max) - 1e-9;
    };

    const qrow = (q) => {
      // A question that was never graded prints an en dash instead of a score, and counts
      // toward neither the group subtotal nor the slip total.
      const v = grades[qKey(q)];
      const graded = isGraded(v);
      const comment = (comments[qKey(q)] || "").trim();
      // Captured rectangles print under the row (.qrow wraps), so a marked-up excerpt of
      // the student's own work can stand in for a written comment.
      const shots = images[qKey(q)] || [];
      return (
        '<div class="qrow' + (graded ? '' : ' ungraded') + '">' +
          '<div class="qtitle">' + htmlEscape(q.title) + '</div>' +
          (comment ? '<div class="qcomment">' + htmlEscape(comment) + '</div>' : '') +
          '<div class="qpts">' + (graded ? htmlEscape(fmt(v)) : '&ndash;') + ' / ' + htmlEscape(fmt(q.max)) + '</div>' +
          (shots.length
            ? '<div class="qshots">' +
                // A capture whose corner was dragged prints at that fraction of the slip's
                // width; one that was left alone prints exactly as it always has.
                shots.map(s => {
                  const box = s.w
                    ? ' class="qshot sized" style="width: ' + (Math.round(s.w * 1000) / 10) + '%"'
                    : ' class="qshot"';
                  return '<img' + box + ' src="' + htmlEscape(s.src) + '" alt="">';
                }).join("") +
              '</div>'
            : '') +
        '</div>'
      );
    };

    // Group by group, matching the on-screen list: each group gets a header row with
    // its subtotal. The default group ("") gets a blank-named header too, but only when
    // it sits alongside named groups; a plain ungrouped slip stays flat.
    const groupList = groupedScheme(scheme);
    const rows = groupList.map(grp => {
      let html = "";
      if (grp.group || groupList.length > 1) {
        const t = groupTotals[grp.group] || { sum: 0, max: 0 };
        // The default (empty-named) group prints its header bar but no subtotal points.
        const sub = grp.group
          ? '<div class="qgsub">' + htmlEscape(fmt(t.sum)) + ' / ' + htmlEscape(fmt(t.max)) + '</div>'
          : '';
        html += '<div class="qgroup">' +
                  '<div class="qgname">' + htmlEscape(grp.group) + '</div>' +
                  sub +
                '</div>';
      }
      return html + grp.questions.filter(keepQ).map(qrow).join("");
    }).join("");

    return (
      '<div class="slip">' +
        '<div class="head">' +
          '<div class="name">' + htmlEscape(name) + '</div>' +
        '</div>' +
        (rows ? '<div class="questions">' + rows + '</div>' : '') +
        // Last row: feedback on the left, total on the right (total alone if no feedback).
        '<div class="sumrow">' +
          (feedback ? '<div class="feedback">' + htmlEscape(feedback) + '</div>' : '') +
          '<div class="total">' + htmlEscape(fmt(total.sum)) + ' / ' + htmlEscape(fmt(total.max)) + '</div>' +
        '</div>' +
      '</div>'
    );
  }).join("");

  return (
'<!DOCTYPE html>\n' +
'<html lang="en">\n<head>\n<meta charset="UTF-8">\n' +
'<title>Grades</title>\n' +
'<style>\n' +
'  * { box-sizing: border-box; }\n' +
'  body {\n' +
'    margin: 24px;\n' +
'    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;\n' +
'    color: #1f2937;\n' +
'    background: #f4f5f7;\n' +
'  }\n' +
'  .sheet { column-count: ' + columns + '; column-gap: 12px; }\n' +
'  .slip {\n' +
'    border: 1px solid #d7dbe0;\n' +
'    border-radius: 8px;\n' +
'    background: #fff;\n' +
'    padding: 12px 14px;\n' +
'    margin: 0 0 18px;\n' +
'    break-inside: avoid;\n' +
'    page-break-inside: avoid;\n' +
'  }\n' +
'  .head {\n' +
'    display: flex;\n' +
'    align-items: baseline;\n' +
'    justify-content: space-between;\n' +
'    gap: 16px;\n' +
'    border-bottom: 1px solid #eef0f3;\n' +
'    padding-bottom: 8px;\n' +
'  }\n' +
'  .name { font-size: 18px; font-weight: 700; }\n' +
'  .sumrow { display: flex; align-items: baseline; gap: 12px; margin-top: 10px; }\n' +
'  .questions + .sumrow { border-top: 2px solid #d7dbe0; padding-top: 8px; }\n' +
'  .total { margin-left: auto; font-size: 18px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }\n' +
'  .feedback {\n' +
'    flex: 1 1 auto;\n' +
'    min-width: 0;\n' +
'    font-size: 14px;\n' +
'    font-style: italic;\n' +
'    color: #374151;\n' +
'    white-space: pre-wrap;\n' +
'  }\n' +
'  .questions { margin-top: 10px; }\n' +
'  .qrow {\n' +
'    display: flex;\n' +
'    flex-wrap: wrap;\n' +
'    align-items: baseline;\n' +
'    gap: 8px;\n' +
'    padding: 5px 0;\n' +
'    border-top: 1px solid #f3f4f6;\n' +
'  }\n' +
'  .qrow:first-child { border-top: 0; }\n' +
'  .qgroup {\n' +
'    display: flex;\n' +
'    align-items: baseline;\n' +
'    justify-content: space-between;\n' +

// ---- The range feedback dialog ----
// One phrase for every student whose total lies in a range — "Excellent work!" from 16/20 up —
// added at the end of their feedback in one go. Each end is a fraction, read as a share of
// each student's own full mark, so students on different schemes are measured alike. Only a
// fully graded copy counts: a running total stays low until the last question is in, and would
// otherwise collect the low end's phrase.
const rngBack = document.getElementById("rngBack");
const rngBox = document.getElementById("rngBox");
const rngLoNum = document.getElementById("rngLoNum");
const rngLoDen = document.getElementById("rngLoDen");
const rngHiNum = document.getElementById("rngHiNum");
const rngHiDen = document.getElementById("rngHiDen");
const rngText = document.getElementById("rngText");
const rngOk = document.getElementById("rngOk");
const rngCountN = document.getElementById("rngCountN");
const RNG_EPS = 1e-9;          // 16/20 is 0.8 and so is a total of 16 out of 20, float or not
let rngOpen = false;

// A box's number: null when empty, NaN when it is no number at all. Stricter than toNum,
// which reads "16x" as 16 — the count beside it must not agree with a typo.
function rngNum(input) {
  const s = input.value.trim();
  if (s === "") return null;
  return Number(s.indexOf(".") === -1 ? s.replace(",", ".") : s);
}

// The range as two shares of the full mark, { lo, hi }, or null when a box will not do; every
// box at fault is marked. An empty top leaves that end open, which is what "16/20 and up"
// needs (bonus points included), and likewise an empty bottom.
function readRange() {
  const loNum = rngNum(rngLoNum), loDen = rngNum(rngLoDen);
  const hiNum = rngNum(rngHiNum), hiDen = rngNum(rngHiDen);
  const numOk = n => n === null || isFinite(n);
  const denOk = d => d !== null && isFinite(d) && d > 0;
  const bad = new Set();
  if (!numOk(loNum)) bad.add(rngLoNum);
  if (!denOk(loDen)) bad.add(rngLoDen);
  if (!numOk(hiNum)) bad.add(rngHiNum);
  if (!denOk(hiDen)) bad.add(rngHiDen);
  let range = null;
  if (bad.size === 0) {
    range = { lo: loNum === null ? -Infinity : loNum / loDen,
              hi: hiNum === null ? Infinity : hiNum / hiDen };
    if (range.lo > range.hi + RNG_EPS) { bad.add(rngLoNum); bad.add(rngHiNum); range = null; }
  }
  for (const el of [rngLoNum, rngLoDen, rngHiNum, rngHiDen]) el.classList.toggle("bad", bad.has(el));
  return range;
}

// The students a range takes in, both ends included. Pure — the count and the tick share it.
function rangeStudents(range) {
  return students.filter(name => {
    if (studentStatus(name) !== "graded") return false;
    const max = schemeMax(name);
    if (!(max > 0)) return false;
    const share = computeTotals(name).sum / max;
    return share >= range.lo - RNG_EPS && share <= range.hi + RNG_EPS;
  });
}

// Repaint the count and the tick from the boxes, on every keystroke: the teacher sees what the
// tick will do before pressing it.
function paintRange() {
  const range = readRange();
  rngCountN.textContent = range ? String(rangeStudents(range).length) : "–";
  rngOk.disabled = !range || !rngText.value.trim();
  // An empty top reads as the full mark, whatever it is out of.
  rngHiNum.placeholder = rngHiDen.value.trim();
  return range;
}

function openRangeFeedback() {
  if (students.length === 0) {
    alert("No students yet.");
    return;
  }
  closeCombo();                 // nothing should hang over the dialog
  saveCurrentStudent();         // a half-typed score counts toward the total it is judged by
  const max = fmt(schemeMax(currentStudent));
  rngLoNum.value = ""; rngHiNum.value = "";
  rngLoDen.value = max; rngHiDen.value = max;
  rngLoNum.placeholder = "0";
  rngText.value = "";
  rngOpen = true;
  rngBack.classList.add("open");
  rngBox.classList.add("open");
  paintRange();
  rngLoNum.focus();             // the boxes in reading order: from, out of, to, out of, phrase
}

function closeRangeFeedback() {
  rngOpen = false;
  rngBack.classList.remove("open");
  rngBox.classList.remove("open");
  if (rngBox.contains(document.activeElement)) document.activeElement.blur();
}

// The dialog's tick. A student whose feedback already says the phrase is passed over, so a
// second press adds nothing.
function confirmRangeFeedback() {
  const range = paintRange();
  const text = rngText.value.trim();
  if (!range || !text) return;
  saveCurrentStudent();
  const before = feedbackByStudent[currentStudent];
  for (const name of rangeStudents(range)) {
    const cur = feedbackByStudent[name] || "";
    if (cur.indexOf(text) < 0) feedbackByStudent[name] = joinPhrase(cur, text);
  }
  closeRangeFeedback();
  if (currentStudent && feedbackByStudent[currentStudent] !== before) {
    globalFeedback.value = feedbackByStudent[currentStudent];
    kbFlashSaved(globalFeedback);
  }
}

function readFile(input, asArrayBuffer, callback) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => callback(reader.result, file.name);
  if (asArrayBuffer) reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
  input.value = ""; // allow re-importing the same file
}

// Open the PDF(s) picked in the file dialog. Several files are merged (in file-name order)
// into one document with pdf-lib, which the rest of the app then sees as a single PDF.
async function openPdfFiles(input) {
  const files = Array.from(input.files || []).sort((a, b) => compareNames(a.name, b.name));
  input.value = ""; // allow re-opening the same selection
  if (files.length === 0) return;
  if (files.length === 1) {
    renderPdf(await files[0].arrayBuffer(), files[0].name);
    return;
  }
  if (!window.PDFLib) {
    alert("PDF writing library failed to load. Check your internet connection (pdf-lib is loaded from a CDN).");
    return;
  }
  let current = "";
  try {
    const merged = await PDFLib.PDFDocument.create();
    for (const f of files) {
      current = f.name;
      const src = await PDFLib.PDFDocument.load(await f.arrayBuffer(), { ignoreEncryption: true });
      for (const p of await merged.copyPages(src, src.getPageIndices())) merged.addPage(p);
    }
    const bytes = await merged.save();
    renderPdf(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength), "merged.pdf");
  } catch (err) {
    alert('Could not merge the PDFs ("' + current + '"): ' + (err && err.message ? err.message : err));
  }
}

// The page selector's own ▲/▼, and the arrow keys (and wheel, when focused) in it, go back/forward
// like the PDF does (the browser's stepping, like its hidden spinner, goes the other way).
function invertStepping(input, step) {
  input.addEventListener("keydown", e => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    if (e.ctrlKey || e.metaKey) return;   // Ctrl+up/down scrolls the PDF, here as anywhere
    e.preventDefault();
    step(e.key === "ArrowUp" ? -1 : 1);
  });
  input.addEventListener("wheel", e => {
    if (document.activeElement !== input || !e.deltaY) return;
    e.preventDefault();   // also tells the "scroll PDF from anywhere" handler to skip it
    step(e.deltaY < 0 ? -1 : 1);
  }, { passive: false });
}

// ---- Dragging a thumbnail's corner grip ----
// The drag says how wide the picture should be drawn, as a fraction of the panel it sits in
// — the same fraction of the same box in the printed slip, which is what lets the teacher
// size it here and have it mean something there. Both ends of the ratio come from
// getBoundingClientRect on purpose: #questions carries the grading zoom, which scales client
// rects and the pointer alike (clientWidth is not scaled), so a ratio of two client rects is
// the one expression that holds at every zoom.
let shotResize = null;          // { key, i, fig, left, panelW, w } while a grip is dragged

questionsEl.addEventListener("pointerdown", e => {
  const grip = e.target.closest && e.target.closest(".qshot-grip");
  if (!grip || e.button !== 0) return;
  const fig = grip.closest(".qshot"), panel = grip.closest(".qshots-panel");
  const pr = panel && panel.getBoundingClientRect();
  if (!fig || !pr || !(pr.width > 0) || !panel.offsetWidth) return;
  // The width the figure's percentage will resolve against is the panel's *content* box; the
  // panel is indented to line up with the row's text, and measuring its border box instead
  // would leave the thumbnail trailing the pointer by that indent. offsetWidth is the same
  // box as the rect but unzoomed, so their quotient converts the padding into client pixels.
  const cs = getComputedStyle(panel), z = pr.width / panel.offsetWidth;
  const pad = ((parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0)) * z;
  // The left edge is read once: a thumbnail that stops wrapping mid-drag would otherwise
  // move out from under the pointer.
  shotResize = { key: grip.dataset.key, i: Number(grip.dataset.i), fig: fig,
                 left: fig.getBoundingClientRect().left, panelW: pr.width - pad, w: null };
  try { grip.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();           // no text selection, and no focus leaving the comment box
});

questionsEl.addEventListener("pointermove", e => {
  if (!shotResize) return;
  const w = Math.min(1, Math.max(SHOT_MIN_W,
                                 (e.clientX - shotResize.left) / shotResize.panelW));
  shotResize.w = w;
  shotResize.fig.classList.add("sized");
  shotResize.fig.style.width = (w * 100) + "%";
});

questionsEl.addEventListener("pointerup", () => {
  const r = shotResize;
  shotResize = null;
  if (r && r.w !== null) setShotWidth(r.key, r.i, r.w);
});

// A press that ends in nothing (a cancelled gesture) leaves the model alone; the panel is
// repainted so the live width goes back to what is stored.
questionsEl.addEventListener("pointercancel", () => {
  const r = shotResize;
  shotResize = null;
  if (r) paintShots(r.key);
});

// Edit, remove or reorder a question/group via its row buttons (delegated so it covers
// re-renders). Remove and the arrows are only rendered on the row being edited.
questionsEl.addEventListener("click", e => {
  const cap = e.target.closest(".qcapture");
  if (cap) { toggleCaptureArm(cap.dataset.key); return; }
  const sh = e.target.closest(".qshots");
  if (sh) { toggleShots(sh.dataset.key); return; }
  const del = e.target.closest(".qshot-del");
  if (del) { removeShot(del.dataset.key, +del.dataset.i); return; }
  const draw = e.target.closest(".qshot-edit, .qshot-img");
  if (draw) { openAnnotator({ key: draw.dataset.key, i: +draw.dataset.i, mode: "edit" }); return; }
  const ed = e.target.closest(".qedit");
  if (ed) {
    ed.closest(".question").classList.contains("editing") ? commitEdit() : beginEdit(ed.dataset.key);
    return;
  }
  const grm = e.target.closest(".qgremove"); // group remove — check first (also carries .qremove)
  if (grm) { removeGroup(grm.dataset.group); return; }
  const rm = e.target.closest(".qremove");
  if (rm) {
    if (rm.closest(".question").dataset.draft) cancelDraft(); // nothing created yet, nothing to confirm
    else { editingKey = null; removeQuestion(rm.dataset.key); }
    return;
  }
  const gmv = e.target.closest(".qgmove"); // group move — check first (also carries .qmove)
  if (gmv) { if (!gmv.disabled) moveGroup(gmv.dataset.group, gmv.dataset.dir); return; }
  const mv = e.target.closest(".qmove");
  if (!mv || mv.disabled) return;
  // The arrows live on the edited row, so apply what was typed first and keep it open —
  // its key may have just changed.
  const key = commitEdit();
  if (key === false || !key) return;
  editingKey = key;
  moveQuestion(key, mv.dataset.dir);
});
