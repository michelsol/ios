  closeCombo();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || !comboPopup.classList.contains("open")) return;
  closeCombo();
  // Say the key has been used, so the grid does not drop its own cursor on the same press.
  e.preventDefault();
});

// ---- The export options dialog's controls ----
document.getElementById("expOk").addEventListener("click", confirmExport);
document.getElementById("expCancel").addEventListener("click", closeExportOptions);
expBack.addEventListener("pointerdown", closeExportOptions);
expBox.addEventListener("click", e => {
  const col = e.target.closest(".expcol");
  if (col) { expColumns = Number(col.dataset.n); paintExportOptions(); return; }
  if (e.target.closest(".expcompact")) { expCompact = !expCompact; paintExportOptions(); }
});

// ---- The range feedback dialog's controls ----
document.getElementById("rngOpenBtn").addEventListener("click", openRangeFeedback);
rngOk.addEventListener("click", confirmRangeFeedback);
document.getElementById("rngCancel").addEventListener("click", closeRangeFeedback);
rngBack.addEventListener("pointerdown", closeRangeFeedback);
rngBox.addEventListener("input", paintRange);

// ---- The red-pen editor's controls ----
document.getElementById("annOk").addEventListener("click", () => closeAnnotator(true));
document.getElementById("annCancel").addEventListener("click", () => closeAnnotator(false));
annBack.addEventListener("pointerdown", () => closeAnnotator(false));
annUndo.addEventListener("click", undoStroke);
document.getElementById("annClear").addEventListener("click", () => {
  annStrokes.length = 0;
  annCur = null;
  redrawInk();
});
// The pen widths: one is always chosen, and it is remembered for the next capture.
document.getElementById("annPens").addEventListener("click", e => {
  const btn = e.target.closest(".annw");
  if (!btn) return;
  penScale = parseFloat(btn.dataset.w);
  document.querySelectorAll("#annPens .annw").forEach(b => b.classList.toggle("on", b === btn));
});
// While the editor is open the keyboard belongs to it. The two handlers above are no
// trouble: one needs an open suggestion list (closed here), the other a question being edited.
document.addEventListener("keydown", e => {
  if (expOpen) {
    if (e.key === "Escape") { e.preventDefault(); closeExportOptions(); }
    else if (e.key === "Enter") { e.preventDefault(); confirmExport(); }
    return;
  }
  if (rngOpen) {
    if (e.key === "Escape") { e.preventDefault(); closeRangeFeedback(); }
    else if (e.key === "Enter") { e.preventDefault(); confirmRangeFeedback(); }
    return;
  }
  if (annState) {
    if (e.key === "Escape") { e.preventDefault(); closeAnnotator(false); }
    else if (e.key === "Enter") { e.preventDefault(); closeAnnotator(true); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undoStroke(); }
    return;
  }
  if (e.key === "Escape" && capState) { e.preventDefault(); cancelCapture(); }
});
// Pressing anywhere but the PDF (or the button itself) gives up on an armed capture.
document.addEventListener("pointerdown", e => {
  if (!capState || capState.dragging) return;
  if (pdfPane.contains(e.target)) return;
  if (e.target.closest && e.target.closest(".qcapture")) return;
  cancelCapture();
});

// A box keeps focus after its list closes (a pick, Escape, a scroll), and focus alone
// won't fire again — so a click on a combo box reopens its list too. "click", not
// "mousedown": on a first click, focus (fired on mousedown) has already opened it.
// Boxes marked _comboArrowOnly are exempt: their list is the arrow's business alone. Boxes
// marked _comboClickToggles (the comments and the feedback, which have no arrow) fold an open
// list on a second click.
document.addEventListener("click", e => {
  const input = e.target.closest && e.target.closest(".combo input");
  if (!input || !input._comboItems || input._comboArrowOnly) return;
  if (activeComboInput === input && comboPopup.classList.contains("open")) {
    if (input._comboClickToggles) closeCombo();
    return;
  }
  openCombo(input);
});
questionsEl.addEventListener("scroll", () => { if (comboPopup.classList.contains("open")) closeCombo(); });
window.addEventListener("resize", () => { if (comboPopup.classList.contains("open")) closeCombo(); });

btnSavePdf.addEventListener("click", savePdf);
btnRotatePage.addEventListener("click", rotateCurrentPage);
btnDeletePage.addEventListener("click", deleteCurrentPage);
btnPageUp.addEventListener("click", () => movePage(-1));
btnPageDown.addEventListener("click", () => movePage(1));

// Page navigation: typing a position (5 = top of page 5, 5.5 = halfway into it) and
// pressing Enter jumps there; its ▲/▼ step a whole page (stepPdfPage).
pageInput.addEventListener("change", () => {
  const v = parseFloat(pageInput.value);
  if (v >= 1) scrollPdfTo(v);
  else showPdfPosition();
});

// Keep the page selector (the exact position) in sync as the PDF is scrolled.
let pageSyncRaf = null;
pdfPane.addEventListener("scroll", () => {
  if (pageSyncRaf) return;
  pageSyncRaf = requestAnimationFrame(() => {
    pageSyncRaf = null;
    if (pageCanvases.length === 0) return;
    showPdfPosition();
    recordPositionIfOn();
  });
});

// Mouse wheel always scrolls the PDF, from anywhere on the page (including over
// the grading area), unless a combo list is open. The grading list can still be
// scrolled by dragging its scrollbar.
window.addEventListener("wheel", e => {
  if (annState || expOpen || rngOpen) return;  // a dialog is open: the PDF behind it stays put
  if (!onlyScrollPdf.checked) return; // let the hovered area scroll natively
  if (e.defaultPrevented) return;     // already handled (a focused page box steps instead)
  if (comboPopup.classList.contains("open")) return; // a combo is open: scroll natively
  if (pdfPane.scrollHeight <= pdfPane.clientHeight) return; // nothing to scroll
  pdfPane.scrollTop += e.deltaY;
  e.preventDefault();
}, { passive: false });

// Drag the divider to reallocate horizontal space between the PDF and grading panes.
// Pointer capture keeps the drag tracking even when the cursor is over the PDF canvas.
const appEl = document.getElementById("app");
const leftPane = document.getElementById("left");
const divider = progressEl;   // the progress strip doubles as the divider
let draggingSplit = false;
divider.addEventListener("pointerdown", e => {
  draggingSplit = true;
  divider.setPointerCapture(e.pointerId);
  document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none";
  e.preventDefault();
});
divider.addEventListener("pointermove", e => {
  if (!draggingSplit) return;
  const rect = appEl.getBoundingClientRect();
  const w = e.clientX - rect.left;
  const min = rect.width * 0.2, max = rect.width * 0.8;
  leftPane.style.width = Math.min(max, Math.max(min, w)) + "px";
});
const endDrag = e => {
  if (!draggingSplit) return;
  draggingSplit = false;
  try { divider.releasePointerCapture(e.pointerId); } catch (_) {}
  document.body.style.cursor = "";
  document.body.style.userSelect = "";
};
divider.addEventListener("pointerup", endDrag);
divider.addEventListener("pointercancel", endDrag);

// No button in this app takes the keyboard from a mouse press. Otherwise the last one
// clicked keeps it, and the next Enter or Space presses it again — the file dialog opening
// a second time instead of the grid grading. Ten buttons already say this for themselves
// (see onButtonPress, and every combo arrow); this says it once, for all of them. Preventing
// the default on mousedown does not cancel the click they act on, and no button in the file
// has an :active rule to lose. Tab does not reach them either (see the keydown handler).
document.addEventListener("mousedown", e => {
  if (e.target.closest && e.target.closest("button")) e.preventDefault();
});

// ---- One handler for every keystroke the grading list owns ----

document.addEventListener("keydown", e => {
  // Anything already dealt with: the editing row's Enter/Escape, a suggestion row's Enter, the
  // page box's arrows, an armed capture's Escape, a folded suggestion list. Those handlers run
  // first — they sit on the elements themselves, or were registered earlier — and this is how
  // they say so.
  // A digit run ends at the first other key, whoever takes that key (see kbDigitRun).
  const run = kbDigitRun;
  if (!KB_MODIFIERS.has(e.key)) kbDigitRun = null;
  if (e.defaultPrevented) return;
  // A keystroke an input method is still composing into a character belongs to it alone: it
  // arrives before any character exists, so acting on it would grade or type the wrong thing.
  if (e.isComposing || e.keyCode === 229) return;
  if (expOpen || annState || rngOpen) {   // a dialog owns the keyboard (see its own handler)
    // ...but it must not leak this one: the browser would drop a "save this page" window
    // over the dialog.
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") e.preventDefault();
    return;
  }
  const typing = isTextEntry(document.activeElement);

  // Ctrl holds the save and nothing that moves: the arrows and the home row walk the list and
  // the pile, and Shift scrolls the PDF (see the block below).
  if (e.ctrlKey || e.metaKey) {
    if (e.key.toLowerCase() === "s") {
      // Ctrl+S saves the work, as everywhere else, and from anywhere — a comment box
      // included: saveGrades() harvests every box before it writes, so what is half-typed
      // goes in with the rest.
      saveGrades();
      e.preventDefault();                 // ...and the browser does not offer the page
    }
    return;                               // every other chord stays the browser's own
  }

  // An open list takes the keys that walk it, and lets the rest through: typing still reaches
  // the box behind it, and Escape still reaches the handler that folds it.
  if (comboPopup.classList.contains("open")) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (moveComboCursor(e.key === "ArrowDown" ? 1 : -1)) e.preventDefault();
      return;
    }
    // Tab walks the list too: the arrows are a reach, and j/k cannot serve here — the box
    // behind the list has the keyboard, where they would simply be letters.
    if (e.key === "Tab") {
      moveComboCursor(e.shiftKey ? -1 : 1);
      e.preventDefault();                 // an empty list too: Tab never leaves the box
      return;
    }
    // Anything else typed belongs to the box the list hangs off — Backspace included, which
    // narrows the list less.
    if (e.key !== "Enter") return;
    if (comboIndex >= 0) { pickComboCursor(); e.preventDefault(); return; }
    // Enter with no row highlighted: fold the list, then let the same press go on to mean
    // "done with this cell" below — the score box unfolds its list as it gains focus, and
    // would otherwise need three Enters to take one typed grade.
    closeCombo();
  }

  // Tab never leaves the grid: the browser would walk the buttons and score keys, drawing its
  // own focus ring beside the grid's outline. In a box with a list it unfolds the list and
  // lands on the first row (Shift+Tab: the last), as the down arrow does; once the list is
  // open, the block above walks it. Any other box — a question being edited, the page box —
  // keeps its own Tab.
  if (e.key === "Tab" && !e.altKey) {
    const el = document.activeElement;
    if (typing && el._comboItems) {
      openCombo(el);
      // A list that opens on a row of its own (the current student, the first score, the top
      // suggestion) keeps it.
      if (comboIndex < 0) moveComboCursor(e.shiftKey ? -1 : 1);
      e.preventDefault();
      return;
    }
    if (kbOwnsKey() || (el && el.tagName === "BUTTON")) { e.preventDefault(); return; }
  }

  // Shift+Up/Down (and Shift+K/J) scroll the PDF, and Shift+Space opens the score box. Not
  // Ctrl+jk: those are the browser's own (downloads, search bar), which a page cannot reliably
  // take back, whereas no browser lays a finger on a Shift letter. It sits after the list's
  // own keys and before the focused box gets its say, which is what lets the PDF scroll from
  // inside a comment. Shift+Left/Right and Shift+H/L fall through to the plain keys below.
  if (e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
    // In a box only the real arrows can mean anything here: a capital is a capital.
    const k = (typing || e.key.length !== 1) ? e.key : (HOME_KEY[e.key.toLowerCase()] || e.key);
    if (k === "ArrowUp" || k === "ArrowDown") {
      // These reach the PDF even mid-comment: in a one-line box they only select to the
      // start or the end of the line, which Shift+Home and Shift+End already do, and reading
      // further down the copy mid-sentence is worth more than that.
      pdfPane.scrollTop += k === "ArrowDown" ? KB_PDF_SCROLL : -KB_PDF_SCROLL;
      e.preventDefault();
      return;
    }
    // A score no key offers: the box, with its list of the uncommon ones. In a box it is a
    // space like any other. kbOwnsKey still holds — a focused button keeps its own Space.
    if (!typing && e.key === " ") {
      if (kbOwnsKey() && kbOpenScore()) e.preventDefault();
      return;
    }
    // Anything else Shift does belongs to the browser: a capital, a selection.
  }

  // A box of the cursored row holds the keyboard: it keeps every key but the two that give it
  // back and the one that unfolds its list.
  if (kbTyping()) {
    if (e.key === "Enter") { kbLeaveCell(true); e.preventDefault(); }
    else if (e.key === "Escape") { kbLeaveCell(false); e.preventDefault(); }
    else if (e.key === "ArrowDown") {
      // Unfold *and* land on the first suggestion in the one press: a list is only ever
      // unfolded in order to pick from it. The guard is for a list that opens on a row of
      // its own (the current student, the first score, the top suggestion) — that row keeps it.
      openCombo(document.activeElement);
      if (comboIndex < 0) moveComboCursor(1);
      e.preventDefault();
    }
    return;
  }
  if (typing) return;                     // any other box: the toolbars keep all their keys

  // Out here the home row stands in for the arrows, and arrives at their own four cases
  // below. Inside a box they are letters, which the guard above has already seen to. The case
  // is never read from the letter, so Caps Lock changes nothing.
  const home = e.key.length === 1 ? HOME_KEY[e.key.toLowerCase()] : null;

  switch (home || e.key) {
    // Up and down walk the questions; left and right step through the pile, and the cursor
    // stays on the same question from one copy to the next.
    case "ArrowUp":    kbMove(-1); e.preventDefault(); return;
    case "ArrowDown":  kbMove(1);  e.preventDefault(); return;
    case "ArrowLeft":  moveStudent(-1); e.preventDefault(); return;
    case "ArrowRight": moveStudent(1);  e.preventDefault(); return;
    case " ":
      // Space opens the row's comment: it is the key the hand is already on, and a comment
      // is wanted on nearly every row. kbOwnsKey still holds — a focused button keeps its
      // own Space.
      if (kbOwnsKey() && kbOpenComment()) e.preventDefault();
      return;
    case "PageUp":
    case "PageDown":
      // A whole page of the PDF, as in any document viewer. Not Ctrl+Page, which every
      // browser keeps for switching tabs — Chrome does not even deliver that keystroke to
      // the page, and Firefox switches tabs whatever the page says about it. With no PDF
      // open there is nothing to step, so the key is left to the browser.
      if (pageCanvases.length) {
        stepPdfPage(e.key === "PageDown" ? 1 : -1);
        e.preventDefault();
      }
      return;
    case "Backspace":
    case "Delete":
      if (kbClearGrade()) e.preventDefault();
      return;
    case "Escape":
      if (kbCursor) { kbCursor = null; paintKbCursor(false); e.preventDefault(); }
      return;
    default:
      // A digit grades the row, and the same digit again moves on to the next key with it. It
      // reads the character the layout produced and never the key that produced it: on an
      // AZERTY keyboard "é" and "2" are one key, and Shift is the whole of the difference.
      // Nothing else here is ours: a letter is left alone, Space being the way into a comment.
      if (e.key >= "0" && e.key <= "9" && e.key.length === 1 && kbDigit(e.key, run))
        e.preventDefault();
  }
});

// Pressing anywhere on a row moves the cursor onto it, so the outline never points at a
// question the teacher has left. A press on no row — a group's header, the "+" bar, the
// scrollbar — leaves it alone, and so does the middle button (it steps to the next student).
questionsEl.addEventListener("pointerdown", e => {
  if (e.button !== 0 || !e.target.closest) return;
  kbCursorTo(e.target);
});
// A grade set with the mouse ends a digit run: the next digit starts again from its first key.
document.addEventListener("pointerdown", () => { kbDigitRun = null; }, true);

updateNavButtons();
refreshPositionButton();

// =====================================================================
// A pre-loaded link
// =====================================================================

// ?pdf=…&grades=… opens those two files from this same site, exactly as if they had been
// picked in the two file dialogs (see examples/example.html, which is nothing but such a
// link). Paths are relative to *this* file, which sits at the root of the site — hence
// "examples/lot.pdf", not "lot.pdf". Anything off-origin is refused: a link must not be able
// to make someone's browser fetch a stranger's file.
async function fetchSameOrigin(path) {
  const url = new URL(path, location.href);
  if (url.origin !== location.origin) throw new Error("not part of this site: " + path);
  const res = await fetch(url.href);
  if (!res.ok) throw new Error(path + ": " + res.status + " " + res.statusText);
  return res.arrayBuffer();
}

// fetch needs http(s), so a page opened straight off the disk (file://) ends in the alert
// below. That costs the ordinary offline use nothing: with no parameters nothing is fetched.
(async function openFromQuery() {
  const q = new URLSearchParams(location.search);
  const grades = q.get("grades"), pdf = q.get("pdf");
  if (!grades && !pdf) return;
  try {
    // The save file first: renderPdf ends on the current student's recorded page, so the
    // PDF then opens on the first student's copy instead of page 1.
    if (grades) loadGradesWorkbook(await fetchSameOrigin(grades));
    if (pdf) await renderPdf(await fetchSameOrigin(pdf), pdf.split("/").pop());
  } catch (err) {
    alert("Could not open the linked files: " + (err && err.message ? err.message : err));
  }
})();
</script>
</body>
