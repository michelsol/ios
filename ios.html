// Escape a string for safe insertion into HTML text/attribute content.
function htmlEscape(s) {
  s = (s === null || s === undefined) ? "" : String(s);
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Build a standalone, print-ready HTML document: one bordered slip per student,
// language-agnostic (no labels), ready to print and cut apart. Reuses
// computeTotals() and fmt() so totals match the on-screen UI exactly.
function buildGradesHTML() {
  const slips = students.map(name => {
    const scheme = schemeFor(name);
    const total = computeTotals(name);
    const grades = gradesByStudent[name] || {};
    const comments = commentsByStudent[name] || {};
    const feedback = (feedbackByStudent[name] || "").trim();
    const groupTotals = computeGroupTotals(name);

    const qrow = (q) => {
      // A question that was never graded prints an en dash instead of a score, and counts
      // toward neither the group subtotal nor the slip total.
      const v = grades[qKey(q)];
      const graded = isGraded(v);
      const comment = (comments[qKey(q)] || "").trim();
      return (
        '<div class="qrow' + (graded ? '' : ' ungraded') + '">' +
          '<div class="qtitle">' + htmlEscape(q.title) + '</div>' +
          (comment ? '<div class="qcomment">' + htmlEscape(comment) + '</div>' : '') +
          '<div class="qpts">' + (graded ? htmlEscape(fmt(v)) : '&ndash;') + ' / ' + htmlEscape(fmt(q.max)) + '</div>' +
        '</div>'
      );
    };

    // Group by group, matching the on-screen list: each group gets a header row with
    // its subtotal. The default group ("") gets a blank-named header too, but only when
    // it sits alongside named groups; a plain ungrouped slip stays flat.
    const groupList = groupedScheme(scheme);
    const rows = groupList.map(grp => {
      let html = "";
      if (grp.group || groupList.length > 1) {
        const t = groupTotals[grp.group] || { sum: 0, max: 0 };
        // The default (empty-named) group prints its header bar but no subtotal points.
        const sub = grp.group
          ? '<div class="qgsub">' + htmlEscape(fmt(t.sum)) + ' / ' + htmlEscape(fmt(t.max)) + '</div>'
          : '';
        html += '<div class="qgroup">' +
                  '<div class="qgname">' + htmlEscape(grp.group) + '</div>' +
                  sub +
                '</div>';
      }
      return html + grp.questions.map(qrow).join("");
    }).join("");

    return (
      '<div class="slip">' +
        '<div class="head">' +
          '<div class="name">' + htmlEscape(name) + '</div>' +
          '<div class="total">' + htmlEscape(fmt(total.sum)) + ' / ' + htmlEscape(fmt(total.max)) + '</div>' +
        '</div>' +
        (feedback ? '<div class="feedback">' + htmlEscape(feedback) + '</div>' : '') +
        (rows ? '<div class="questions">' + rows + '</div>' : '') +
      '</div>'
    );
  }).join("");

  return (
'<!DOCTYPE html>\n' +
'<html lang="en">\n<head>\n<meta charset="UTF-8">\n' +
'<title>Grades</title>\n' +
'<style>\n' +
'  * { box-sizing: border-box; }\n' +
'  body {\n' +
'    margin: 24px;\n' +
'    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;\n' +
'    color: #1f2937;\n' +
'    background: #f4f5f7;\n' +
'  }\n' +
'  .sheet { column-count: 2; column-gap: 18px; }\n' +
'  .slip {\n' +
'    border: 1px solid #d7dbe0;\n' +
'    border-radius: 8px;\n' +
'    background: #fff;\n' +
'    padding: 12px 14px;\n' +
'    margin: 0 0 18px;\n' +
'    break-inside: avoid;\n' +
'    page-break-inside: avoid;\n' +
'  }\n' +
'  .head {\n' +
'    display: flex;\n' +
'    align-items: baseline;\n' +
'    justify-content: space-between;\n' +
'    gap: 16px;\n' +
'    border-bottom: 1px solid #eef0f3;\n' +
'    padding-bottom: 8px;\n' +
'  }\n' +
'  .name { font-size: 18px; font-weight: 700; }\n' +
'  .total { font-size: 18px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }\n' +
'  .feedback {\n' +
'    margin-top: 10px;\n' +
'    font-size: 14px;\n' +
'    font-style: italic;\n' +
'    color: #374151;\n' +
'    white-space: pre-wrap;\n' +
'  }\n' +
'  .questions { margin-top: 10px; }\n' +
'  .qrow {\n' +
'    display: flex;\n' +
'    align-items: baseline;\n' +
'    gap: 8px;\n' +
'    padding: 5px 0;\n' +
'    border-top: 1px solid #f3f4f6;\n' +
'  }\n' +
'  .qrow:first-child { border-top: 0; }\n' +
'  .qgroup {\n' +
'    display: flex;\n' +
'    align-items: baseline;\n' +
'    justify-content: space-between;\n' +
'    gap: 12px;\n' +
'    margin-top: 8px;\n' +
'    padding: 5px 0 3px;\n' +
'    border-top: 2px solid #d7dbe0;\n' +
'  }\n' +
'  .questions > .qgroup:first-child { border-top: 0; margin-top: 0; }\n' +
'  .qgname { font-weight: 700; font-size: 14px; }\n' +
'  .qgsub { font-size: 13px; font-weight: 700; color: #6b7280; white-space: nowrap; font-variant-numeric: tabular-nums; }\n' +
'  .qgroup + .qrow { border-top: 0; }\n' +
'  .qtitle { flex: 0 0 auto; font-weight: 600; font-size: 14px; }\n' +
'  .qcomment {\n' +
'    flex: 1 1 auto;\n' +
'    min-width: 0;\n' +
'    font-size: 13px;\n' +
'    color: #6b7280;\n' +
'    white-space: pre-wrap;\n' +
'  }\n' +
'  .qpts { flex: 0 0 auto; margin-left: auto; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }\n' +
'  .qrow.ungraded .qpts { color: #9ca3af; }\n' +
'  @media print {\n' +
'    body { margin: 0; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n' +
'    @page { margin: 12mm; }\n' +
'  }\n' +
'</style>\n</head>\n<body>\n' +
'<div class="sheet">' + slips + '</div>' +
'\n</body>\n</html>\n'
  );
}

function readFile(input, asArrayBuffer, callback) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => callback(reader.result, file.name);
  if (asArrayBuffer) reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
  input.value = ""; // allow re-importing the same file
}

// Select a score the instant the mouse is pressed (no waiting for the synthesized

let pressedOption = null;      // the option whose press we already applied (see below)
questionsEl.addEventListener("pointerdown", e => {
  const opt = e.target.closest(".opt");
  if (!opt) return;            // ignore presses on the scrollbar / gaps
  if (e.button !== undefined && e.button !== 0) return; // left button only
  const input = opt.querySelector("input");
  e.preventDefault();          // skip the browser's click synthesis/delay
  pressedOption = opt;
  // Nothing has toggled the radio yet, so its state is still the previous one: pressing
  // the option already selected can be read as "clear this grade".
  selectOption(input, true);
});

// Middle-click inside the question list or the student bar steps to the next student.
// Preventing the default on mousedown is what suppresses the browser's autoscroll, so the
// press is swallowed even when there is no next student to go to (see moveStudent).
function nextStudentOnMiddleClick(e) {
  if (e.button !== 1) return;
  e.preventDefault();
  moveStudent(1);
}
questionsEl.addEventListener("mousedown", nextStudentOnMiddleClick);
document.getElementById("studentBar").addEventListener("mousedown", nextStudentOnMiddleClick);

// Canceling pointerdown suppresses the compatibility mouse events but not the click that
// follows, and that click's activation behaviour would re-check the radio we just cleared
// (and fire "change"). Swallow exactly the click belonging to a press we already applied.
// Keyboard activation (Space) arrives with no preceding pointerdown, so it still works.
questionsEl.addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (!opt) return;
  if (opt === pressedOption) e.preventDefault();
  pressedOption = null;
}, true);

// Remove or reorder a question/group via its row buttons (delegated so it covers re-renders).
questionsEl.addEventListener("click", e => {
  const grm = e.target.closest(".qgremove"); // group remove — check first (also carries .qremove)
  if (grm) { removeGroup(grm.dataset.group); return; }
  const rm = e.target.closest(".qremove");
  if (rm) { removeQuestion(rm.dataset.key); return; }
  const gmv = e.target.closest(".qgmove"); // group move — check first (also carries .qmove)
  if (gmv) { if (!gmv.disabled) moveGroup(gmv.dataset.group, gmv.dataset.dir); return; }
  const mv = e.target.closest(".qmove");
  if (mv && !mv.disabled) moveQuestion(mv.dataset.key, mv.dataset.dir);
});

// Add-question inline form.
document.getElementById("aqAdd").addEventListener("click", addQuestion);
["aqGroup", "aqTitle", "aqScores"].forEach(id => {
  document.getElementById(id).addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); addQuestion(); }
  });
});

// Group picker: an editable combobox (reusing the shared popup) listing the groups
// currently in use; choosing one fills the box, typing a new name creates it on add.
const aqGroup = document.getElementById("aqGroup");
const aqGroupArrow = document.getElementById("aqGroupArrow");
aqGroup._comboItems = () => questionGroups;
aqGroup._comboSelect = (name) => { aqGroup.value = name; };
aqGroup.addEventListener("focus", () => openCombo(aqGroup));
aqGroupArrow.addEventListener("mousedown", e => {
  e.preventDefault(); // keep focus where it is
  (activeComboInput === aqGroup && comboPopup.classList.contains("open"))
    ? closeCombo() : openCombo(aqGroup);
});

// Close the comment popup on outside click, Escape, grading-list scroll, or resize.
document.addEventListener("pointerdown", e => {
  if (!comboPopup.classList.contains("open")) return;
  if (comboPopup.contains(e.target)) return;
  if (e.target.closest && e.target.closest(".combo")) return; // input/arrow handle themselves
  closeCombo();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && comboPopup.classList.contains("open")) closeCombo();
});
questionsEl.addEventListener("scroll", () => { if (comboPopup.classList.contains("open")) closeCombo(); });
window.addEventListener("resize", () => { if (comboPopup.classList.contains("open")) closeCombo(); });

btnSavePdf.addEventListener("click", savePdf);
btnRotatePage.addEventListener("click", rotateCurrentPage);

// Page navigation: typing a page number (or using the spinner) jumps there.
pageInput.addEventListener("change", () => goToPage(parseInt(pageInput.value, 10) || 1));

// Keep the page number in sync as the PDF is scrolled.
let pageSyncRaf = null;
pdfPane.addEventListener("scroll", () => {
  if (pageSyncRaf) return;
  pageSyncRaf = requestAnimationFrame(() => {
    pageSyncRaf = null;
    if (pageCanvases.length === 0) return;
    const n = currentVisiblePage();
    if (parseInt(pageInput.value, 10) !== n) pageInput.value = n;
  });
});

// Mouse wheel always scrolls the PDF, from anywhere on the page (including over
// the grading area). The grading list can still be scrolled by dragging its scrollbar.
window.addEventListener("wheel", e => {
  if (!onlyScrollPdf.checked) return; // let the hovered area scroll natively
  if (pdfPane.scrollHeight <= pdfPane.clientHeight) return; // nothing to scroll
  pdfPane.scrollTop += e.deltaY;
  e.preventDefault();
}, { passive: false });

// Drag the divider to reallocate horizontal space between the PDF and grading panes.
// Pointer capture keeps the drag tracking even when the cursor is over the PDF canvas.
const appEl = document.getElementById("app");
const leftPane = document.getElementById("left");
const divider = document.getElementById("divider");
let draggingSplit = false;
divider.addEventListener("pointerdown", e => {
  draggingSplit = true;
  divider.setPointerCapture(e.pointerId);
  document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none";
  e.preventDefault();
});
divider.addEventListener("pointermove", e => {
  if (!draggingSplit) return;
  const rect = appEl.getBoundingClientRect();
  const w = e.clientX - rect.left;
  const min = rect.width * 0.2, max = rect.width * 0.8;
  leftPane.style.width = Math.min(max, Math.max(min, w)) + "px";
});
const endDrag = e => {
  if (!draggingSplit) return;
  draggingSplit = false;
  try { divider.releasePointerCapture(e.pointerId); } catch (_) {}
  document.body.style.cursor = "";
  document.body.style.userSelect = "";
};
divider.addEventListener("pointerup", endDrag);
divider.addEventListener("pointercancel", endDrag);

updateNavButtons();
</script>
</body>
</html>
