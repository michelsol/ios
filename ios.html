  const totals = {};
  for (const q of schemeFor(name)) {
    const g = q.group || "";
    const t = totals[g] || (totals[g] = { sum: 0, max: 0 });
    const v = grades[qKey(q)];
    if (!isGraded(v)) continue;
    t.sum += v;
    if (!isNaN(q.max)) t.max += q.max;
  }
  return totals;
}

// Refresh the on-screen subtotal of every named group from the current student's grades.
function recomputeSubtotals() {
  const totals = computeGroupTotals(currentStudent);
  questionsEl.querySelectorAll(".qgroup-sub").forEach(span => {
    const t = totals[span.dataset.group] || { sum: 0, max: 0 };
    span.textContent = fmt(t.sum) + " / " + fmt(t.max);
  });
}

// Repaint the bottom bar. Both halves move as grading proceeds (the max only counts
// graded questions), so this runs on every grade change, not just on re-render.
function recomputeTotal() {
  const t = computeTotals(currentStudent);
  totalValueEl.textContent = fmt(t.sum);
  totalMaxEl.textContent = " / " + fmt(t.max);
  showStudentScore();
}

// =====================================================================
// Students & per-student state
// =====================================================================

// Switch the displayed student: persist the current one, repoint the scheme alias
// at the target's questions, and re-render (each student can have a different set
// of questions, so the question DOM must be rebuilt, not just re-applied).
function switchToStudent(name) {
  saveCurrentStudent();
  editingKey = null;          // an open edit row belongs to the student it was opened on
  editingDraft = null;
  currentStudent = name || "";
  schemeQuestions = schemeFor(currentStudent);
  renderQuestions();          // its tail calls loadStudent() to apply stored values
  updateNavButtons();
}

// A deep copy of a scheme array, so a new student's questions are independent.
function cloneScheme(scheme) {
  return scheme.map(q => ({ title: q.title, max: q.max, scores: q.scores.slice(),
                            split: q.split, group: q.group || "" }));
}

// Add a single student by name (the name typed in the student box, on Enter or from the
// page button, which also sets their page). New students inherit a copy
// of the currently selected student's questions (the draft when none).
function addStudent() {
  const name = (studentSelect.value || "").trim();
  if (!name) return;
  if (students.indexOf(name) >= 0) {
    switchToStudent(name);
    return;
  }
  saveCurrentStudent();
  const scheme = cloneScheme(schemeFor(currentStudent));
  students.push(name);
  schemeByStudent[name] = scheme;
  gradesByStudent[name] = {};   // every question starts ungraded
  commentsByStudent[name] = {};
  feedbackByStudent[name] = "";
  const group = studentGroupInput.value.trim();  // the group box's value (often the previous student's)
  if (group) groupByStudent[name] = group;
  studentSelect.value = name;
  switchToStudent(name);
}

// Add several students at once (a column pasted from a spreadsheet). Like addStudent,
// each inherits a copy of the current student's questions and the group box's value,
// but none gets a position. Names already in the list are skipped. The selection
// stays on the current student (the first new one when the list was empty).
function addStudents(names) {
  saveCurrentStudent();
  const scheme = schemeFor(currentStudent);
  const group = studentGroupInput.value.trim();
  const added = [];
  for (const name of names) {
    if (students.indexOf(name) >= 0) continue;   // also dedupes within the paste
    students.push(name);
    schemeByStudent[name] = cloneScheme(scheme);
    gradesByStudent[name] = {};
    commentsByStudent[name] = {};
    feedbackByStudent[name] = "";
    if (group) groupByStudent[name] = group;
    added.push(name);
  }
  switchToStudent(currentStudent || added[0] || "");
  studentSelect.value = currentStudent;        // drop the pasted text from the box
  if (activeComboInput === studentSelect && comboPopup.classList.contains("open")) openCombo(studentSelect);
}

// Remove the currently selected student (from the "−" button).
function removeStudent() {
  if (!currentStudent || students.length === 0) {
    alert("No student selected to remove.");
    return;
  }
  if (!confirm('Remove student "' + currentStudent + '" and their grades?')) return;
  const idx = students.indexOf(currentStudent);
  delete schemeByStudent[currentStudent];
  delete gradesByStudent[currentStudent];
  delete commentsByStudent[currentStudent];
  delete feedbackByStudent[currentStudent];
  delete scrollPosByStudent[currentStudent];
  delete groupByStudent[currentStudent];
  students.splice(idx, 1);
  recomputeGroups();          // a group only this student used is now gone
  if (students.length === 0) {
    schemeQuestions = [];     // fresh empty draft
    studentSelect.value = "";
    switchToStudent("");
    return;
  }
  studentSelect.value = students[Math.min(idx, students.length - 1)];
  switchToStudent(studentSelect.value);
}

// Zoom the grading panel in/out (CSS zoom on the questions container).
let gradeZoom = 1.0;
function zoomGrade(factor) {
  gradeZoom = Math.min(2, Math.max(0.5, gradeZoom * factor));
  questionsEl.style.zoom = gradeZoom;
}

// Read an .ods save file, collect its sheets by name (as arrays of rows),
// then hand them to loadWorkbook.
function loadGradesWorkbook(buf) {
  if (!window.XLSX) {
    alert("Spreadsheet library failed to load. Check your internet connection (SheetJS is loaded from a CDN).");
    return;
  }
  let wb;
  try {
    wb = XLSX.read(buf, { type: "array" });
  } catch (err) {
    alert("Could not read this file as an .ods spreadsheet: " + (err && err.message ? err.message : err));
    return;
  }
  // Look sheets up by a normalized name (ignore spaces/underscores and case).
  // Excel rewrites multi-word ODS table names with underscores on save
  // (e.g. "Student groups" -> "Student_groups"), so an exact match would miss them.
  const norm = n => String(n).toLowerCase().replace(/[\s_]+/g, "");
  const sheet = (name) => {
    const key = norm(name);
    const found = wb.SheetNames.find(n => norm(n) === key);
    const ws = found ? wb.Sheets[found] : null;
    return ws ? XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" }) : [];
  };
  loadWorkbook({
    positions:     sheet("Positions"),        // the student list and their PDF positions
    feedback:     sheet("Feedback"),
    studentGroups: sheet("Student_groups"),   // absent in older files -> no groups
    gradingScheme: sheet("Grading_Scheme"),
    grades:        sheet("Grades"),
    comments:      sheet("Comments"),
  });
}

// Rebuild all state from the save sheets (see buildWorkbook for the layout).
// `s` holds each sheet as an array of cell-arrays. Replaces all current state.
function loadWorkbook(s) {
  const gs = parseAlternating(s.gradingScheme);
  const gr = parseAlternating(s.grades);
  const cm = parseAlternating(s.comments);

  // Replace all state.
  students = [];
  schemeByStudent = {};
  schemeQuestions = [];
  gradesByStudent = {};
  commentsByStudent = {};
  feedbackByStudent = {};
  scrollPosByStudent = {};
  groupByStudent = {};
  commentBank.length = 0;
  commentBankSet.clear();

  const posMap = twoColMap(s.positions);
  const fbMap = twoColMap(s.feedback);
  const grpMap = twoColMap(s.studentGroups);

  // Build one student's scheme from the Grading_Scheme headers (falling back to Grades):
  // each header is a question key that splits into group/title (a header without the
  // separator is a default-group question); a question's score options come from its
  // score-list cell, falling back to the distinct grades observed for it, then [0].
  // `_h` carries the raw header so grades/comments can be read by it below.
  const buildScheme = (name) => {
    const headers = (gs.titlesByName[name] && gs.titlesByName[name].length)
      ? gs.titlesByName[name]
      : (gr.titlesByName[name] || []);
    const scoreVals = gs.valuesByName[name] || {};
    const gradeVals = gr.valuesByName[name] || {};
    return headers.map(h => {
      const { group: g0, title } = splitHeader(h);
      const group = g0 == null ? "" : g0;
      // The stored list may carry a "|" (see parseScoreSpec); the fallbacks can't, so
      // those questions come back with a button per score, as they were written.
      let { scores, split } = parseScoreSpec(scoreVals[h]);
      if (scores.length === 0) { scores = parseScoreList(gradeVals[h]); split = scores.length; }
      if (scores.length === 0) { scores = [0]; split = 1; }
      return { title, max: Math.max(...scores), scores, split, group, _h: h };
    });
  };

  // Student order/list comes from the Positions sheet; include any extra students
  // that only appear in the data sheets (so nothing silently drops).
  const names = [];
  for (const row of s.positions) {
    const name = cell(row, 0);
    if (name && names.indexOf(name) < 0) names.push(name);
  }
  for (const name of [...gs.order, ...gr.order, ...cm.order])
    if (names.indexOf(name) < 0) names.push(name);

  for (const name of names) {
    students.push(name);
    const scheme = schemeByStudent[name] = buildScheme(name);
    const grades = gradesByStudent[name] = {};
    const comments = commentsByStudent[name] = {};
    feedbackByStudent[name] = fbMap[name] || "";
    const pos = parseFloat(posMap[name]);
    if (pos >= 1) scrollPosByStudent[name] = pos;
    if (grpMap[name]) groupByStudent[name] = grpMap[name];
    const gradeVals = gr.valuesByName[name] || {};
    const commentVals = cm.valuesByName[name] || {};
    for (const q of scheme) {
      // Read by the raw stored header, but store under the canonical key (migrates
      // legacy title-keyed values onto group+title keys).
      const raw = gradeVals[q._h];
      if (raw != null && raw !== "") { const v = toNum(raw); if (!isNaN(v)) grades[qKey(q)] = v; }
      const c = commentVals[q._h];
      if (c) comments[qKey(q)] = c;
      delete q._h;
    }
  }

  recomputeGroups();
  editingKey = null;          // nothing from the previous file stays open
  editingDraft = null;
  currentStudent = students.length ? students[0] : "";
  schemeQuestions = schemeFor(currentStudent);
  studentSelect.value = currentStudent;
  renderQuestions();          // its tail calls loadStudent() to apply values
  updateNavButtons();
}

// Save the comments (and any half-typed score) currently shown into the current student's
// state. Grades are stored the moment they are set, so only a score box the user typed in
// and has not left yet can still be missing; a box holding no number is left alone rather
// than clearing the grade, since clearing is always explicit (see setGrade).
function saveCurrentStudent() {
  if (!currentStudent || !gradesByStudent[currentStudent]) return;
  const grades = gradesByStudent[currentStudent];
  questionsEl.querySelectorAll(".qscorebox").forEach(box => {
    const text = box.value.trim();
    if (text === "") return;
    const n = toNum(text);
    if (!isNaN(n)) grades[box.dataset.key] = n;
  });
  const comments = commentsByStudent[currentStudent] || (commentsByStudent[currentStudent] = {});
  // ".question .qcomment", not ".qcomment": the feedback box sits in the list too (in
  // #totalBar) and carries the same class, but it is saved on its own line below.
  questionsEl.querySelectorAll(".question .qcomment").forEach(input => {
    comments[input.dataset.key] = input.value.trim();
  });
  feedbackByStudent[currentStudent] = globalFeedback.value;
  recordPositionIfOn();  // while recording: remember where the PDF was left for this student
}

// Apply a student's stored selections to the radios and update the total.
function loadStudent(name) {
  currentStudent = name || "";
  if (currentStudent) {
    studentSelect.value = currentStudent;
    // Only with a student: an empty list keeps what was typed, for the next "+".
    studentGroupInput.value = groupByStudent[currentStudent] || "";
  }

  globalFeedback.value = (currentStudent && feedbackByStudent[currentStudent]) || "";
  const comments = (currentStudent && commentsByStudent[currentStudent]) || {};
  for (const q of schemeQuestions) {
    const cinput = questionsEl.querySelector('.qcomment[data-key="' + cssEscape(qKey(q)) + '"]');
    if (cinput) cinput.value = comments[qKey(q)] || "";
  }
  renderGrades();          // the keys, the score boxes and the row colours, from the grades
  refreshStudentStatus();
  refreshProgress();     // also covers add/remove of a student or question, and .ods loads
  recomputeTotal();
  recomputeSubtotals();

  // Bring the PDF back to this student's position. Mid-render the page offsets aren't
  // final, so the render scrolls there once it is done. A student with no position yet
  // leaves the PDF in place (the page button gives them one).
  const target = currentStudent ? scrollPosByStudent[currentStudent] : null;
  if (target >= 1) {
    if (pdfRendering) pendingPdfPos = target;
    else scrollPdfTo(target);
  }
  showStudentPage();
  refreshPositionButton();
}

// Step to another student, wrapping around at both ends (past the last is the first). A
// move that would land on the student already shown (a single student) does nothing at
// all — the ▲/▼ buttons are disabled then, but the middle-click shortcut is not, and
// re-selecting would re-render and re-jump the PDF.
function moveStudent(delta) {
  if (students.length === 0) return;
  const idx = students.indexOf(currentStudent);
  if (idx < 0) { switchToStudent(students[0]); return; }  // nothing selected -> the first
  const next = ((idx + delta) % students.length + students.length) % students.length;
  if (students[next] === currentStudent) return;
  switchToStudent(students[next]);
}

// ---- Reordering the student list (from the student popup's toolbar) ----
// Every per-student map is keyed by name, so reordering only touches `students`; the
// current student stays selected, and saves/exports follow the new order.

// Move the current student one position up (-1) or down (+1) in the list.
function moveCurrentStudent(delta) {
  const i = students.indexOf(currentStudent);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= students.length) return;
  students[i] = students[j];
  students[j] = currentStudent;
  updateNavButtons();
}

// Compare two names ignoring case/accents; `numeric` puts "e2" before "e10".
function compareNames(a, b) {
  return a.localeCompare(b, undefined, { sensitivity: "base", numeric: true });
}

// Sort by name.
function sortStudents() {
  if (students.length < 2) return;
  students.sort(compareNames);
  updateNavButtons();
}

// Distinct student groups, in order of first appearance in the list ("" = no group, never listed).
function studentGroups() {
  const seen = [];
  for (const n of students) {
    const g = groupByStudent[n];
    if (g && seen.indexOf(g) < 0) seen.push(g);
  }
  return seen;
}

// Gather students by group: groups in alphabetical order, students without a group last.
// Array sort is stable, so the order inside each group is kept (students aren't sorted).
function sortStudentsByGroup() {
  if (students.length < 2) return;
  students.sort((a, b) => {
    const ga = groupByStudent[a] || "", gb = groupByStudent[b] || "";
    if (!ga || !gb) return (ga ? 0 : 1) - (gb ? 0 : 1);   // no group sorts last
    return compareNames(ga, gb);
  });
  updateNavButtons();
}

// Order students as they appear in the PDF: by position, students without one last.
// Array sort is stable, so ties and position-less students keep their current order.
function sortStudentsByPosition() {
  if (students.length < 2) return;
  const page = n => scrollPosByStudent[n] >= 1 ? scrollPosByStudent[n] : Infinity;
  students.sort((a, b) => {
    const pa = page(a), pb = page(b);
    return pa === pb ? 0 : pa - pb;   // not a plain difference: Infinity - Infinity is NaN
  });
  updateNavButtons();
}

// Store the group box's value as the current student's group. Skipped while the name box
// holds a different (new) name: the group box is then preparing the group for "+".
function assignStudentGroup() {
  if (!currentStudent || studentSelect.value.trim() !== currentStudent) return;
  const g = studentGroupInput.value.trim();
  if (g) groupByStudent[currentStudent] = g;
  else delete groupByStudent[currentStudent];
}

// Shuffle into a random order (Fisher–Yates).
function shuffleStudents() {
  if (students.length < 2) return;
  for (let i = students.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = students[i];
    students[i] = students[j];
    students[j] = tmp;
  }
  updateNavButtons();
}

// Build the student popup's toolbar: move current up/down, remove current, sort A–Z, shuffle, sort by group,
// sort by position in the PDF.
function buildStudentToolbar() {
  const bar = document.createElement("div");
  bar.className = "combo-toolbar";
  const idx = students.indexOf(currentStudent);
  const add = (btn, title, disabled, action, reopen = true) => {
    btn.type = "button";
    btn.title = title;
    btn.disabled = disabled;
    btn.addEventListener("mousedown", e => {
      e.preventDefault();              // keep focus in the input so the popup stays open
      if (btn.disabled) return;
      action();
      if (reopen) openCombo(studentSelect);  // redraw the list (and this toolbar) in the new order
    });
    bar.appendChild(btn);
  };
  const move = (dir) => {
    const btn = document.createElement("button");
    btn.className = "qmove";
    btn.dataset.dir = dir;
    return btn;
  };
  const tool = (html) => {
    const btn = document.createElement("button");
    btn.className = "combo-tool";
    btn.innerHTML = html;
    return btn;
  };
  add(move("up"),   "Move current student up",   idx <= 0,                    () => moveCurrentStudent(-1));
  add(move("down"), "Move current student down", idx < 0 || idx >= students.length - 1, () => moveCurrentStudent(1));
  const del = tool("&#8722;");
  del.classList.add("del");
  // Close the list first, so it doesn't linger behind the confirm dialog.
  add(del, "Remove current student", idx < 0, () => { closeCombo(); removeStudent(); }, false);
  add(tool("A–Z"),  "Sort students alphabetically", students.length < 2, sortStudents);
  add(tool('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
           '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>' +
           '<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>'),
      "Shuffle students into a random order", students.length < 2, shuffleStudents);
  add(tool('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
           '<circle cx="9" cy="7" r="4"/><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>' +
           '<path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'),
      "Sort students by group", students.length < 2, sortStudentsByGroup);
  add(tool(pageIcon()), "Sort students by position in the PDF", students.length < 2, sortStudentsByPosition);
  return bar;
}

// Stepping wraps around (see moveStudent), so ▲/▼ are only disabled with nowhere else to go.
function updateNavButtons() {
  const none = students.length < 2;
  document.getElementById("btnPrev").disabled = none;
  document.getElementById("btnNext").disabled = none;
}

// Minimal CSS.escape fallback for use in attribute selectors.
function cssEscape(s) {
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/["\\\]\[#.:>+~*^$|()'`= ]/g, "\\$&");
}

// =====================================================================
// PDF rendering
// =====================================================================

let pageCanvases = [];      // one canvas element per rendered page
let currentPdfDoc = null;   // the loaded PDF.js document
let pdfZoom = 1.0;          // user zoom multiplier
const PDF_BASE_SCALE = 1.5; // scale at 100%
let renderToken = 0;        // guards against overlapping re-renders
let pdfRendering = false;   // a drawPages is in flight: page offsets aren't final yet
let pendingPdfPos = 1;      // where that render scrolls once done (see scrollPdfTo)
let pdfBytes = null;        // the original file (Uint8Array), rewritten by savePdf
let pdfFileName = "";       // the opened file's name, reused when saving
let pageRotation = {};      // { original 1-based page: extra clockwise degrees (0/90/180/270) }

async function renderPdf(arrayBuffer, name) {
  if (!window.pdfjsLib) {
    alert("PDF library failed to load. Check your internet connection (PDF.js is loaded from a CDN).");
    return;
  }
  // Keep a copy for saving: pdf.js transfers (detaches) the buffer it is given.
  pdfBytes = new Uint8Array(arrayBuffer.slice(0));
  pdfFileName = name || "document.pdf";
  pageRotation = {};
  try {
    currentPdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    pdfZoom = 1.0;
    pageCanvases = [];          // a new file starts in its natural page order (see drawPages)
    // e.g. after an .ods load: the current student's saved spot
    await drawPages((currentStudent && scrollPosByStudent[currentStudent]) || 1);
  } catch (err) {
    pdfRendering = false;
    currentPdfDoc = null;
    pdfBytes = null;
    pageCanvases = [];
    pdfPane.innerHTML = "";
    pageInput.disabled = true;
    btnPagePrev.disabled = true;
    btnPageNext.disabled = true;
    btnSavePdf.disabled = true;
    btnRotatePage.disabled = true;
    btnDeletePage.disabled = true;
    refreshPositionButton();      // no PDF: nothing to set or record
    btnPageUp.disabled = true;
    btnPageDown.disabled = true;
    pageInput.value = 1;
    pageCountEl.textContent = "/ 0";
    document.getElementById("pdfZoomLabel").textContent = "100%";
    const msg = document.createElement("div");
    msg.id = "pdfEmpty";
    msg.textContent = "Could not render this PDF: " + (err && err.message ? err.message : err);
    pdfPane.appendChild(msg);
  }
}

// Render all pages of the current document at the current zoom, then scroll to
// targetPos (a pdfScrollPos position; selecting a student meanwhile retargets it).
// Re-entrant: a newer call cancels an in-flight one via renderToken.
// Each canvas carries its original page number (dataset.page), so `pageCanvases` is also
// the page order (see movePage); a re-render (zoom) keeps that order.
async function drawPages(targetPos) {
  if (!currentPdfDoc) return;
  const token = ++renderToken;
  pdfRendering = true;
  pendingPdfPos = targetPos || 1;
  const order = pageCanvases.length
    ? pageCanvases.map(c => +c.dataset.page)
    : Array.from({ length: currentPdfDoc.numPages }, (_, i) => i + 1);
  // Create every canvas up front, so `pageCanvases` is complete (and the order readable)
  // even while the pages below are still rendering.
  pdfPane.innerHTML = "";
  pageCanvases = order.map(n => {
    const canvas = document.createElement("canvas");
    canvas.dataset.page = n;
    pdfPane.appendChild(canvas);
    return canvas;
  });
  const scale = PDF_BASE_SCALE * pdfZoom;
  for (const canvas of pageCanvases.slice()) {   // a copy: a move mid-render can't skip a page
    const page = await currentPdfDoc.getPage(+canvas.dataset.page);
    if (token !== renderToken) return; // a newer render superseded this one
    await renderPageInto(canvas, page, scale);
    if (token !== renderToken) return;
  }
  pageInput.disabled = false;
  btnPagePrev.disabled = false;
  btnPageNext.disabled = false;
  btnSavePdf.disabled = false;
  btnRotatePage.disabled = false;
  btnDeletePage.disabled = pageCanvases.length < 2;   // the last page can't go
  btnPageUp.disabled = false;
  btnPageDown.disabled = false;
  pageCountEl.textContent = "/ " + pageCanvases.length;   // the pages shown (some may be deleted)
  document.getElementById("pdfZoomLabel").textContent = Math.round(pdfZoom * 100) + "%";
  pdfRendering = false;
  scrollPdfTo(pendingPdfPos);
  showStudentPage();
  refreshPositionButton();
}

// Size `canvas` for one PDF.js page and render it, applying the page's own rotation plus
// any extra rotation the user added (pageRotation).
async function renderPageInto(canvas, page, scale) {
  const rotation = (page.rotate + (pageRotation[page.pageNumber] || 0)) % 360;
  const viewport = page.getViewport({ scale, rotation });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
}

// Rotate the page in view 90° clockwise, re-rendering only that page. It is then
// scrolled to the top, since its height (and so the layout below it) may have changed.
async function rotateCurrentPage() {
  if (!currentPdfDoc || pageCanvases.length === 0) return;
  const n = currentVisiblePage();
  const canvas = pageCanvases[n - 1];
  if (!canvas) return;
  const orig = +canvas.dataset.page;   // rotations are keyed by original page number
  pageRotation[orig] = ((pageRotation[orig] || 0) + 90) % 360;
  const page = await currentPdfDoc.getPage(orig);
  await renderPageInto(canvas, page, PDF_BASE_SCALE * pdfZoom);
  goToPage(n);
}

// Swap the page in view with the previous (-1) or next (+1) one. Only the canvases move
// (no re-render); student positions are places in the displayed PDF and are deliberately
// left as-is.
function movePage(delta) {
  const n = currentVisiblePage();
  const m = n + delta;
  if (pageCanvases.length === 0 || m < 1 || m > pageCanvases.length) return;
  const tmp = pageCanvases[n - 1];
  pageCanvases[n - 1] = pageCanvases[m - 1];
  pageCanvases[m - 1] = tmp;
  const i = Math.min(n, m) - 1;        // put the (new) earlier canvas back before the later one
  pdfPane.insertBefore(pageCanvases[i], pageCanvases[i + 1]);
  goToPage(m);
}

// Delete the page in view (after confirming; only reopening the PDF brings it back). Only
// its canvas goes (no re-render), so savePdf and later re-renders simply leave it out.
// Unlike a move, student positions shift so each still points at the same work: later
// pages move up one, and a position on the deleted page goes to the top of the page that
// takes its place.
function deleteCurrentPage() {
  if (!currentPdfDoc || pdfRendering || pageCanvases.length < 2) return;
  const n = currentVisiblePage();
  if (!confirm("Delete page " + n + " from the PDF?")) return;
  const [canvas] = pageCanvases.splice(n - 1, 1);
  canvas.remove();
  const count = pageCanvases.length;
  for (const name of Object.keys(scrollPosByStudent)) {
    let pos = scrollPosByStudent[name];
    if (!(pos >= 1)) continue;
    if (pos >= n + 1) pos -= 1;
    else if (pos >= n) pos = n;
    if (pos >= count + 1) pos = count;   // the deleted page was the last: top of the new last
    scrollPosByStudent[name] = pos;
  }
  pageCountEl.textContent = "/ " + count;
  btnDeletePage.disabled = count < 2;
  goToPage(Math.min(n, count));
  showStudentPage();
  refreshPositionButton();
}

// Download the PDF with the user's rotations, page order and deletions applied. pdf-lib only rewrites
// each page's /Rotate entry and the page list, so the page contents are kept as-is (no
// re-rendering, no quality loss).
async function savePdf() {
  if (!pdfBytes) {
    alert("No PDF loaded.");
    return;
  }
  if (!window.PDFLib) {
    alert("PDF writing library failed to load. Check your internet connection (pdf-lib is loaded from a CDN).");
    return;
  }
  try {
    const doc = await PDFLib.PDFDocument.load(pdfBytes, { ignoreEncryption: true });
    const pages = doc.getPages();
    for (const [n, extra] of Object.entries(pageRotation)) {
      const p = pages[n - 1];
      if (!p || !extra) continue;
      p.setRotation(PDFLib.degrees(((p.getRotation().angle + extra) % 360 + 360) % 360));
    }
    // Then the pages shown, in their order on screen (each canvas holds its original page
    // number; deleted pages have no canvas, so they're left out).
    const order = pageCanvases.map(c => +c.dataset.page);
    if (order.length !== pages.length || order.some((n, i) => n !== i + 1)) {
      for (let i = pages.length - 1; i >= 0; i--) doc.removePage(i);
      for (const n of order) doc.addPage(pages[n - 1]);
    }
    downloadFile(pdfFileName, await doc.save(), "application/pdf");
  } catch (err) {
    alert("Could not save the PDF: " + (err && err.message ? err.message : err));
  }
}

function zoomPdf(factor) {
  if (!currentPdfDoc) return;
  // Keep the exact spot (or, mid-render, the spot that render was heading for).
  const keepPos = pdfRendering ? pendingPdfPos : pdfScrollPos();
  pdfZoom = Math.min(3, Math.max(0.4, pdfZoom * factor));
  drawPages(keepPos);
}

// Scroll so the given 1-based page sits at the top of the PDF pane.
function goToPage(n) {
  if (pageCanvases.length === 0) return;
  n = Math.min(pageCanvases.length, Math.max(1, n));
  const canvas = pageCanvases[n - 1];
  pdfPane.scrollTop = canvas.offsetTop - pdfPane.offsetTop;
  showPdfPosition();
}

// Top of the i-th (0-based) page canvas, in the PDF pane's scroll coordinates.
function pageTop(i) {
  return pageCanvases[i].offsetTop - pdfPane.offsetTop;
}

// Distance from the i-th page's top to the next one's (so the gap between pages counts);
// the last page uses its own height.
function pagePitch(i) {
  return (i + 1 < pageCanvases.length ? pageTop(i + 1) : pageTop(i) + pageCanvases[i].offsetHeight) - pageTop(i);
}

// The exact scroll position as a fractional page number: 3.25 means the top of the pane
// sits a quarter of the way from page 3's top to page 4's. Unlike pixels, it survives zoom
// and window resizes. null when no PDF is shown.
function pdfScrollPos() {
  if (pageCanvases.length === 0) return null;
  const y = pdfPane.scrollTop;
  let i = 0;
  while (i + 1 < pageCanvases.length && pageTop(i + 1) <= y) i++;
  const pitch = pagePitch(i);
  const frac = pitch > 0 ? Math.min(0.9999, Math.max(0, (y - pageTop(i)) / pitch)) : 0;
  return Math.round((i + 1 + frac) * 10000) / 10000;
}

// Scroll to a position from pdfScrollPos (a whole number is the top of that page).
function scrollPdfTo(pos) {
  if (pageCanvases.length === 0) return;
  pos = Math.min(pageCanvases.length + 0.9999, Math.max(1, pos));
  const i = Math.floor(pos) - 1;
  pdfPane.scrollTop = pageTop(i) + (pos - i - 1) * pagePitch(i);
  showPdfPosition();
}

// A position as shown in the page selector: 2 decimals at most.
function roundPos(pos) {
  return Math.round(pos * 100) / 100;
}

// Show the exact scroll position in the PDF bar's page selector (e.g. 3.47).
function showPdfPosition() {
  if (pageCanvases.length) pageInput.value = roundPos(pdfScrollPos());
}

// The page selector's ▲ (dir -1, up the PDF) / ▼ (+1) step a whole page. A fractional
// position first snaps to its page's top going back (3.47 -> 3), and to the next page's
// going forward (3.47 -> 4).
function stepPdfPage(dir) {
  if (!pageCanvases.length) return;
  const v = parseFloat(pageInput.value) || pdfScrollPos();
  const next = dir < 0 ? (Number.isInteger(v) ? v - 1 : Math.floor(v)) : Math.floor(v) + 1;
  scrollPdfTo(Math.max(1, Math.min(pageCanvases.length, next)));
}

// Positions are set and recorded with the page button (onSetPositionClick): a student with
// no page yet gets the whole page in view, once; for a student with one, it toggles
// recording, while which the position follows the PDF as it scrolls. Off, the PDF
// scrolls freely and no position changes.
function hasPage(name) {
  return scrollPosByStudent[name] >= 1;
}

// While recording: store where the PDF is as the current student's position. Skipped with
// no PDF, or mid-render, when the page offsets aren't final.
function recordPositionIfOn() {
  if (!recordingPosition || !pageCanvases.length || pdfRendering || !currentStudent) return;
  scrollPosByStudent[currentStudent] = pdfScrollPos();
}

// What a click on the page button would do, for the name in the student box:
//   "create" — a new name: create that student, on the page in view;
//   "set"    — the current student has no page yet: give them the page in view (once);
//   "toggle" — the current student has one: start/stop recording;
//   ""       — nothing (no PDF, mid-render, or an empty box).
function setPositionAction() {
  const name = studentSelect.value.trim();
  if (!name || !pageCanvases.length || pdfRendering) return "";
  if (students.indexOf(name) < 0) return "create";
  if (name !== currentStudent) return "";
  return hasPage(name) ? "toggle" : "set";
}

// The page button. Setting a page takes the whole page in view (no jump: it's already in
// view) and never turns recording on; turning recording on stores the exact spot at once.
function onSetPositionClick() {
  const action = setPositionAction();
  if (action === "create") {
    addStudent();                                   // switches to the new student
    scrollPosByStudent[currentStudent] = currentVisiblePage();
  } else if (action === "set") {
    scrollPosByStudent[currentStudent] = currentVisiblePage();
  } else if (action === "toggle") {
    recordingPosition = !recordingPosition;
    recordPositionIfOn();
  } else {
    return;
  }
  showStudentPage();
  refreshPositionButton();
}

// A student's "no page yet" tag (a crossed-out page); null once they have a page. Used in
// the student list and in the student box.
function studentPageTag(name) {
  return hasPage(name) ? null : { html: pageIcon(true), title: "no page yet", cls: "unset" };
}

// Show the "no page yet" tag in the student box: for the current student without a page,
// and for a new name being typed (a student-to-be has no page). Nothing when empty.
function showStudentPage() {
  const name = studentSelect.value.trim();
  const isNew = name && students.indexOf(name) < 0;
  const tag = !name ? null : studentPageTag(isNew ? "" : name);   // "" never has a page
  studentPageTagEl.innerHTML = tag ? tag.html : "";
  studentPageTagEl.title = tag ? tag.title : "";
  studentPageTagEl.classList.toggle("unset", !!(tag && tag.cls));
}

// The score next to the name in the student bar: the same total / max over the graded
// questions that the total row and the student list show. Like the page tag above, it goes
// by the name in the box, so a half-typed new name doesn't wear the previous student's score.
function showStudentScore() {
  const name = studentSelect.value.trim();
  const known = students.indexOf(name) >= 0 ? name : "";
  const t = known && schemeFor(known).length ? computeTotals(known) : null;
  studentScoreTagEl.textContent = t ? fmt(t.sum) + " / " + fmt(t.max) : "";
}

// The page button's look: pressed while recording, amber when the next click sets a page,
// disabled when it can't do anything; its tooltip says what the next click does.
function refreshPositionButton() {
  const action = setPositionAction();
  if (!currentStudent || !hasPage(currentStudent)) recordingPosition = false;
  btnSetPosition.disabled = !action;
  btnSetPosition.classList.toggle("unset", action === "create" || action === "set");
  const on = recordingPosition && action === "toggle";
  btnSetPosition.classList.toggle("recording", on);
  btnSetPosition.setAttribute("aria-pressed", on ? "true" : "false");
  btnSetPosition.title =
    action === "create" ? "Create " + studentSelect.value.trim() + " and set their page to the page in view" :
    action === "set"    ? "Set this student's page to the page in view" :
    on                  ? "Stop recording this student's position" :
    action === "toggle" ? "Record this student's position while scrolling" :
                          "Set a student's page (open a PDF first)";
}

// A page icon (SVG markup), optionally crossed out.
function pageIcon(crossed) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
         'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
         '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
         '<polyline points="14 2 14 8 20 8"/>' +
         (crossed ? '<line x1="3" y1="3" x2="21" y2="21"/>' : "") + '</svg>';
}

// Work out which page is currently most in view (from scroll position).
function currentVisiblePage() {
  if (pageCanvases.length === 0) return 1;
  const mid = pdfPane.scrollTop + pdfPane.clientHeight / 2;
  for (let i = 0; i < pageCanvases.length; i++) {
    const top = pageCanvases[i].offsetTop - pdfPane.offsetTop;
    const bottom = top + pageCanvases[i].offsetHeight;
    if (mid >= top && mid < bottom) return i + 1;
  }
  return pdfPane.scrollTop <= 0 ? 1 : pageCanvases.length;
}

// =====================================================================
// Save grades
// =====================================================================

// Build the save sheets, each as { name, aoa } (an array of cell-arrays).
// Returned in display order so the workbook tabs come out in that order.
//   Positions      — [name, position] (also the student list and its order): where the PDF
//                    was last left for that student, as a fractional page (3.25 = a
//                    quarter into page 3; see pdfScrollPos), blank when not known yet
//   Feedback       — [name, feedback]
//   Student_groups — [name, group] (group blank when none)
//   Grading_Scheme — one row per question: [title, "score1 score2 ..."] (the
//                    questions and their score options; column 2 is a list string)
//   Grades         — students × questions matrix, cell = obtained grade (number), left
//                    blank for a question that has not been graded yet
//   Comments       — students × questions matrix, cell = comment
//   Total          — [name, total, max_possible] (written for convenience, never read back)
function buildWorkbook() {
  // Each student now owns its own questions, so the Grades, Comments and
  // Grading_Scheme sheets use a per-student "alternating" layout: a header row
  // [name, ...question titles] immediately followed by a data row ["", ...values]
  // (blank first cell so the parser can tell headers from data). When there are no
  // students yet, emit one pair under a blank name so a draft scheme is at least
  // recorded in the file (a student is needed to reload it, since questions are
  // owned per student).
  const names = students.length ? students : [""];

  // Build an alternating sheet: cellFn(name, q) yields each data-row cell. The header
  // cell is the question key (qKey) so same-title questions in different groups stay
  // distinct across a save/reload; default-group questions keep a plain-title header.
  const alternating = (cellFn) => {
    const rows = [];
    for (const n of names) {
      const scheme = schemeFor(n);
      rows.push([n, ...scheme.map(q => qKey(q))]);
      rows.push(["", ...scheme.map(q => cellFn(n, q))]);
    }
    return rows;
  };

  // Emit grades as numeric cells (not formatted strings) so they survive Excel
  // round-trips and locale differences. A question that has not been graded yet writes
  // an empty cell — that blank is what makes "ungraded" distinct from "graded 0", and
  // loadWorkbook reads it back as no grade at all.
  const gradeCell = (n, q) => {
    const v = (n && gradesByStudent[n]) ? gradesByStudent[n][qKey(q)] : undefined;
    return isGraded(v) ? v : "";
  };

  return [
    { name: "Positions",      aoa: students.map(n => [n, scrollPosByStudent[n] >= 1 ? scrollPosByStudent[n] : ""]) },
    { name: "Feedback",      aoa: students.map(n => [n, feedbackByStudent[n] || ""]) },
    { name: "Student_groups", aoa: students.map(n => [n, groupByStudent[n] || ""]) },
    // Per student: [name, ...titles] then ["", ..."score1 score2 ..." per question].
    { name: "Grading_Scheme", aoa: alternating((n, q) => scoreSpecText(q)) },
    { name: "Grades",         aoa: alternating(gradeCell) },
    { name: "Comments",       aoa: alternating((n, q) => (n && commentsByStudent[n] && commentsByStudent[n][qKey(q)]) || "") },
    // Convenience only: the running total next to the full max of every question.
    { name: "Total",          aoa: students.map(n => [n, computeTotals(n).sum, schemeMax(n)]) },
  ];
}

// Trigger a browser download of `data` (a string or bytes) as `filename` with the given MIME type.
function downloadFile(filename, data, mime) {
  const blob = new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function saveGrades() {
  if (students.length === 0 && schemeQuestions.length === 0) {
    alert("Nothing to save yet — add a question or a student first.");
    return;
  }
  if (!window.XLSX) {
    alert("Spreadsheet library failed to load. Check your internet connection (SheetJS is loaded from a CDN).");
    return;
  }
  saveCurrentStudent();
  const wb = XLSX.utils.book_new();
  for (const { name, aoa } of buildWorkbook())
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);
  // .ods extension → SheetJS writes ODS; compression: true DEFLATEs the zip
  // entries (otherwise they are stored uncompressed). Triggers the download.
  XLSX.writeFile(wb, "grades.ods", { compression: true });
}

// Escape a string for safe insertion into HTML text/attribute content.
function htmlEscape(s) {
  s = (s === null || s === undefined) ? "" : String(s);
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Build a standalone, print-ready HTML document: one bordered slip per student,
// language-agnostic (no labels), ready to print and cut apart. Reuses
// computeTotals() and fmt() so totals match the on-screen UI exactly.
function buildGradesHTML() {
  const slips = students.map(name => {
    const scheme = schemeFor(name);
    const total = computeTotals(name);
    const grades = gradesByStudent[name] || {};
    const comments = commentsByStudent[name] || {};
    const feedback = (feedbackByStudent[name] || "").trim();
    const groupTotals = computeGroupTotals(name);

    const qrow = (q) => {
      // A question that was never graded prints an en dash instead of a score, and counts
      // toward neither the group subtotal nor the slip total.
      const v = grades[qKey(q)];
      const graded = isGraded(v);
      const comment = (comments[qKey(q)] || "").trim();
      return (
        '<div class="qrow' + (graded ? '' : ' ungraded') + '">' +
          '<div class="qtitle">' + htmlEscape(q.title) + '</div>' +
          (comment ? '<div class="qcomment">' + htmlEscape(comment) + '</div>' : '') +
          '<div class="qpts">' + (graded ? htmlEscape(fmt(v)) : '&ndash;') + ' / ' + htmlEscape(fmt(q.max)) + '</div>' +
        '</div>'
      );
    };

    // Group by group, matching the on-screen list: each group gets a header row with
    // its subtotal. The default group ("") gets a blank-named header too, but only when
    // it sits alongside named groups; a plain ungrouped slip stays flat.
    const groupList = groupedScheme(scheme);
    const rows = groupList.map(grp => {
      let html = "";
      if (grp.group || groupList.length > 1) {
        const t = groupTotals[grp.group] || { sum: 0, max: 0 };
        // The default (empty-named) group prints its header bar but no subtotal points.
        const sub = grp.group
          ? '<div class="qgsub">' + htmlEscape(fmt(t.sum)) + ' / ' + htmlEscape(fmt(t.max)) + '</div>'
          : '';
        html += '<div class="qgroup">' +
                  '<div class="qgname">' + htmlEscape(grp.group) + '</div>' +
                  sub +
                '</div>';
      }
      return html + grp.questions.map(qrow).join("");
    }).join("");

    return (
      '<div class="slip">' +
        '<div class="head">' +
          '<div class="name">' + htmlEscape(name) + '</div>' +
        '</div>' +
        (rows ? '<div class="questions">' + rows + '</div>' : '') +
        // Last row: feedback on the left, total on the right (total alone if no feedback).
        '<div class="sumrow">' +
          (feedback ? '<div class="feedback">' + htmlEscape(feedback) + '</div>' : '') +
          '<div class="total">' + htmlEscape(fmt(total.sum)) + ' / ' + htmlEscape(fmt(total.max)) + '</div>' +
        '</div>' +
      '</div>'
    );
  }).join("");

  return (
'<!DOCTYPE html>\n' +
'<html lang="en">\n<head>\n<meta charset="UTF-8">\n' +
'<title>Grades</title>\n' +
'<style>\n' +
'  * { box-sizing: border-box; }\n' +
'  body {\n' +
'    margin: 24px;\n' +
'    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;\n' +
'    color: #1f2937;\n' +
'    background: #f4f5f7;\n' +
'  }\n' +
'  .sheet { column-count: 3; column-gap: 12px; }\n' +
'  .slip {\n' +
'    border: 1px solid #d7dbe0;\n' +
'    border-radius: 8px;\n' +
'    background: #fff;\n' +
'    padding: 12px 14px;\n' +
'    margin: 0 0 18px;\n' +
'    break-inside: avoid;\n' +
'    page-break-inside: avoid;\n' +
'  }\n' +
'  .head {\n' +
'    display: flex;\n' +
'    align-items: baseline;\n' +
'    justify-content: space-between;\n' +
'    gap: 16px;\n' +
'    border-bottom: 1px solid #eef0f3;\n' +
'    padding-bottom: 8px;\n' +
'  }\n' +
'  .name { font-size: 18px; font-weight: 700; }\n' +
'  .sumrow { display: flex; align-items: baseline; gap: 12px; margin-top: 10px; }\n' +
'  .questions + .sumrow { border-top: 2px solid #d7dbe0; padding-top: 8px; }\n' +
'  .total { margin-left: auto; font-size: 18px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }\n' +
'  .feedback {\n' +
'    flex: 1 1 auto;\n' +
'    min-width: 0;\n' +
'    font-size: 14px;\n' +
'    font-style: italic;\n' +
'    color: #374151;\n' +
'    white-space: pre-wrap;\n' +
'  }\n' +
'  .questions { margin-top: 10px; }\n' +
'  .qrow {\n' +
'    display: flex;\n' +
'    align-items: baseline;\n' +
'    gap: 8px;\n' +
'    padding: 5px 0;\n' +
'    border-top: 1px solid #f3f4f6;\n' +
'  }\n' +
'  .qrow:first-child { border-top: 0; }\n' +
'  .qgroup {\n' +
'    display: flex;\n' +
'    align-items: baseline;\n' +
'    justify-content: space-between;\n' +
'    gap: 12px;\n' +
'    margin-top: 8px;\n' +
'    padding: 5px 0 3px;\n' +
'    border-top: 2px solid #d7dbe0;\n' +
'  }\n' +
'  .questions > .qgroup:first-child { border-top: 0; margin-top: 0; }\n' +
'  .qgname { font-weight: 700; font-size: 14px; }\n' +
'  .qgsub { font-size: 13px; font-weight: 700; color: #6b7280; white-space: nowrap; font-variant-numeric: tabular-nums; }\n' +
'  .qgroup + .qrow { border-top: 0; }\n' +
'  .qtitle { flex: 0 0 auto; font-weight: 600; font-size: 14px; }\n' +
'  .qcomment {\n' +
'    flex: 1 1 auto;\n' +
'    min-width: 0;\n' +
'    font-size: 13px;\n' +
'    color: #6b7280;\n' +
'    white-space: pre-wrap;\n' +
'  }\n' +
'  .qpts { flex: 0 0 auto; margin-left: auto; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }\n' +
'  .qrow.ungraded .qpts { color: #9ca3af; }\n' +
'  @media print {\n' +
'    body { margin: 0; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n' +
'    @page { margin: 12mm; }\n' +
'  }\n' +
'</style>\n</head>\n<body>\n' +
'<div class="sheet">' + slips + '</div>' +
'\n</body>\n</html>\n'
  );
}

// =====================================================================

function readFile(input, asArrayBuffer, callback) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => callback(reader.result, file.name);
  if (asArrayBuffer) reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
  input.value = ""; // allow re-importing the same file
}

// Open the PDF(s) picked in the file dialog. Several files are merged (in file-name order)
// into one document with pdf-lib, which the rest of the app then sees as a single PDF.
async function openPdfFiles(input) {
  const files = Array.from(input.files || []).sort((a, b) => compareNames(a.name, b.name));
  input.value = ""; // allow re-opening the same selection
  if (files.length === 0) return;
  if (files.length === 1) {
    renderPdf(await files[0].arrayBuffer(), files[0].name);
    return;
  }
  if (!window.PDFLib) {
    alert("PDF writing library failed to load. Check your internet connection (pdf-lib is loaded from a CDN).");
    return;
  }
  let current = "";
  try {
    const merged = await PDFLib.PDFDocument.create();
    for (const f of files) {
      current = f.name;
      const src = await PDFLib.PDFDocument.load(await f.arrayBuffer(), { ignoreEncryption: true });
      for (const p of await merged.copyPages(src, src.getPageIndices())) merged.addPage(p);
    }
    const bytes = await merged.save();
    renderPdf(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength), "merged.pdf");
  } catch (err) {
    alert('Could not merge the PDFs ("' + current + '"): ' + (err && err.message ? err.message : err));
  }
}

// The page selector's own ▲/▼, and the arrow keys (and wheel, when focused) in it, go back/forward
// like the PDF does (the browser's stepping, like its hidden spinner, goes the other way).
function invertStepping(input, step) {
  input.addEventListener("keydown", e => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    step(e.key === "ArrowUp" ? -1 : 1);
  });
  input.addEventListener("wheel", e => {
    if (document.activeElement !== input || !e.deltaY) return;
    e.preventDefault();   // also tells the "scroll PDF from anywhere" handler to skip it
    step(e.deltaY < 0 ? -1 : 1);
  }, { passive: false });
}
const onButtonPress = (btn, action) => btn.addEventListener("mousedown", e => {

redrawComboOnInput(globalFeedback);
// Like the comment boxes: only the arrow unfolds the list.
globalFeedback._comboArrowOnly = true;
document.getElementById("feedbackArrow").addEventListener("mousedown", e => {
  e.preventDefault(); // keep focus where it is
  (activeComboInput === globalFeedback && comboPopup.classList.contains("open"))
    ? closeCombo() : openCombo(globalFeedback);
});

// Zoom controls.
document.getElementById("btnPdfZoomIn").addEventListener("click", () => zoomPdf(1.2));
document.getElementById("btnPdfZoomOut").addEventListener("click", () => zoomPdf(1 / 1.2));
document.getElementById("btnGradeZoomIn").addEventListener("click", () => zoomGrade(1.1));
document.getElementById("btnGradeZoomOut").addEventListener("click", () => zoomGrade(1 / 1.1));

// Select a score the instant the mouse is pressed (no waiting for the synthesized
// "click"), so options respond with zero delay. Delegated so it covers re-renders.
let pressedOption = null;      // the option whose press we already applied (see below)
questionsEl.addEventListener("pointerdown", e => {
  const opt = e.target.closest(".opt");
  if (!opt) return;            // ignore presses on the scrollbar / gaps
  if (e.button !== undefined && e.button !== 0) return; // left button only
  e.preventDefault();          // skip the browser's click synthesis/delay
  pressedOption = opt;
  opt.classList.add("pressing");   // ...which also suppresses :active, so say it ourselves
  pressOption(opt);
});
// Let go anywhere: no key is held any more.
const releaseOption = () => {
  questionsEl.querySelectorAll(".opt.pressing").forEach(o => o.classList.remove("pressing"));
};
document.addEventListener("pointerup", releaseOption);
document.addEventListener("pointercancel", releaseOption);

// Middle-click inside the question list or the student bar steps to the next student
// (from the last, back to the first). Preventing the default on mousedown is what
// suppresses the browser's autoscroll, so the press is swallowed even when there is no
// other student to go to (see moveStudent).
function nextStudentOnMiddleClick(e) {
  if (e.button !== 1) return;
  e.preventDefault();
  moveStudent(1);
}
questionsEl.addEventListener("mousedown", nextStudentOnMiddleClick);
document.getElementById("studentBar").addEventListener("mousedown", nextStudentOnMiddleClick);

// Canceling pointerdown suppresses the compatibility mouse events but not the click that
// follows. Ignore exactly the click belonging to a press we already applied; a click with no
// preceding press is a keyboard activation (Space/Enter on a focused key), which grades.
questionsEl.addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (!opt) return;
  if (opt === pressedOption) e.preventDefault();
  else pressOption(opt);
  pressedOption = null;
}, true);

// Edit, remove or reorder a question/group via its row buttons (delegated so it covers
// re-renders). Remove and the arrows are only rendered on the row being edited.
questionsEl.addEventListener("click", e => {
  const ed = e.target.closest(".qedit");
  if (ed) {
    ed.closest(".question").classList.contains("editing") ? commitEdit() : beginEdit(ed.dataset.key);
    return;
  }
  const grm = e.target.closest(".qgremove"); // group remove — check first (also carries .qremove)
  if (grm) { removeGroup(grm.dataset.group); return; }
  const rm = e.target.closest(".qremove");
  if (rm) {
    if (rm.closest(".question").dataset.draft) cancelDraft(); // nothing created yet, nothing to confirm
    else { editingKey = null; removeQuestion(rm.dataset.key); }
    return;
  }
  const gmv = e.target.closest(".qgmove"); // group move — check first (also carries .qmove)
  if (gmv) { if (!gmv.disabled) moveGroup(gmv.dataset.group, gmv.dataset.dir); return; }
  const mv = e.target.closest(".qmove");
  if (!mv || mv.disabled) return;
  // The arrows live on the edited row, so apply what was typed first and keep it open —
  // its key may have just changed.
  const key = commitEdit();
  if (key === false || !key) return;
  editingKey = key;
  moveQuestion(key, mv.dataset.dir);
});

// Enter applies the edited question, Escape leaves it as it was (and drops a new one).
questionsEl.addEventListener("keydown", e => {
  if (!e.target.closest || !e.target.closest(".question.editing")) return;
  if (e.key === "Enter") { e.preventDefault(); commitEdit(); }
  else if (e.key === "Escape" && !comboPopup.classList.contains("open")) {
    e.preventDefault();
    cancelDraft();   // also clears editingKey, discarding the untouched edit
  }
});

// Adding a question opens a blank row in edit mode; it is created when that row is applied.
document.getElementById("aqAdd").addEventListener("click", startNewQuestion);

// Close the comment popup on outside click, Escape, grading-list scroll, or resize.
document.addEventListener("pointerdown", e => {
  if (!comboPopup.classList.contains("open")) return;
  if (comboPopup.contains(e.target)) return;
  // Only the combo the list belongs to handles itself (its box and its arrow); pressing any
  // other one folds this list, which would otherwise hang over the box it was opened from.
  const combo = e.target.closest && e.target.closest(".combo");
  if (combo && activeComboInput && combo.contains(activeComboInput)) return;
  closeCombo();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || !comboPopup.classList.contains("open")) return;
  // A row being edited is what Escape backs out of; the list itself stays open.
  const input = activeComboInput;
  if (input && input._bank && (comboEditIndex >= 0 || comboDraft !== null)) {
    cancelBankEdit(input);
    return;
  }
  closeCombo();
});
// A box keeps focus after its list closes (a pick, Escape, a scroll), and focus alone
// won't fire again — so a click on a combo box reopens its list too. "click", not
// "mousedown": on a first click, focus (fired on mousedown) has already opened it.
// Boxes marked _comboArrowOnly are exempt: their list is the arrow's business alone.
document.addEventListener("click", e => {
  const input = e.target.closest && e.target.closest(".combo input");
  if (!input || !input._comboItems || input._comboArrowOnly) return;
  if (activeComboInput === input && comboPopup.classList.contains("open")) return;
  openCombo(input);
});
questionsEl.addEventListener("scroll", () => { if (comboPopup.classList.contains("open")) closeCombo(); });
window.addEventListener("resize", () => { if (comboPopup.classList.contains("open")) closeCombo(); });

btnSavePdf.addEventListener("click", savePdf);
btnRotatePage.addEventListener("click", rotateCurrentPage);
btnDeletePage.addEventListener("click", deleteCurrentPage);
btnPageUp.addEventListener("click", () => movePage(-1));
btnPageDown.addEventListener("click", () => movePage(1));

// Page navigation: typing a position (5 = top of page 5, 5.5 = halfway into it) and
// pressing Enter jumps there; its ▲/▼ step a whole page (stepPdfPage).
pageInput.addEventListener("change", () => {
  const v = parseFloat(pageInput.value);
  if (v >= 1) scrollPdfTo(v);
  else showPdfPosition();
});

// Keep the page selector (the exact position) in sync as the PDF is scrolled.
let pageSyncRaf = null;
pdfPane.addEventListener("scroll", () => {
  if (pageSyncRaf) return;
  pageSyncRaf = requestAnimationFrame(() => {
    pageSyncRaf = null;
    if (pageCanvases.length === 0) return;
    showPdfPosition();
    recordPositionIfOn();
  });
});

// Mouse wheel always scrolls the PDF, from anywhere on the page (including over
// the grading area), unless a combo list is open. The grading list can still be
// scrolled by dragging its scrollbar.
window.addEventListener("wheel", e => {
  if (!onlyScrollPdf.checked) return; // let the hovered area scroll natively
  if (e.defaultPrevented) return;     // already handled (a focused page box steps instead)
  if (comboPopup.classList.contains("open")) return; // a combo is open: scroll natively
  if (pdfPane.scrollHeight <= pdfPane.clientHeight) return; // nothing to scroll
  pdfPane.scrollTop += e.deltaY;
  e.preventDefault();
}, { passive: false });

// Drag the divider to reallocate horizontal space between the PDF and grading panes.
// Pointer capture keeps the drag tracking even when the cursor is over the PDF canvas.
const appEl = document.getElementById("app");
const leftPane = document.getElementById("left");
const divider = progressEl;   // the progress strip doubles as the divider
let draggingSplit = false;
divider.addEventListener("pointerdown", e => {
  draggingSplit = true;
  divider.setPointerCapture(e.pointerId);
  document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none";
  e.preventDefault();
});
divider.addEventListener("pointermove", e => {
  if (!draggingSplit) return;
  const rect = appEl.getBoundingClientRect();
  const w = e.clientX - rect.left;
  const min = rect.width * 0.2, max = rect.width * 0.8;
  leftPane.style.width = Math.min(max, Math.max(min, w)) + "px";
});
const endDrag = e => {
  if (!draggingSplit) return;
  draggingSplit = false;
  try { divider.releasePointerCapture(e.pointerId); } catch (_) {}
  document.body.style.cursor = "";
  document.body.style.userSelect = "";
};
divider.addEventListener("pointerup", endDrag);
divider.addEventListener("pointercancel", endDrag);

updateNavButtons();
refreshPositionButton();
</script>
</body>
</html>
